name: Points game questions

# أسئلة لعبة "جمع نقاط": البنك المكتوب + صور ويكيبيديا + أسئلة الكورة من بيانات اللاعبين
on:
  push:
    branches: [main]
    paths: ["engine/points_build.py", "engine/points_bank.txt", "engine/points_countries.txt", ".github/workflows/points.yml",
            "docs/games/players.json", "docs/games/career.json"]
  schedule:
    - cron: "23 5 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: points-questions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          set -o pipefail
          python -u engine/points_build.py 2>&1 | tee docs/games/points_build.log
      - name: Save
        if: always()
        run: |
          git config user.name "thiqa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/games/points_q.json docs/games/points_img.json docs/games/points_audio.json docs/games/points_video.json docs/games/points_build.log
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Points game questions $(date +%F)"
            git pull --rebase -X theirs origin main || git rebase --abort
            git push
          fi
