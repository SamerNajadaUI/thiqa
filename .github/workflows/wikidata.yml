name: Wikidata quiz data

# بيانات «جمع نقاط» من Wikidata (الجلسة السحابية ما بتوصلها)
on:
  push:
    branches: [main]
    paths: [".github/workflows/wikidata.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "مفاتيح مفصولة بمسافة (فاضي = الكل)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: wikidata-quiz
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        run: mkdir -p engine/wd && python -u engine/wd_fetch.py ${{ github.event.inputs.only }} 2>&1 | tee engine/wd/_log.txt
      - name: Save
        if: always()
        run: |
          git config user.name "thiqa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add engine/wd/
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Wikidata quiz data $(date +%F)"
            git pull --rebase -X theirs origin main || git rebase --abort
            git push
          fi
