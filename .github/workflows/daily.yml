name: Daily picks

on:
  schedule:
    # 03:07 UTC = 06:07 بتوقيت عمّان كل يوم
    - cron: "7 3 * * *"
  workflow_dispatch: {}   # زر "Run workflow" للتشغيل اليدوي

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build today's list and update results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python engine/run.py

      - name: Save data
        run: |
          git config user.name "thiqa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily picks $(TZ=Asia/Amman date +%F)"
            git push
          fi
