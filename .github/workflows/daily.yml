name: Daily picks

on:
  schedule:
    # 03:07 UTC = 06:07 بتوقيت عمّان: قسائم اليوم (بتصرف رصيد الأودز)
    - cron: "7 3 * * *"
    # كل ساعة: نتائج مباشرة ونهائية وشعارات (مجاني)
    - cron: "37 * * * *"
  # تعديل ملف .github/run-full بيشغّل تحديث كامل فوراً (بيصرف رصيد)
  push:
    branches: [main]
    paths: [".github/run-full"]
  workflow_dispatch:
    inputs:
      mode:
        description: "hourly = تحديث النتائج بس (مجاني)، full = قسائم جديدة (بيصرف رصيد)"
        type: choice
        options: [hourly, full]
        default: hourly

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update picks and results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$SCHEDULE" = "7 3 * * *" ] || [ "$MODE" = "full" ] || [ "$EVENT" = "push" ]; then
            python engine/run.py
          else
            python engine/run.py --hourly
          fi

      - name: Save data
        run: |
          git config user.name "thiqa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update $(TZ=Asia/Amman date '+%F %H:%M')"
            git pull --rebase -X theirs origin main || git rebase --abort
            git push
          fi
