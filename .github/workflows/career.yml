name: Career game data

# بيانات لعبة "مسيرة لاعب": المسيرة والشعارات من Wikidata وESPN، كل أسبوع ولما يتغير المولّد
on:
  push:
    branches: [main]
    paths: ["engine/career.py", "engine/career_names.txt", ".github/workflows/career.yml"]
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: career-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          set -o pipefail
          python -u engine/career.py 2>&1 | tee docs/games/career_build.log
      - name: Save
        if: always()
        run: |
          git config user.name "thiqa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/games/career.json docs/games/career_build.log
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Career game data $(date +%F)"
            git pull --rebase -X theirs origin main || git rebase --abort
            git push
          fi
