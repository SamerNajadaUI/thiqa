name: iOS app

# بيبني تطبيق الآيفون على ماك من GitHub (ببلاش للمستودعات العامة)
# وبيحط ملف AbuOdeh.ipa بصفحة Releases، جاهز للتركيب بـ Sideloadly.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Zip the ready Xcode project (to open and run from your own Mac)
        run: |
          rm -rf /tmp/AbuOdeh-Xcode && mkdir -p /tmp/AbuOdeh-Xcode
          cp -R ios/AbuOdeh ios/AbuOdeh.xcodeproj ios/README.md /tmp/AbuOdeh-Xcode/
          (cd /tmp && zip -qry "$GITHUB_WORKSPACE/ios/AbuOdeh-Xcode.zip" AbuOdeh-Xcode)
          ls -la ios/AbuOdeh-Xcode.zip

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project AbuOdeh.xcodeproj -scheme AbuOdeh -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package the .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AbuOdeh.app Payload/
          zip -qry AbuOdeh.ipa Payload
          ls -la AbuOdeh.ipa

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ios
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest AbuOdeh.ipa AbuOdeh-Xcode.zip \
            --title "أبو عودة للآيفون" \
            --notes "طريقتين: AbuOdeh-Xcode.zip تفتحه بـ Xcode على الماك وتشغّله على تلفونك مباشرة، أو AbuOdeh.ipa تركّبه بـ Sideloadly. التعليمات بـ ios/README.md"
