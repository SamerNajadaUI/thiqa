name: Hair crops

# قصّات الشعر للعبة «تسريحة لاعب» (كشف الوجه بـOpenCV)، كل أسبوع ولما يتغير السكربت
on:
  push:
    branches: [main]
    paths: ["engine/hair_build.py", ".github/workflows/hair.yml"]
  schedule:
    - cron: "41 5 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hair-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opencv-python-headless numpy pillow
      - name: Build
        run: python -u engine/hair_build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hair-sheet
          path: engine/hair_sheet.jpg
          if-no-files-found: ignore
      - name: Save
        run: |
          git config user.name "thiqa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/games/hair.json engine/hair_sheet.jpg
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Hair crops $(date +%F)"
            git pull --rebase -X theirs origin main || git rebase --abort
            git push
          fi
