name: AbuOdeh
options:
  bundleIdPrefix: io.github.samernajadaui
  deploymentTarget:
    iOS: "16.0"
targets:
  AbuOdeh:
    type: application
    platform: iOS
    sources: [AbuOdeh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.samernajadaui.abuodeh
        PRODUCT_NAME: AbuOdeh
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "أبو عودة"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
