<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFAF4">
<script src="theme.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="أبو عودة للمرح">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="ds/ui.css">
<style>html,body{margin:0;touch-action:manipulation}body{font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}*{box-sizing:border-box}</style>
<script src="app/firebase-config.js"></script>
<script src="app/core.js"></script>
<title>الإعدادات — أبو عودة للمرح</title>
</head>
<body>
<div class="app-wrap" id="page"></div>
<script src="shell.js"></script>
<script src="app/ui.js"></script>
<script>
const esc = AppUI.esc;
function render() {
  const u = Auth.user(); if (!u) return;
  const how = { google: "جوجل", apple: "أبل", phone: u.phone || "رقم جوال", admin: "أدمن", local: "على الجهاز" }[u.provider] || "";
  document.getElementById("page").innerHTML = `
    <h1 class="h-hero">الإعدادات</h1>
    <section class="card row fade-in"><span class="avatar">${esc(AppUI.initial(u.name))}</span>
      <div class="grow"><b>${esc(u.name)}</b><div class="sub" dir="auto">دخول بـ<bdi dir="ltr">${esc(how)}</bdi></div></div>${AppUI.planBadge(u.plan)}</section>
    <section class="stack"><h2 class="sec-title">الحساب</h2>
      <div class="card stack"><div class="field"><label for="nm">اسمك</label><input class="input" id="nm" maxlength="20" value="${esc(u.name)}"></div>
        <button class="btn btn-primary" id="save" type="button">احفظ الاسم</button></div>
      <div class="list"><a class="li" href="rewards.html#plans"><span class="ic">⭐</span><span><b>الخطة</b><small>${(Rewards.PLANS[u.plan] || Rewards.PLANS.free).name}</small></span><span class="end">‹</span></a></div>
    </section>
    <section class="stack"><h2 class="sec-title">المظهر</h2>
      <div class="card row"><span class="grow"><b>فاتح / غامق</b><div class="sub">أو حسب جهازك</div></span>${themeSwitch()}</div></section>
    <section class="stack"><h2 class="sec-title">عن التطبيق</h2>
      <div class="list">
        <div class="li"><span class="ic">📱</span><span><b>أبو عودة للمرح</b><small>ألعاب كورة مع صحابك</small></span></div>
        <div class="li"><span class="ic">🔐</span><span><b>وضع الحسابات</b><small>${Auth.mode === "firebase" ? "Firebase" : "تجريبي على الجهاز"}</small></span></div>
      </div></section>
    <button class="btn btn-ghost btn-block" id="out" type="button">تسجيل الخروج</button>`;
  document.getElementById("save").onclick = () => { const n = document.getElementById("nm").value.trim().slice(0, 20); if (!n) return uiToast("اكتب اسم"); Auth.update({ name: n }); uiToast("انحفظ"); render(); };
  document.getElementById("out").onclick = () => { Auth.signOut(); location.replace("login.html"); };
}
render();
AppUI.tabs("settings");
</script>
</body>
</html>
