const splitEmo = (q) => { const m = q.match(/^([^؀-ۿ«(]+)\s*(.*)$/); return m ? [m[1].trim(), m[2].trim()] : ["", q]; };

  load: async () => {
    let bank = [];
    try { bank = await koraFromPoints({ emojiplayers: true }); } catch {}
    const a = bank.map((x) => { const [e, t] = splitEmo(x.q); return { d: x.d, q: t || "مين؟", opts: x.opts, vis: `<div class="emo">${esc(e)}</div>` }; });

  } });
