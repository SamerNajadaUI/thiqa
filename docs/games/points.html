<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جمع نقاط</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="أبو عودة للمرح">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: same chunky game-app skin as the main app. One screen at a time: games list -> mode -> level -> era -> player card, or challenges -> challenge. Light-only by design. */
:root {
  color-scheme: light;
  --bg: #FFFFFF; --soft: #F4F5F7; --line: #ECEEF1; --ink: #111316; --muted: #6B7280; --faint: #A9AEB6;
  --brand: #5B3DF5; --brand-dark: #3F25C9; --brand-soft: #EEEAFF;
  --l1: #12B76A; --l1d: #0A8A4F; --l1s: #E6F8EF;
  --l2: #F79009; --l2d: #C26A00; --l2s: #FEF3E2;
  --l3: #F04438; --l3d: #B42318; --l3s: #FEECEA;
  --l4: #1D2939; --l4d: #000000; --l4s: #EAECF0;
  --gold: #FDB022; --gold-dark: #DC6803;
  --font: "Readex Pro", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
  --display: "Lalezar", "Readex Pro", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
bdi { unicode-bidi: isolate; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--soft); border-radius: 16px; padding: 10px 14px; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); }
.back svg { width: 18px; height: 18px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand img { width: 44px; height: 44px; border-radius: 14px; box-shadow: 0 4px 0 var(--brand-dark); }
.brand b { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 9vw, 44px); line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 4px 0 0; }

/* big chunky buttons/cards */
.tile { --c: var(--brand); --cd: var(--brand-dark); --cs: var(--brand-soft);
  display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: right; width: 100%;
  background: #FFFFFF; border: 2px solid var(--cs); border-radius: 28px; padding: 16px; box-shadow: 0 6px 0 var(--cs); transition: transform .1s; }
.tile:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--cs); }
.tile .ic { width: 64px; height: 64px; border-radius: 20px; background: var(--c); box-shadow: 0 4px 0 var(--cd); display: grid; place-items: center; color: #FFFFFF; }
.tile .ic svg { width: 34px; height: 34px; }
.tile b { display: block; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.2; }
.tile small { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; }
.tile .go { width: 36px; height: 36px; border-radius: 50%; background: var(--cs); color: var(--c); display: grid; place-items: center; }
.tile .go svg { width: 18px; height: 18px; }
.tile.l1 { --c: var(--l1); --cd: var(--l1d); --cs: var(--l1s); }
.tile.l2 { --c: var(--l2); --cd: var(--l2d); --cs: var(--l2s); }
.tile.l3 { --c: var(--l3); --cd: var(--l3d); --cs: var(--l3s); }
.tile.l4 { --c: var(--l4); --cd: var(--l4d); --cs: var(--l4s); }
.tile.coral { --c: #FF5A5F; --cd: #D63B40; --cs: #FFECEC; text-decoration: none; color: var(--ink); }
.tile.sky { --c: #0BA5EC; --cd: #0086C9; --cs: #E0F2FE; text-decoration: none; color: var(--ink); }
.tile.gold { --c: var(--gold); --cd: var(--gold-dark); --cs: #FEF0C7; }
.tile .ic .lvnum { font-family: var(--display); font-size: 30px; line-height: 1; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.soon { color: var(--faint); font-size: 13px; text-align: center; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.seg button { border: 2px solid var(--line); background: #FFFFFF; border-radius: 20px; padding: 14px 8px; font-weight: 600; box-shadow: 0 4px 0 var(--line); }
.seg button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); box-shadow: 0 4px 0 #D9D1FF; }
.big { border: 0; width: 100%; background: var(--brand); color: #FFFFFF; border-radius: 22px; padding: 16px; font-family: var(--display); font-size: 24px; box-shadow: 0 6px 0 var(--brand-dark); }
.big:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--brand-dark); }
.big.green { background: var(--l1); box-shadow: 0 6px 0 var(--l1d); }
.big.red { background: var(--l3); box-shadow: 0 6px 0 var(--l3d); }
.big.ghost { background: var(--soft); color: var(--ink); box-shadow: 0 6px 0 var(--line); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* player card */
.pcard { position: relative; border-radius: 32px; overflow: hidden; background: #FFFFFF; border: 2px solid var(--cs, var(--brand-soft)); box-shadow: 0 8px 0 var(--cs, var(--brand-soft)); }
.pcard.l1 { --c: var(--l1); --cs: var(--l1s); } .pcard.l2 { --c: var(--l2); --cs: var(--l2s); }
.pcard.l3 { --c: var(--l3); --cs: var(--l3s); } .pcard.l4 { --c: var(--l4); --cs: var(--l4s); }
.photo { position: relative; aspect-ratio: 4 / 3.4; max-width: 100%; background: linear-gradient(180deg, var(--cs), #FFFFFF); display: grid; place-items: center; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
.photo .ini { font-family: var(--display); font-size: 72px; color: var(--c); }
.badge { position: absolute; top: 14px; right: 14px; background: var(--c); color: #FFFFFF; font-weight: 700; font-size: 12px; padding: 6px 12px; border-radius: 999px; }
.badge.era { right: auto; left: 14px; background: rgb(17 19 22 / .72); }
.pname { padding: 16px 18px 4px; }
.pname b { display: block; font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.15; }
.pname span { color: var(--muted); font-size: 14px; direction: ltr; display: block; text-align: right; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px; }
.fact { background: var(--soft); border-radius: 18px; padding: 10px 8px; text-align: center; min-width: 0; }
.fact small { display: block; color: var(--muted); font-size: 11px; }
.fact b { display: block; font-weight: 600; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.clubs { padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.clubs h3 { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--soft); border-radius: 14px; padding: 6px 10px; font-size: 13px; font-weight: 500; }
.chip .yr { color: var(--muted); font-size: 11px; direction: ltr; display: inline-block; margin-inline-start: 6px; padding-inline-start: 6px; border-inline-start: 1px solid var(--line); }
.chip.nt { background: var(--brand-soft); color: var(--brand-dark); }
.cover { position: absolute; inset: 0; background: var(--brand); color: #FFFFFF; display: grid; place-items: center; text-align: center; padding: 24px; z-index: 2; border: 0; width: 100%; }
.cover b { font-family: var(--display); font-weight: 400; font-size: 34px; display: block; }
.cover small { opacity: .85; font-size: 14px; }
.credit { color: var(--faint); font-size: 11px; text-align: center; }

.hud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hud div { background: var(--soft); border-radius: 20px; padding: 10px; text-align: center; }
.hud b { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.1; direction: ltr; }
.hud small { color: var(--muted); font-size: 11px; }
.qbtn { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.qbtn .big { font-size: 20px; }
.minus { border: 0; background: var(--soft); border-radius: 22px; width: 64px; font-size: 24px; box-shadow: 0 6px 0 var(--line); }

.result { text-align: center; background: var(--l1s); border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 6px; }
.result.lose { background: var(--l3s); }
.result b { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.2; }

/* challenges */
.prompt { background: var(--brand); color: #FFFFFF; border-radius: 28px; padding: 22px; box-shadow: 0 8px 0 var(--brand-dark); }
.prompt small { opacity: .85; }
.prompt b { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.3; margin-top: 4px; }
.timer { font-family: var(--display); font-size: 56px; text-align: center; line-height: 1; direction: ltr; margin-top: 10px; }
.timer.low { color: var(--l3); }
.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ans { display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: #FFFFFF; border-radius: 18px; padding: 8px 10px; text-align: right; min-width: 0; font-size: 13px; font-weight: 600; }
.ans img, .ans .mini { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; background: var(--soft); display: grid; place-items: center; font-size: 11px; color: var(--muted); }
.ans span { min-width: 0; overflow-wrap: anywhere; line-height: 1.35; }
.ans.hidden span { filter: blur(6px); }
.ans.hidden img { filter: blur(6px); }
.ans.got { border-color: var(--l1); background: var(--l1s); }
.note { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 0; }
.loading { text-align: center; color: var(--muted); padding: 40px 0; }

.pass2 { text-align: center; padding: 28px 18px; border-radius: 30px; background: var(--brand-soft); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.pass2 .who { font-family: var(--display); font-size: 46px; line-height: 1.1; color: var(--brand); overflow-wrap: anywhere; }
.namesin { display: flex; flex-direction: column; gap: 8px; }
.namesin input, .search { width: 100%; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; background: #FFFFFF; font-size: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pickbtn { border: 2px solid var(--line); background: #FFFFFF; border-radius: 20px; padding: 12px; text-align: right; box-shadow: 0 4px 0 var(--line); min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pickbtn b { font-size: 15px; overflow-wrap: anywhere; line-height: 1.35; }
.pickbtn small { color: var(--muted); font-size: 12px; }
.prow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; }
.prow img, .prow .mini2 { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--soft); display: grid; place-items: center; font-size: 12px; color: var(--muted); }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.crumbs button { border: 0; background: var(--soft); border-radius: 999px; padding: 4px 12px; font-weight: 600; }
.status3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 6px; }
.status3 div { background: var(--soft); border-radius: 18px; padding: 8px; text-align: center; min-width: 0; }
.status3 div.me { background: var(--brand-soft); box-shadow: inset 0 0 0 2px var(--brand); }
.status3 b { display: block; font-size: 13px; overflow-wrap: anywhere; }
.status3 span { font-family: var(--display); font-size: 22px; direction: ltr; display: block; line-height: 1.2; }
.status3 small { color: var(--muted); font-size: 11px; }
.hearts { color: var(--l3); letter-spacing: 2px; font-size: 14px; }
.hints { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.hints li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--soft); border-radius: 18px; padding: 10px 12px; }
.hints li span { width: 34px; height: 34px; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center; font-family: var(--display); font-size: 16px; color: var(--muted); }
.hints li.new { background: var(--gold); color: #1D2939; box-shadow: 0 4px 0 var(--gold-dark); }
.hints li.new span { color: var(--gold-dark); }
.hints li b { font-weight: 600; font-size: 15px; line-height: 1.5; }
.ptsnow { text-align: center; color: var(--muted); font-size: 13px; }
.ptsnow b { color: var(--ink); }
.helpers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.helpers button { border: 2px solid var(--gold); background: #FEF0C7; border-radius: 18px; padding: 10px; font-weight: 700; font-size: 14px; box-shadow: 0 4px 0 #FEDF89; }
.helpers button[disabled] { opacity: .4; }
.helpers button.armed { background: var(--gold); color: #1D2939; }
.opt20 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt20 button { border: 2px solid var(--line); background: #FFFFFF; border-radius: 18px; padding: 10px; font-weight: 600; font-size: 14px; text-align: right; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: center; min-width: 0; }
.opt20 img, .opt20 .mini2 { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--soft); display: grid; place-items: center; font-size: 11px; color: var(--muted); }
.opt20 button span { overflow-wrap: anywhere; line-height: 1.35; }
.mic { width: 100%; border: 2px solid var(--brand-soft); background: #FFFFFF; border-radius: 18px; padding: 14px 10px; font-weight: 700; font-size: 15px; color: var(--brand); box-shadow: 0 4px 0 var(--brand-soft); display: flex; align-items: center; justify-content: center; gap: 6px; }
.mic .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--l3); display: none; }
.mic.on { background: #FEE4E2; border-color: #F97066; color: #B42318; box-shadow: 0 4px 0 #FDA29B; animation: micpulse 1s ease-in-out infinite; }
.mic.on .dot { display: inline-block; }
@keyframes micpulse { 50% { transform: scale(1.03); } }
.ptimer { position: relative; height: 34px; border-radius: 999px; background: var(--soft); overflow: hidden; display: grid; place-items: center; }
.ptimer i { position: absolute; inset: 0 auto 0 0; width: 100%; background: linear-gradient(90deg, #12B76A, #32D583); transition: width .2s linear; }
.ptimer.hot i { background: linear-gradient(90deg, #F04438, #F97066); }
.ptimer span { position: relative; font-weight: 800; font-size: 15px; color: #0B1B10; }
.ptimer.hot span { color: #FFFFFF; animation: micpulse .6s ease-in-out infinite; }
.askbox { background: #FEF0C7; border: 2px solid var(--gold); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: center; }
.askbox > b { font-size: 20px; }
.linkish { border: 0; background: none; color: var(--muted); font-weight: 700; text-decoration: underline; padding: 4px; }
.wave { display: flex; gap: 4px; align-items: center; justify-content: center; height: 34px; }
.wave i { width: 5px; border-radius: 3px; background: #F04438; height: 6px; transition: height .08s; }
.clubbtn { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.crest { object-fit: contain; flex: none; }
.crest-fb { display: grid; place-items: center; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 800; font-size: 16px; }
.clubhead { display: flex; align-items: center; gap: 12px; }
.clubhead h1 { margin: 0; }
.flash { text-align: center; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.flash.good { background: var(--l1s); } .flash.badf { background: var(--l3s); }
.flash b { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.2; }
.board { display: flex; flex-direction: column; gap: 8px; }
.board .r { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--soft); border-radius: 18px; padding: 12px 14px; }
.board .r:first-child { background: #FEF0C7; }
.board .r .pos { font-family: var(--display); font-size: 20px; text-align: center; }
.board .r .t { font-family: var(--display); font-size: 26px; direction: ltr; }
.board .r small { grid-column: 2 / -1; color: var(--muted); font-size: 12px; }
.rules { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.7; }
.confirm { background: var(--l3s); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
@media (prefers-reduced-motion: no-preference) {
  .screen { animation: in .35s cubic-bezier(.2,.9,.3,1.15) both; }
  @keyframes in { from { transform: translateY(12px) scale(.985); } to { transform: none; } }
}
@media (max-width: 380px) {
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .answers { grid-template-columns: 1fr; }
}
/* جمع نقاط */
:root { --t0: #5B3DF5; --t0d: #3F25C9; --t0s: #EEEAFF; --t1: #F79009; --t1d: #C26A00; --t1s: #FEF3E2; }
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.team { border-radius: 22px; padding: 10px 12px; background: var(--soft); text-align: center; min-width: 0; border: 3px solid transparent; transition: transform .2s; }
.team.t0 { background: var(--t0s); } .team.t1 { background: var(--t1s); }
.team.on.t0 { border-color: var(--t0); transform: scale(1.03); } .team.on.t1 { border-color: var(--t1); transform: scale(1.03); }
.team b { display: block; font-size: 14px; overflow-wrap: anywhere; line-height: 1.3; }
.team .sc { font-family: var(--display); font-size: 34px; line-height: 1.1; direction: ltr; display: block; }
.team.t0 .sc { color: var(--t0d); } .team.t1 .sc { color: var(--t1d); }
.team small { font-size: 13px; letter-spacing: 2px; }
.team small i { font-style: normal; opacity: .25; }
.turnline { text-align: center; font-weight: 700; font-size: 15px; }
.turnline.t0 { color: var(--t0); } .turnline.t1 { color: var(--t1d); }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.board .head { text-align: center; background: var(--l4); color: #FFF; border-radius: 16px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.board .head span { font-size: 22px; line-height: 1.1; }
.board .head b { font-size: 11.5px; line-height: 1.25; overflow-wrap: anywhere; }
.cell { border: 0; border-radius: 16px; padding: 12px 2px; font-family: var(--display); font-size: 22px; direction: ltr; color: #FFF; box-shadow: 0 4px 0 rgb(0 0 0 / .2); transition: transform .1s; }
.cell:active { transform: translateY(2px); }
.cell.d1 { background: #12B76A; } .cell.d2 { background: #0BA5EC; } .cell.d3 { background: #F79009; } .cell.d4 { background: #F04438; }
.cell[disabled] { background: var(--soft) !important; color: var(--faint); box-shadow: none; font-size: 15px; font-family: var(--font); font-weight: 700; cursor: default; }
.cell[disabled].w0 { background: var(--t0s) !important; color: var(--t0); } .cell[disabled].w1 { background: var(--t1s) !important; color: var(--t1d); }
.board.wait .cell:not([disabled]) { opacity: .55; pointer-events: none; }
.legend { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 4px; vertical-align: -1px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip2 { background: var(--soft); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
.chip2.d1 { background: #E6F8EF; color: #0A8A4F; } .chip2.d2 { background: #E0F2FE; color: #0086C9; } .chip2.d3 { background: #FEF3E2; color: #C26A00; } .chip2.d4 { background: #FEECEA; color: #B42318; }
.chip2.dbl { background: linear-gradient(90deg, #FDB022, #F04438); color: #FFF; animation: micpulse 1s ease-in-out infinite; }
.qcard { background: #FFFFFF; border: 2px solid var(--line); border-radius: 28px; padding: 18px; box-shadow: 0 6px 0 var(--line); display: flex; flex-direction: column; gap: 12px; }
.qcard .qt { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 6.5vw, 30px); line-height: 1.35; text-align: center; }
.qimg { width: 100%; max-height: 240px; object-fit: contain; border-radius: 18px; background: var(--soft); }
.qimg.flag { object-fit: contain; background: #FFF; border: 1px solid var(--line); max-height: 180px; }
.qimg.crest { max-height: 160px; background: #FFF; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { border: 2px solid var(--line); background: #FFFFFF; border-radius: 20px; padding: 14px 10px; font-weight: 700; font-size: 16px; line-height: 1.35; box-shadow: 0 4px 0 var(--line); min-height: 64px; overflow-wrap: anywhere; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 13px; color: var(--muted); }
.opt[disabled] { cursor: default; }
.opt.gone { opacity: .2; text-decoration: line-through; }
.opt.right { background: #D1FADF; border-color: #12B76A; box-shadow: 0 4px 0 #6CE9A6; }
.opt.wrong { background: #FEE4E2; border-color: #F04438; box-shadow: 0 4px 0 #FDA29B; }
.opt.mine { outline: 3px solid var(--brand); }
@media (max-width: 360px) { .opts { grid-template-columns: 1fr; } }
.lifes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lifes button { border: 2px solid var(--gold); background: #FEF0C7; border-radius: 16px; padding: 8px 4px; font-weight: 700; font-size: 13px; box-shadow: 0 3px 0 #FEDF89; line-height: 1.3; }
.lifes button[disabled] { opacity: .35; }
.lifes button span { display: block; font-size: 20px; }
.banner { text-align: center; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.banner b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.2; }
.banner.good { background: var(--l1s); } .banner.bad { background: var(--l3s); } .banner.steal { background: #FEF0C7; }
.dblover { position: fixed; inset: 0; z-index: 9990; display: grid; place-items: center; background: radial-gradient(circle, rgba(253,176,34,.95), rgba(240,68,56,.95)); color: #FFF; text-align: center; padding: 24px; animation: dblin .4s cubic-bezier(.2,.9,.3,1.4) both; }
.dblover b { font-family: var(--display); font-size: clamp(54px, 16vw, 90px); line-height: 1; display: block; text-shadow: 0 6px 0 rgb(0 0 0 / .15); }
.dblover small { font-size: 18px; font-weight: 700; display: block; margin-top: 10px; }
@keyframes dblin { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.catpick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.catpick button { border: 2px solid var(--line); background: #FFF; border-radius: 20px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; box-shadow: 0 4px 0 var(--line); }
.catpick button span { font-size: 30px; line-height: 1.1; }
.catpick button small { color: var(--muted); font-weight: 500; font-size: 11px; }
.catpick button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 4px 0 #D9D1FF; }
.catpick button[aria-pressed="true"]::after { content: "✓"; color: var(--brand); font-weight: 800; }
.final { display: flex; flex-direction: column; gap: 10px; }
.final .r { display: grid; grid-template-columns: 1fr auto; align-items: center; border-radius: 20px; padding: 14px 16px; }
.final .r b { font-size: 18px; } .final .r span { font-family: var(--display); font-size: 34px; direction: ltr; }
.final .r.t0 { background: var(--t0s); color: var(--t0d); } .final .r.t1 { background: var(--t1s); color: var(--t1d); }
.waitnote { text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="brand" href="./"><img src="../icons/icon.svg" alt=""><b>جمع نقاط</b></a>
    <button class="back" id="quit" type="button">خروج</button>
  </div>
  <main id="app" aria-live="polite"><div class="loading">بحمّل الأسئلة...</div></main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k, d) { try { const v = localStorage.getItem("points-" + k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem("points-" + k, JSON.stringify(v)); } catch {} } };
function render(html) { $("app").innerHTML = `<div class="screen">${html}</div>`; }
function bind(map) { for (const [id, fn] of Object.entries(map)) { const el = $(id); if (el) el.onclick = fn; } }

// ---------- القواعد ----------
const LEVELS = [null, { name: "سهل", pts: 100 }, { name: "متوسط", pts: 200 }, { name: "صعب", pts: 300 }, { name: "صعب جداً", pts: 500 }];
const LAYOUT = [1, 1, 2, 2, 3, 3, 4, 4];          // 8 أسئلة بكل قسم
const CATS_N = 4;
const Q_MS = (d) => (d >= 4 ? 40000 : 30000);
const STEAL_MS = 15000;
const HELPS = [
  { k: "cut", icon: "✂️", name: "حذف إجابتين" },
  { k: "two", icon: "✌️", name: "جاوب مرتين" },
  { k: "swap", icon: "🔄", name: "بدّل السؤال" },
];
const newHelp = () => ({ cut: true, two: true, swap: true });
let DATA, CAT;

let AC = null;
function audio() {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch { AC = null; }
  return AC;
}
document.addEventListener("pointerdown", () => audio(), { once: true });
function tone(freq, start, dur, type = "sine", vol = 0.18) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime + start);
  g.gain.setValueAtTime(0.0001, ac.currentTime + start);
  g.gain.exponentialRampToValueAtTime(vol, ac.currentTime + start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + start + dur);
  o.connect(g).connect(ac.destination); o.start(ac.currentTime + start); o.stop(ac.currentTime + start + dur + 0.05);
}
function haptic(kind) {
  try { window.webkit?.messageHandlers?.haptic?.postMessage(kind); } catch {}
  try { navigator.vibrate && navigator.vibrate(kind === "error" ? [80, 60, 120] : [40]); } catch {}
}
function confettiBurst(big = false) {
  const cv = document.createElement("canvas");
  cv.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999";
  document.body.appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const c = cv.getContext("2d"); c.scale(dpr, dpr);
  const colors = ["#6C47FF", "#FDB022", "#12B76A", "#F04438", "#0BA5EC", "#EE46BC", "#FFFFFF"];
  const N = big ? 260 : 160, parts = [];
  for (let i = 0; i < N; i++) {
    const fromLeft = i % 2 === 0;
    parts.push({
      x: fromLeft ? -10 : innerWidth + 10, y: innerHeight * (0.55 + Math.random() * 0.3),
      vx: (fromLeft ? 1 : -1) * (6 + Math.random() * 9), vy: -(10 + Math.random() * 12),
      w: 6 + Math.random() * 7, h: 8 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      col: colors[i % colors.length], shape: Math.random() < 0.3 ? "c" : "r",
    });
  }
  const t0 = performance.now();
  (function frame(t) {
    const el = (t - t0) / 1000;
    c.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.globalAlpha = Math.max(0, 1 - Math.max(0, el - 1.8) / 0.8);
      c.fillStyle = p.col;
      if (p.shape === "c") { c.beginPath(); c.arc(0, 0, p.w / 2, 0, 7); c.fill(); }
      else c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 2);
      c.restore();
    }
    if (el < 2.6) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}
function redFlash() {
  const o = document.createElement("div");
  o.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:9998;background:radial-gradient(circle at 50% 45%,rgba(240,68,56,.25),rgba(217,45,32,.75));opacity:0;transition:opacity .12s";
  document.body.appendChild(o);
  requestAnimationFrame(() => { o.style.opacity = "1"; });
  setTimeout(() => { o.style.transition = "opacity .6s"; o.style.opacity = "0"; }, 380);
  setTimeout(() => o.remove(), 1100);
  const app = document.querySelector(".wrap") || document.body;
  app.animate([{ transform: "translateX(0)" }, { transform: "translateX(-14px)" }, { transform: "translateX(12px)" },
    { transform: "translateX(-9px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 480, easing: "ease-out" });
}
function fx(kind) {
  if (kind === "good" || kind === "win") {
    confettiBurst(kind === "win");
    [523, 659, 784, 1047].forEach((f, k) => tone(f, k * 0.09, 0.28, "triangle", 0.16));
    haptic("success");
  } else if (kind === "bad") {
    redFlash();
    tone(196, 0, 0.22, "sawtooth", 0.12); tone(147, 0.18, 0.35, "sawtooth", 0.12);
    haptic("error");
  }
}



// ---------- المحرك (بيشتغل عند صاحب الغرفة، أو على التلفون الواحد) ----------
let S = null;            // الحالة اللي بيشوفها الكل
let SECRET = null;       // عند المحرك بس: الأجوبة الصح والأسئلة
let mode = null;         // "local" | "host" | "guest"
let timer = null;

function usedSet() { return new Set(store.get("used", [])); }
function markUsed(key) { const u = store.get("used", []); u.push(key); store.set("used", u.slice(-4000)); }
const qkey = (q) => q[1] + "|" + (q[3] || "");

function drawQuestion(cid, d, avoid) {
  const used = usedSet();
  const all = CAT.get(cid).qs.filter((q) => q[0] === d && !avoid.has(qkey(q)));
  let pool = all.filter((q) => !used.has(qkey(q)));
  if (!pool.length) pool = all;
  if (!pool.length) pool = CAT.get(cid).qs.filter((q) => q[0] === d);
  return pool[Math.floor(Math.random() * pool.length)];
}

function newGame(cats) {
  SECRET = { taken: new Set(), pre: {} };
  S.cats = cats; S.board = {};
  for (const cid of cats) {
    SECRET.pre[cid] = LAYOUT.map((d) => { const q = drawQuestion(cid, d, SECRET.taken); SECRET.taken.add(qkey(q)); return q; });
    S.board[cid] = LAYOUT.map((d) => ({ d, w: null }));
  }
  const flat = cats.flatMap((cid) => S.board[cid].map((_, i) => `${cid}:${i}`));
  SECRET.dbl = flat[Math.floor(Math.random() * flat.length)];
  S.teams.forEach((t) => { t.score = 0; t.help = newHelp(); });
  S.turn = Math.random() < 0.5 ? 0 : 1;
  S.phase = "board"; S.cur = null; S.res = null; S.n = 0;
  preloadImages();
}
function preloadImages() {
  for (const cid of S.cats) for (const q of SECRET.pre[cid]) if (q[3]) { const im = new Image(); im.referrerPolicy = "no-referrer"; im.src = imgUrl(q[3]); }
}

function openCell(team, cid, i) {
  const cell = S.board[cid] && S.board[cid][i];
  if (!cell || cell.w !== null || S.phase !== "board" || team !== S.turn) return false;
  const q = SECRET.pre[cid][i];
  setQuestion(q, cid, i, team);
  S.cur.dbl = SECRET.dbl === `${cid}:${i}`;
  if (S.cur.dbl) S.fxId = { id: Date.now(), kind: "dbl", team };
  return true;
}
function setQuestion(q, cid, i, team) {
  const order = shuffle([0, 1, 2, 3]);
  SECRET.right = order.indexOf(0);
  SECRET.q = q;
  const d = q[0];
  S.cur = Object.assign(S.cur && S.cur.cid === cid && S.cur.i === i ? S.cur : {}, {
    cid, i, d, text: q[1], img: q[3] || null, opts: order.map((k) => q[2][k]),
    team, gone: [], wrong: [], tries: 1, steal: false, deadline: Date.now() + Q_MS(d) + (S.cur && S.cur.dbl ? 2500 : 0),
  });
  S.phase = "q";
  markUsed(qkey(q));
  arm();
}
function arm() {
  clearTimeout(timer);
  const id = S.cur && S.cur.deadline;
  timer = setTimeout(() => { if (S.phase === "q" && S.cur.deadline === id) { timeUp(); commit(); } }, Math.max(0, S.cur.deadline - Date.now()) + 250);
}
function timeUp() {
  const c = S.cur;
  if (!c.steal) startSteal(null);
  else finish(null, null);
}
function startSteal(wrongIdx) {
  const c = S.cur;
  if (wrongIdx !== null && !c.wrong.includes(wrongIdx)) c.wrong.push(wrongIdx);
  c.steal = true; c.team = 1 - c.team;
  c.deadline = Date.now() + STEAL_MS;
  S.fxId = { id: Date.now(), kind: "steal", team: c.team };
  arm();
}
function cellPoints(c) { return LEVELS[c.d].pts * (c.dbl ? 2 : 1); }
function finish(winner, pick) {
  clearTimeout(timer);
  const c = S.cur;
  let pts = 0;
  if (winner !== null) { pts = c.steal ? Math.round(cellPoints(c) / 2) : cellPoints(c); S.teams[winner].score += pts; }
  S.board[c.cid][c.i].w = winner === null ? -1 : winner;
  S.res = { winner, pts, right: SECRET.right, pick, steal: c.steal, dbl: c.dbl, text: c.text };
  S.cur.right = SECRET.right;
  S.phase = "res"; S.n++;
  S.fxId = { id: Date.now(), kind: winner === null ? "none" : "good", team: winner };
  S.turn = 1 - S.turn;
}
function answer(team, k) {
  const c = S.cur;
  if (S.phase !== "q" || team !== c.team || c.gone.includes(k) || c.wrong.includes(k)) return;
  if (k === SECRET.right) return finish(team, k);
  if (!c.steal && c.tries > 1) { c.tries--; c.wrong.push(k); S.fxId = { id: Date.now(), kind: "bad", team }; return; }
  S.fxId = { id: Date.now(), kind: "bad", team };
  if (!c.steal) startSteal(k);
  else { c.wrong.push(k); finish(null, k); }
}
function useHelp(team, h) {
  const c = S.cur, t = S.teams[team];
  if (S.phase !== "q" || team !== c.team || c.steal || !t.help[h]) return;
  if (h === "cut") {
    const wrongs = [0, 1, 2, 3].filter((k) => k !== SECRET.right && !c.gone.includes(k) && !c.wrong.includes(k));
    if (wrongs.length < 2) return;
    c.gone.push(...shuffle(wrongs).slice(0, 2));
  } else if (h === "two") {
    c.tries = 2;
  } else if (h === "swap") {
    const q = drawQuestion(c.cid, c.d, new Set([...SECRET.taken, qkey(SECRET.q)]));
    if (!q) return;
    SECRET.taken.add(qkey(q));
    t.help[h] = false;
    const keepDbl = c.dbl;
    setQuestion(q, c.cid, c.i, team);
    S.cur.dbl = keepDbl; S.cur.used = (S.cur.used || []).concat("swap");
    return;
  }
  t.help[h] = false;
  c.used = (c.used || []).concat(h);
}
function backToBoard() {
  if (S.phase !== "res") return;
  const left = S.cats.some((cid) => S.board[cid].some((c) => c.w === null));
  S.phase = left ? "board" : "over"; S.cur = null;
  if (!left) S.fxId = { id: Date.now(), kind: "win" };
}

// الحركات (من التلفون نفسه أو من التلفون الثاني)
function act(a) {
  const team = mode === "local" ? a.team : teamOf(a.pid);
  switch (a.t) {
    case "join": return join(a);
    case "cats":
      if (S.phase !== "cats" || (mode !== "local" && a.pid !== S.host)) return;
      if (!Array.isArray(a.cats) || a.cats.length !== CATS_N || a.cats.some((c) => !CAT.has(c))) return;
      newGame(a.cats); break;
    case "open": if (!openCell(team, a.cid, a.i)) return; break;
    case "ans": answer(team, a.k); break;
    case "help": useHelp(team, a.h); break;
    case "next": backToBoard(); break;
    case "again":
      if (S.phase !== "over") return;
      S.phase = "cats"; S.cats = []; S.board = {}; break;
    case "rename":
      if (team === 0 || team === 1) S.teams[team].name = String(a.name || "").slice(0, 16) || S.teams[team].name;
      break;
    default: return;
  }
  commit();
}
function teamOf(pid) { return S.teams.findIndex((t) => t.pid === pid); }
function join(a) {
  if (mode !== "host") return;
  const i = teamOf(a.pid);
  if (i >= 0) { if (a.name) S.teams[i].name = String(a.name).slice(0, 16); return commit(); }
  if (S.teams[1].pid) return commit();   // الغرفة مليانة
  S.teams[1].pid = a.pid; S.teams[1].name = String(a.name || "الفريق الثاني").slice(0, 16);
  if (S.phase === "lobby") S.phase = "cats";
  commit();
}

// ---------- الاتصال (MQTT) ----------
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt", "wss://test.mosquitto.org:8081/mqtt"];
const qs = new URLSearchParams(location.search);
const ROOT = "abuodeh-points-v1";
let client = null, room = null, offset = 0, lastFx = null, ticker = null;
const me = { id: store.get("pid", null), name: store.get("team", "") };
if (!me.id) { me.id = Math.random().toString(36).slice(2, 10); store.set("pid", me.id); }
const topic = (k) => `${ROOT}/${room}/${k}`;
const now = () => Date.now() + offset;

function commit() {
  S.v = (S.v || 0) + 1; S.now = Date.now();
  if (mode === "host") {
    store.set("host-" + room, { S, SECRET: Object.assign({}, SECRET, { taken: [...(SECRET ? SECRET.taken : [])] }) });
    store.set("online", { room, host: true, at: Date.now() });
    try { client.publish(topic("s"), JSON.stringify(S), { qos: 1, retain: true }); } catch {}
  } else if (mode === "local") {
    store.set("local", { S, SECRET: Object.assign({}, SECRET, { taken: [...(SECRET ? SECRET.taken : [])] }) });
  }
  onState(S);
}
function send(a) {
  a.pid = me.id;
  if (mode === "host" || mode === "local") return act(a);
  if (client) client.publish(topic("a"), JSON.stringify(a), { qos: 1 });
}
function connect(onReady, k = 0) {
  if (typeof mqtt === "undefined") return fail("ما قدرت أحمّل مكتبة الاتصال. تأكد من الإنترنت.");
  const url = qs.get("broker") || BROKERS[k % BROKERS.length];
  let ready = false;
  const c = mqtt.connect(url, { clientId: "ap_" + me.id + "_" + Math.random().toString(36).slice(2, 6), reconnectPeriod: 2000, connectTimeout: 8000, clean: true });
  const giveUp = setTimeout(() => { if (!ready) { c.end(true); if (k + 1 < BROKERS.length && !qs.get("broker")) connect(onReady, k + 1); else fail("ما قدرت أتصل. جرّب كمان شوي."); } }, 9000);
  c.on("connect", () => {
    if (!ready) { ready = true; clearTimeout(giveUp); client = c; onReady(); return; }
    if (!room) return;
    c.subscribe(topic("s"), { qos: 1 });
    if (mode === "host") { c.subscribe(topic("a"), { qos: 1 }); commit(); } else send({ t: "join", name: me.name });
  });
  c.on("message", (t, buf) => {
    let m; try { m = JSON.parse(buf.toString()); } catch { return; }
    if (t === topic("s") && mode === "guest") onState(m);
    else if (t === topic("a") && mode === "host") act(m);
  });
}
function fail(msg) { render(`<h1>مشكلة بالاتصال</h1><p class="sub">${esc(msg)}</p><button class="big" id="back" type="button">رجوع</button>`); bind({ back: leave }); }
function leave() {
  try { if (client && mode === "host" && room) client.publish(topic("s"), "", { qos: 1, retain: true }); } catch {}
  const c = client; setTimeout(() => { try { c && c.end(true); } catch {} }, 300);
  client = null; room = null; S = null; SECRET = null; mode = null; clearTimeout(timer); clearInterval(ticker);
  store.set("online", null);
  history.replaceState(null, "", location.pathname);
  intro();
}

function hostRoom(code, saved) {
  mode = "host";
  room = code || String(Math.floor(10000 + Math.random() * 90000));
  render(`<div class="loading">عم بفتح الغرفة...</div>`);
  connect(() => {
    client.subscribe([topic("s"), topic("a")], { qos: 1 });
    if (saved) { S = saved.S; SECRET = Object.assign(saved.SECRET || {}, { taken: new Set((saved.SECRET && saved.SECRET.taken) || []) }); if (S.phase === "q") arm(); }
    else S = { room, host: me.id, phase: "lobby", teams: [{ pid: me.id, name: me.name || "الفريق الأول", score: 0, help: newHelp() }, { pid: null, name: "الفريق الثاني", score: 0, help: newHelp() }], cats: [], board: {}, turn: 0 };
    commit();
  });
}
function joinRoom(code) {

  render(`<div class="loading">عم بدخل الغرفة...</div>`);

function localGame(saved) {

  if (saved) { S = saved.S; SECRET = Object.assign(saved.SECRET || {}, { taken: new Set((saved.SECRET && saved.SECRET.taken) || []) }); if (S.phase === "q") arm(); return commit(); }

      store.set("names", n);
      S = { room: null, host: me.id, phase: "cats", teams: n.map((name, i) => ({ pid: "local" + i, name, score: 0, help: newHelp() })), cats: [], board: {}, turn: 0 };

// ---------- الواجهة ----------
const myTeam = () => (mode === "local" ? (S.cur ? S.cur.team : S.turn) : S.teams.findIndex((t) => t.pid === me.id));
const isMyTurn = () => mode === "local" || myTeam() === (S.phase === "q" ? S.cur.team : S.turn);

function onState(st) {
  if (!st) return;
  if (mode === "guest") {
    if (st.room !== room) return;
    if (S && st.v <= S.v && st.host === S.host) return;
    if (!S && st.teams && st.teams[1].pid && st.teams[1].pid !== me.id && st.teams[0].pid !== me.id) { S = st; return full(); }
  }
  S = st;
  offset = (st.now || Date.now()) - Date.now();
  if (mode === "host" || mode === "guest") store.set("online", { room, host: mode === "host", at: Date.now() });
  const f = S.fxId;
  if (f && f.id !== lastFx) { lastFx = f.id; if (Date.now() - (f.id - offset) < 20000) effects(f); }
  draw();
}
function full() { render(`<h1>الغرفة مليانة</h1><p class="sub">في فريقين جوا اللعبة.</p><button class="big ghost" id="back" type="button">رجوع</button>`); bind({ back: leave }); }

function effects(f) {
  const mine = mode === "local" || f.team === myTeam();
  if (f.kind === "dbl") dblOverlay(f.team);
  else if (f.kind === "good") setTimeout(() => fx(mine || mode === "local" ? "good" : "bad"), 60);
  else if (f.kind === "bad" && mine) setTimeout(() => fx("bad"), 60);
  else if (f.kind === "steal") { tone(880, 0, .12, "square", .1); tone(1175, .14, .18, "square", .1); }
  else if (f.kind === "win") setTimeout(() => fx("win"), 200);
}
function dblOverlay(team) {
  const t = S.teams[team];
  const mine = mode === "local" || myTeam() === team;
  const o = document.createElement("div");
  o.className = "dblover";
  o.innerHTML = `<div><b>🔥 دبل! 🔥</b><small>${mine ? "طلعلكم السؤال الدبل! النقاط ضعف" : `فريق «${esc(t.name)}» طلعله السؤال الدبل!`}</small></div>`;
  document.body.appendChild(o);
  [523, 659, 784, 1047, 1319].forEach((fq, k) => tone(fq, k * 0.08, 0.3, "triangle", 0.16));
  haptic("success");
  setTimeout(() => { o.style.transition = "opacity .4s"; o.style.opacity = "0"; }, 2100);
  setTimeout(() => o.remove(), 2600);
}

function teamsBar() {
  const active = S.phase === "q" ? S.cur.team : S.turn;
  return `<div class="teams">${S.teams.map((t, i) => `<div class="team t${i} ${["board", "q"].includes(S.phase) && active === i ? "on" : ""}">
    <b>${esc(t.name)}${mode !== "local" && t.pid === me.id ? " (إنتو)" : ""}</b><span class="sc">${t.score}</span>
    <small>${HELPS.map((h) => t.help && t.help[h.k] ? h.icon : `<i>${h.icon}</i>`).join(" ")}</small></div>`).join("")}</div>`;
}

function draw() {
  clearInterval(ticker);
  if (!S) return;
  if (S.phase === "lobby") return drawLobby();
  if (S.phase === "cats") return drawCats();
  if (S.phase === "board") return drawBoard();
  if (S.phase === "q") return drawQ();
  if (S.phase === "res") return drawRes();
  return drawOver();
}

function drawLobby() {
  const link = location.origin + location.pathname + "?room=" + room;
  render(`<h1>الغرفة ${esc(room)}</h1>
    <p class="sub">ابعت الكود أو الرابط للفريق الثاني. أول ما يدخل، بتختار الأقسام.</p>
    <div class="pass2" style="padding:18px"><span class="sub">كود الغرفة</span><span class="who" style="letter-spacing:6px;direction:ltr">${esc(room)}</span></div>
    <button class="big" id="share" type="button">ابعت رابط الغرفة</button>
    <p class="waitnote">⏳ عم نستنى الفريق الثاني...</p>

      try { if (navigator.share) { await navigator.share({ title: "جمع نقاط", text, url: link }); return; } } catch { return; }

let picked = [];
function drawCats() {
  const canPick = mode === "local" || S.host === me.id;
  if (!canPick) {
    render(`${teamsBar()}<h1>صاحب الغرفة عم يختار الأقسام</h1><p class="sub">${CATS_N} أقسام، وبكل قسم 8 أسئلة من السهل للصعب جداً.</p><div class="loading">⏳</div>

  }
  picked = picked.filter((c) => CAT.has(c));
  render(`${teamsBar()}<h1>اختاروا ${CATS_N} أقسام</h1>
    <p class="sub">بكل قسم 8 أسئلة: 2 سهل (100) و2 متوسط (200) و2 صعب (300) و2 صعب جداً (500). وفي سؤال واحد مخفي <b>دبل</b> 🔥</p>
    <div class="catpick">${DATA.cats.map((c) => `<button type="button" data-c="${c.id}" aria-pressed="${picked.includes(c.id)}"><span>${c.icon}</span>${esc(c.name)}<small>${c.qs.length} سؤال${c.qs.some((q) => q[3]) ? " · صور" : ""}</small></button>`).join("")}</div>
    <div class="row2"><button class="big ghost" id="rnd" type="button">🎲 عشوائي</button><button class="big green" id="go" type="button" ${picked.length === CATS_N ? "" : "disabled"}>يلا (${picked.length}/${CATS_N})</button></div>
    ${mode === "local" ? "" : `<p class="note" style="text-align:center">الفريق الثاني: «${esc(S.teams[1].name)}»</p>`}
    <button class="linkish" id="out" type="button" style="align-self:center">اطلع</button>`);
  document.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => {
    const c = b.dataset.c;
    if (picked.includes(c)) picked = picked.filter((x) => x !== c);
    else if (picked.length < CATS_N) picked.push(c);
    else { picked.shift(); picked.push(c); }
    drawCats();
  });
  bind({
    rnd: () => { picked = shuffle(DATA.cats.map((c) => c.id)).slice(0, CATS_N); drawCats(); },
    go: () => { if (picked.length === CATS_N) send({ t: "cats", cats: picked.slice() }); },
    out: () => { if (confirm("أكيد بدك تطلع؟")) leave(); },
  });
}

function drawBoard() {
  const t = S.teams[S.turn];
  const mine = isMyTurn();
  const left = S.cats.reduce((n, cid) => n + S.board[cid].filter((c) => c.w === null).length, 0);
  render(`${teamsBar()}
    <p class="turnline t${S.turn}">${mode === "local" ? `دور «${esc(t.name)}» يختار سؤال` : mine ? "دوركم! اختاروا سؤال 👇" : `دور «${esc(t.name)}» يختار...`}</p>
    <div class="board ${mine ? "" : "wait"}">
      ${S.cats.map((cid) => { const c = CAT.get(cid); return `<div class="head"><span>${c.icon}</span><b>${esc(c.name)}</b></div>`; }).join("")}
      ${LAYOUT.map((_, row) => S.cats.map((cid) => { const cell = S.board[cid][row];
        return `<button class="cell d${cell.d} ${cell.w !== null && cell.w >= 0 ? "w" + cell.w : ""}" type="button" data-cid="${cid}" data-i="${row}" ${cell.w !== null ? "disabled" : ""}>${cell.w === null ? LEVELS[cell.d].pts : cell.w === -1 ? "✗" : "✓"}</button>`;
      }).join("")).join("")}
    </div>
    <div class="legend"><span><i style="background:#12B76A"></i>سهل</span><span><i style="background:#0BA5EC"></i>متوسط</span><span><i style="background:#F79009"></i>صعب</span><span><i style="background:#F04438"></i>صعب جداً</span></div>
    <p class="note" style="text-align:center">باقي ${left} سؤال · في سؤال دبل مخفي 🔥</p>
    <button class="linkish" id="out" type="button" style="align-self:center">${mode === "local" ? "إنهاء اللعبة" : "اطلع من اللعبة"}</button>`);
  if (mine) document.querySelectorAll(".cell:not([disabled])").forEach((b) => b.onclick = () => send({ t: "open", cid: b.dataset.cid, i: +b.dataset.i, team: S.turn }));
  bind({ out: () => { if (confirm("أكيد؟ اللعبة رح تنتهي.")) { store.set("local", null); leave(); } } });
}

function qTop() {
  const c = S.cur, cat = CAT.get(c.cid);
  return `<div class="qhead"><span class="chip2">${cat.icon} ${esc(cat.name)}</span>
    <span>${c.dbl ? `<span class="chip2 dbl">🔥 دبل ×2</span> ` : ""}<span class="chip2 d${c.d}">${LEVELS[c.d].name} · ${cellPoints(c)}</span></span></div>`;
}
// صور ويكيبيديا: بنطلبها عن طريق Commons مباشرة (روابط الـthumb بحجم غير قياسي ما بتشتغل)
function imgUrl(u) {
  const m = String(u || "").match(/\/wikipedia\/(commons|en)\/thumb\/[^/]+\/[^/]+\/([^/?]+)\//);
  return m ? `https://${m[1] === "en" ? "en.wikipedia.org" : "commons.wikimedia.org"}/wiki/Special:FilePath/${m[2]}?width=640` : u;
}
function qImage(c) {
  if (!c.img) return "";
  const cls = c.img.includes("flagcdn") ? "flag" : c.img.includes("teamlogos") ? "crest" : "";
  return `<img class="qimg ${cls}" src="${esc(imgUrl(c.img))}" data-alt="${esc(c.img)}" alt="" referrerpolicy="no-referrer" onerror="if(this.dataset.alt&&this.src!==this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt='';}else{this.style.display='none'}">`;
}
function drawQ() {
  const c = S.cur, t = S.teams[c.team];
  const mine = isMyTurn();
  const helpOk = mine && !c.steal;
  render(`${teamsBar()}
    ${c.steal ? `<div class="banner steal"><b>فرصة سرقة! 🦊</b><small>«${esc(S.teams[1 - c.team].name)}» جاوب غلط. ${mode === "local" ? `«${esc(t.name)}»` : mine ? "إنتو" : `«${esc(t.name)}»`} بتقدروا تسرقوا نص النقاط (${Math.round(cellPoints(c) / 2)})</small></div>` : ""}
    <div class="ptimer" id="pt"><i id="ptbar"></i><span id="ptsec"></span></div>
    <div class="qcard">${qTop()}${qImage(c)}<div class="qt">${esc(c.text)}</div></div>
    <div class="opts">${c.opts.map((o, k) => { const off = c.gone.includes(k) || c.wrong.includes(k);
      return `<button class="opt ${c.gone.includes(k) ? "gone" : ""} ${c.wrong.includes(k) ? "wrong" : ""}" type="button" data-k="${k}" ${off || !mine ? "disabled" : ""}><span class="k">${"أبجد"[k]}</span>${esc(o)}</button>`; }).join("")}</div>
    ${c.tries > 1 && !c.steal ? `<p class="note" style="text-align:center;font-weight:700">✌️ معكم محاولتين بهالسؤال</p>` : ""}
    ${!c.steal ? `<div class="lifes">${HELPS.map((h) => `<button type="button" data-h="${h.k}" ${helpOk && t.help[h.k] ? "" : "disabled"}><span>${h.icon}</span>${h.name}</button>`).join("")}</div>` : ""}
    <p class="waitnote">${mine ? (mode === "local" ? `دور «${esc(t.name)}» يجاوب` : "") : `⏳ «${esc(t.name)}» عم يجاوبوا...`}</p>`);
  if (mine) {
    document.querySelectorAll(".opt:not([disabled])").forEach((b) => b.onclick = () => { b.classList.add("mine"); send({ t: "ans", k: +b.dataset.k, team: c.team }); });
    document.querySelectorAll("[data-h]:not([disabled])").forEach((b) => b.onclick = () => {
      if (b.dataset.h === "swap" && !confirm("أكيد بدكم تبدّلوا السؤال؟ (مرة وحدة باللعبة)")) return;
      send({ t: "help", h: b.dataset.h, team: c.team });
    });
  }
  const total = c.steal ? STEAL_MS : Q_MS(c.d);
  let lastBeep = -1;
  const tick = () => {
    const ms = Math.max(0, c.deadline - now()), s = Math.ceil(ms / 1000);
    const bar = $("ptbar"), sec = $("ptsec"), pt = $("pt");
    if (!bar) return clearInterval(ticker);
    bar.style.width = Math.min(100, (ms / total) * 100) + "%";
    sec.textContent = s + " ثانية";
    pt.classList.toggle("hot", s <= 5);
    if (s <= 5 && s > 0 && s !== lastBeep && mine) { lastBeep = s; tone(660, 0, 0.08, "square", 0.06); }
  };
  tick(); ticker = setInterval(tick, 200);
}

function drawRes() {
  const r = S.res, c = S.cur;
  const w = r.winner !== null ? S.teams[r.winner] : null;
  const mineWin = w && (mode === "local" || r.winner === myTeam());

    <div class="qcard">${qTop()}${qImage(c)}<div class="qt">${esc(c.text)}</div></div>

    <button class="big" id="next" type="button">رجوع للوحة ←</button>`);

function drawOver() {
  const [a, b] = S.teams;
  const tie = a.score === b.score, win = a.score > b.score ? 0 : 1;
  const order = tie ? [0, 1] : [win, 1 - win];
  render(`<div class="banner good" style="padding:26px"><b style="font-size:38px">${tie ? "تعادل! 🤝" : `🏆 فاز «${esc(S.teams[win].name)}»`}</b>

    <div class="final">${order.map((i) => `<div class="r t${i}"><b>${esc(S.teams[i].name)}</b><span>${S.teams[i].score}</span></div>`).join("")}</div>

    <button class="big ghost" id="out" type="button">خروج</button>`);
  bind({ again: () => { picked = []; send({ t: "again" }); }, out: () => { store.set("local", null); leave(); } });
}

    render(`<h1>في لعبة مفتوحة</h1><p class="sub">الغرفة ${esc(saved.room)}${saved.host ? " (إنتو صاحبينها)" : ""}.</p>
      <button class="big green" id="re" type="button">ارجع للعبة</button><button class="big ghost" id="no" type="button">لا، طلّعني</button>`);
    bind({ re: () => (saved.host ? hostRoom(saved.room, store.get("host-" + saved.room, null)) : joinRoom(saved.room)), no: () => { store.set("online", null); intro(); } });
    return true;
  }
  return false;
}

$("quit").onclick = () => { location.href = "./"; };
fetch("points_q.json?t=" + Math.floor(Date.now() / 3.6e6)).then((r) => r.json()).then((d) => {
  DATA = d; CAT = new Map(d.cats.map((c) => [c.id, c]));
  if (!d.cats.length) { $("app").innerHTML = `<div class="loading">الأسئلة لسا بتتجهز. جرّب كمان شوي.</div>`; return; }
  if (boot()) return;
  intro();
}).catch(() => { $("app").innerHTML = `<div class="loading">ما قدرت أحمّل الأسئلة.</div>`; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});
</script>
