<!doctype html>
<html lang="ar" dir="rtl" class="stage">
<head>
<script src="../app/firebase-config.js"></script>
<script src="../app/core.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>جمع نقاط</title>
<meta name="theme-color" content="#16113A">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تعليلة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../ds/ds.css">
<link rel="stylesheet" href="../shell.css">
<link rel="stylesheet" href="fx.css">
<style>
/* «جمع نقاط» 2: ليلة على لوحة. الأرضية ليل مع ضو لمبة من فوق، والكروت طبقات ليل، والخيارات ورق.
   كل فريق إله لون واحد من باليت تعليلة، وكل مستوى إله لون. */
:root {
  color-scheme: dark;
  --bg: var(--c-layl); --s1: var(--c-layl-2); --s2: var(--c-layl-3); --ln: var(--c-layl-line);
  --on: var(--c-waraq); --dim: var(--c-muted-night); --faint: var(--c-control-night);
  --brand: var(--c-lamba); --brand-d: var(--c-lamba-deep);
  --ok: var(--c-nanaa); --ok-d: var(--c-nanaa-deep); --no: var(--c-jamr); --no-d: var(--c-jamr-deep);
  --t0: var(--c-jamr); --t1: var(--c-nanaa); --t2: var(--c-toot-night); --t3: var(--c-lamba); --t4: var(--c-waraq);
  --d1: var(--c-nanaa); --d2: var(--c-toot-night); --d3: var(--c-lamba); --d4: var(--c-jamr);
  --font: "Readex Pro", "Segoe UI", Tahoma, sans-serif;
  --display: "Lalezar", "Readex Pro", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; color: var(--on); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(70% 32% at 72% -6%, rgb(255 197 51 / .30), transparent 72%), radial-gradient(52% 26% at 8% -4%, rgb(255 86 56 / .20), transparent 72%), var(--bg); background-attachment: fixed; }
html, body, button, a, input { touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding: calc(8px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
#app { display: flex; flex-direction: column; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8.6vw, 40px); line-height: 1.15; margin: 0; }
h2 { font-family: var(--display); font-weight: 400; font-size: 21px; margin: 4px 0 0; }
.sub { color: var(--dim); margin: 0; font-size: 14px; }
.center { text-align: center; }
.note { color: var(--dim); font-size: 13px; text-align: center; margin: 0; }
.label { font-size: 13px; font-weight: 700; color: var(--dim); }
.err { color: var(--c-jamr-night); font-size: 13px; margin: 0; }
.card { background: var(--s1); border: 1px solid var(--ln); border-radius: 22px; padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.loading { display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--dim); padding: 56px 0; }
.linkish { border: 0; background: none; color: var(--faint); font-size: 13px; text-decoration: underline; align-self: center; padding: 6px; }

/* الأزرار: «كبسة» بحافة تحت */
.btn { width: 100%; border: 0; border-radius: 18px; padding: 14px 16px; font-family: var(--display); font-size: 22px; line-height: 1.15;
  background: var(--brand); color: var(--c-layl); box-shadow: 0 4px 0 var(--brand-d); margin-bottom: 4px; transition: transform .1s cubic-bezier(.34,1.56,.64,1), box-shadow .1s; }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--brand-d); }
.btn.alt { background: var(--s2); color: var(--on); box-shadow: 0 4px 0 var(--bg), inset 0 0 0 1px var(--ln); }
.btn.alt:active { box-shadow: inset 0 0 0 1px var(--ln); }
.btn.sm { font-size: 18px; padding: 11px 14px; width: auto; }
.btn[disabled] { opacity: .45; transform: none; }
.input { width: 100%; border: 1.5px solid var(--ln); background: var(--bg); color: var(--on); border-radius: 14px; padding: 12px 14px; font-size: 17px; font-family: var(--font); }
.input::placeholder { color: var(--faint); }
.input.bare { border: 0; background: none; padding: 10px 4px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; border: 1.5px solid var(--ln); background: transparent; border-radius: 14px; padding: 10px 4px; font-weight: 700; font-size: 15px; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--c-layl); border-color: var(--brand); }

/* ألوان الفرق والمستويات */
.t0 { --c: var(--t0); } .t1 { --c: var(--t1); } .t2 { --c: var(--t2); } .t3 { --c: var(--t3); } .t4 { --c: var(--t4); }
.d1 { --lc: var(--d1); } .d2 { --lc: var(--d2); } .d3 { --lc: var(--d3); } .d4 { --lc: var(--d4); }

/* البداية */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 22px 18px 18px; background: linear-gradient(160deg, var(--s2), var(--s1) 60%); border: 1px solid var(--ln); display: flex; flex-direction: column; gap: 10px; }
.hero::after { content: ""; position: absolute; inset: auto -20% -60% 30%; height: 120%; background: radial-gradient(closest-side, rgb(255 197 51 / .22), transparent); pointer-events: none; }
.hero h1 { font-size: clamp(44px, 13vw, 58px); color: var(--brand); text-shadow: 0 4px 0 rgb(0 0 0 / .25); }
.hero.small h1 { font-size: clamp(30px, 8.6vw, 38px); color: var(--on); text-shadow: none; }
.hero .badge { align-self: flex-start; font-size: 12px; font-weight: 700; background: var(--no); color: var(--c-layl); border-radius: 999px; padding: 3px 10px; }
.hero .crown { font-size: 56px; line-height: 1; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg); } }
.feats { display: flex; flex-wrap: wrap; gap: 6px; position: relative; z-index: 1; }
.feats span { font-size: 12.5px; font-weight: 600; background: rgb(255 246 227 / .07); border: 1px solid var(--ln); border-radius: 999px; padding: 4px 10px; }
.roombox .rt { font-family: var(--display); font-weight: 400; font-size: 20px; }
.joinrow { display: flex; gap: 8px; } .joinrow .code-in { flex: 1; letter-spacing: 5px; text-align: center; font-size: 20px; }
.joinrow .btn { margin: 0; }
.soundtg { align-self: center; border: 1px solid var(--ln); background: var(--s1); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--dim); }
.rules { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 7px; font-size: 14px; color: var(--dim); }
.rules b { color: var(--on); }

/* الفرق والغرفة */
.code { font-family: var(--display); font-size: 58px; letter-spacing: 10px; direction: ltr; color: var(--brand); line-height: 1.1; }
.teamlist { display: flex; flex-direction: column; gap: 8px; }
.trow { display: flex; align-items: center; gap: 10px; padding: 6px 14px; min-height: 52px; border-radius: 16px; background: var(--s1); border: 1px solid var(--ln); border-inline-start: 5px solid var(--c, var(--ln)); font-weight: 600; }
.trow i { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.trow small { margin-inline-start: auto; color: var(--faint); font-weight: 500; }
.trow.slot { border-style: dashed; color: var(--faint); justify-content: center; font-weight: 500; }

/* النقاط */
.pods { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 6px; position: sticky; top: 0; z-index: 6; padding-top: 4px; background: linear-gradient(var(--bg) 82%, transparent); padding-bottom: 6px; }
.pod { position: relative; background: var(--s1); border-radius: 16px; padding: 9px 9px 7px; border: 1px solid var(--ln); overflow: hidden; min-width: 0; transition: background .25s, box-shadow .25s, transform .25s; }
.pod::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--c); }
.pod .nm { font-size: 12.5px; font-weight: 700; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pod .sc { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.05; color: var(--on); direction: ltr; text-align: right; }
.pod .chips { display: flex; gap: 2px 3px; font-size: 11px; line-height: 1.3; direction: ltr; justify-content: flex-end; flex-wrap: wrap; }
.pod .chips .off { opacity: .2; filter: grayscale(1); }
.pod .chips .fire { color: var(--c-jamr-night); font-weight: 800; }
.pod.on { background: color-mix(in srgb, var(--c) 22%, var(--s1)); border-color: var(--c); transform: translateY(-2px); box-shadow: 0 10px 22px -12px var(--c); }
.pod.on .nm { color: var(--on); }
.pods.n4 .pod .sc { font-size: 23px; } .pods.n4 .pod .nm { font-size: 11px; } .pods.n4 .pod .chips { font-size: 9.5px; }
.pods.n5 { gap: 4px; } .pods.n5 .pod { padding: 7px 5px 5px; border-radius: 12px; } .pods.n5 .pod .sc { font-size: 19px; text-align: center; } .pods.n5 .pod .nm { font-size: 10px; text-align: center; } .pods.n5 .pod .chips { font-size: 8.5px; justify-content: center; }
.bump { animation: bump .3s; } @keyframes bump { 50% { transform: scale(1.18); } }

/* اللوحة */
.turnbar { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; padding: 10px 14px; border-radius: 999px; background: color-mix(in srgb, var(--c) 18%, transparent); border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent); animation: pulseb 2s ease-in-out infinite; }
.turnbar i, .whoans i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
@keyframes pulseb { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 14%, transparent); } }
.prog { position: relative; height: 8px; background: var(--s1); border-radius: 99px; border: 1px solid var(--ln); }
.prog i { display: block; height: 100%; border-radius: inherit; background: var(--brand); transition: width .5s; }
.prog b { position: absolute; top: 50%; transform: translate(50%, -50%); font-size: 13px; line-height: 1; }
.board { display: flex; flex-direction: column; gap: 8px; }
.catrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 9px 9px 9px 10px; background: var(--s1); border: 1px solid var(--ln); border-radius: 20px; }
.catrow .ci { display: flex; align-items: center; gap: 8px; min-width: 0; }
.catrow .ci span { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: var(--s2); }
.catrow .ci b { font-size: 13.5px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.lvls { display: grid; grid-template-columns: repeat(4, 52px); gap: 5px; }
.lv { position: relative; border: 0; height: 54px; border-radius: 14px; padding: 0 0 12px; background: var(--s2); color: var(--on); font-family: var(--display); font-size: 20px; line-height: 1; direction: ltr;
  box-shadow: inset 0 3px 0 var(--lc), 0 3px 0 var(--bg); transition: transform .1s; }
.lv:active { transform: scale(.93); }
.lv .dots { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; justify-content: center; gap: 3px; }
.lv .dots i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--faint); }
.lv .dots i.me { border-color: var(--on); }
.lv .dots i.w { background: var(--c); border-color: var(--c); }
.lv .dots i.x { background: var(--ln); border-color: var(--ln); }
.lv.done { background: transparent; box-shadow: inset 0 0 0 1px var(--ln); color: var(--c, var(--faint)); font-family: var(--font); font-size: 16px; font-weight: 800; }
.lv.done.miss { color: var(--faint); }
.board.wait .lv:not(.done) { filter: saturate(.5) brightness(.8); pointer-events: none; }
.legend { display: flex; justify-content: center; gap: 12px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-inline-end: 5px; background: var(--lc); vertical-align: 0; }

/* السؤال */
.qtop { display: flex; align-items: center; gap: 7px; }
.qcat { flex: 1; min-width: 0; font-weight: 700; font-size: 13.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvb { flex: none; font-size: 11.5px; font-weight: 800; color: var(--c-layl); background: var(--lc); border-radius: 999px; padding: 3px 9px; }
.ptchip { flex: none; font-family: var(--display); font-size: 21px; color: var(--brand); direction: ltr; }
.ptchip.x2 { color: var(--c-jamr-night); }
.ring { position: relative; flex: none; width: 46px; height: 46px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .bg { stroke: var(--s2); } .ring .fg { stroke: var(--brand); stroke-linecap: round; transition: stroke-dashoffset .2s linear; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 400; font-size: 18px; direction: ltr; }
.ring.hot .fg { stroke: var(--no); } .ring.hot b { color: var(--c-jamr-night); animation: tick .5s ease-in-out infinite alternate; }
@keyframes tick { to { transform: scale(1.15); } }
.whoans { display: flex; align-items: center; gap: 8px; justify-content: center; text-align: center; font-weight: 700; font-size: 14px; padding: 9px 12px; border-radius: 14px; background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.whoans b { color: var(--brand); }
.qcard { background: var(--s1); border: 1px solid var(--ln); border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.qcard.enter { animation: qin .45s cubic-bezier(.2,.9,.3,1.2) both; }
.qtext { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 6.6vw, 30px); line-height: 1.38; text-align: center; text-wrap: balance; }
.qimg { display: block; width: 100%; max-height: 240px; object-fit: contain; border-radius: 16px; background: var(--c-waraq); padding: 6px; }
.qimg.flag, .qimg.crest { padding: 14px; max-height: 170px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { position: relative; border: 0; background: var(--c-waraq); color: var(--c-layl); border-radius: 18px; padding: 13px 10px 13px 12px; min-height: 64px; font-weight: 700; font-size: 16px; line-height: 1.35;
  text-align: center; display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 6px; box-shadow: 0 4px 0 var(--c-waraq-line); transition: transform .1s, opacity .2s; overflow-wrap: anywhere; }
.opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--c-waraq-line); }
.opt .k { width: 26px; height: 26px; border-radius: 50%; background: var(--c-layl); color: var(--c-waraq); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; }
.opt[disabled] { cursor: default; }
.opt.chosen { box-shadow: 0 0 0 3px var(--brand), 0 4px 0 var(--c-waraq-line); }
.opt.gone { opacity: .14; }
.opt.wrong { background: var(--no); box-shadow: 0 4px 0 var(--no-d); animation: shake .35s; }
.opt.right { background: var(--ok); box-shadow: 0 4px 0 var(--ok-d); animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
.opt.right .k, .opt.wrong .k { background: rgb(22 17 58 / .85); }
.opts.locked .opt:not(.right):not(.wrong):not(.gone) { opacity: .5; }
@keyframes pop { 0% { transform: scale(.94); } 60% { transform: scale(1.06); } }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@media (max-width: 340px) { .opts { grid-template-columns: 1fr; } .lvls { grid-template-columns: repeat(4, 46px); } }
.aids { display: flex; gap: 6px; }
.aids button { flex: 1; min-width: 0; border: 1.5px dashed rgb(255 197 51 / .55); background: rgb(255 197 51 / .08); border-radius: 14px; padding: 6px 2px; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.25; }
.aids button span { font-size: 19px; line-height: 1.2; }
.aids button[disabled] { opacity: .25; }
.enteropts .opt { animation: oin .35s cubic-bezier(.2,.9,.3,1.2) both; }
.enteropts .opt:nth-child(2) { animation-delay: .06s; } .enteropts .opt:nth-child(3) { animation-delay: .12s; } .enteropts .opt:nth-child(4) { animation-delay: .18s; }
@keyframes qin { from { opacity: 0; transform: scale(.94); } }
@keyframes oin { from { opacity: 0; transform: translateY(12px); } }

/* السرقة */
.steal { border-radius: 20px; padding: 14px; background: linear-gradient(135deg, rgb(255 197 51 / .2), rgb(255 86 56 / .18)); border: 1.5px solid rgb(255 197 51 / .5); text-align: center; display: flex; flex-direction: column; gap: 10px; }
.steal > b { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.2; }
.steal small { color: var(--dim); } .steal small b { color: var(--brand); }
.buzz { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.buzz button { border: 0; border-radius: 18px; padding: 16px 10px; font-family: var(--display); font-size: 23px; line-height: 1.2; color: var(--c-layl); background: var(--c); box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 55%, var(--c-layl)); animation: throb 1s ease-in-out infinite; }
.buzz button small { display: block; font-family: var(--font); font-size: 12px; font-weight: 700; opacity: .8; }
.buzz button[disabled] { animation: none; opacity: .35; }
.buzz.big button { padding: 22px 10px; font-size: 26px; }
@keyframes throb { 50% { transform: scale(1.04); } }

/* النتيجة */
.verdict { border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; animation: qin .4s cubic-bezier(.2,.9,.3,1.3) both; }
.verdict.good { background: color-mix(in srgb, var(--c, var(--ok)) 26%, var(--s1)); box-shadow: inset 0 0 0 2px var(--c, var(--ok)); }
.verdict.bad, .verdict.none { background: rgb(255 86 56 / .14); box-shadow: inset 0 0 0 2px rgb(255 86 56 / .5); }
.verdict b { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.2; }
.verdict small { display: block; color: var(--dim); font-size: 13px; }
.verdict .plus { font-family: var(--display); font-size: 42px; line-height: 1; color: var(--brand); direction: ltr; animation: rise .6s cubic-bezier(.2,.9,.3,1.3) both; }
.verdict .plus.neg { color: var(--c-jamr-night); }
@keyframes rise { from { transform: translateY(14px) scale(.6); opacity: 0; } }
.autonext { position: relative; width: 100%; border: 0; border-radius: 16px; padding: 13px; background: var(--s1); border: 1px solid var(--ln); color: var(--dim); font-weight: 600; overflow: hidden; }
.autonext i { position: absolute; inset: 0 0 0 auto; background: rgb(255 197 51 / .16); width: 0; }
.autonext span { position: relative; }

/* زووم ومموّهة */
.fxwrap { border-radius: 16px; overflow: hidden; background: var(--c-waraq); }
.fxwrap .qimg { border-radius: 0; animation-timing-function: linear; animation-fill-mode: both; }
.qimg.fx-zoom { animation-name: zoomout; transform-origin: 50% 40%; }
.qimg.fx-blur { animation-name: unblur; }
@keyframes zoomout { from { transform: scale(5); } 85% { transform: scale(1.4); } to { transform: scale(1); } }
@keyframes unblur { from { filter: blur(26px); } 85% { filter: blur(5px); } to { filter: blur(0); } }

/* اختيار الأقسام */
.pickhead h1 { margin-bottom: 2px; }
.lenbox { display: flex; flex-direction: column; gap: 6px; }
.lenbox .len { margin: 0; text-align: center; font-size: 13.5px; color: var(--dim); } .lenbox .len b { color: var(--brand); }
.setbtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--ln); background: var(--s1); border-radius: 16px; padding: 11px 14px; font-weight: 700; }
.setbtn small { color: var(--dim); font-weight: 600; }
.sett .aidpick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.aidpick button { display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto auto; column-gap: 6px; text-align: start; border: 1.5px solid var(--ln); background: var(--bg); border-radius: 14px; padding: 8px; }
.aidpick button span { grid-row: span 2; font-size: 22px; align-self: center; }
.aidpick button b { font-size: 13.5px; } .aidpick button small { font-size: 11px; color: var(--dim); line-height: 1.35; }
.aidpick button[aria-pressed="true"] { border-color: var(--brand); background: rgb(255 197 51 / .1); }
