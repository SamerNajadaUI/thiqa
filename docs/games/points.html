<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>جمع نقاط</title>
<meta name="theme-color" content="#141A66">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أبو عودة للمرح">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* جمع نقاط: شكل استوديو برنامج مسابقات. خلفية زرقا ملكية، لوحة بخانات زرقا وأرقام ذهبية، وكل فريق إله ضو بلونه. */
:root {
  color-scheme: dark;
  --stage: #141A66; --stage2: #0B0F45; --tile: #2A32A3; --tile2: #222989; --edge: #3B44C7;
  --gold: #FFC93C; --gold2: #E9A800;
  --on: #F3F5FF; --dim: #AAB1EA; --faint: #6E76C2;
  --paper: #FFFFFF; --ink: #151A4A; --ink2: #5A6094;
  --good: #22C27A; --bad: #F2544B;
  --t0: #A58BFF; --t1: #FF9F1C; --t2: #2FD58E; --t3: #FF6FB5; --t4: #4FD1FF;
  --font: "Readex Pro", "Segoe UI", Tahoma, sans-serif;
  --display: "Lalezar", "Readex Pro", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--stage2); }
body { margin: 0; min-height: 100vh; color: var(--on); font-family: var(--font); font-size: 15px; line-height: 1.55;
  background: radial-gradient(120% 70% at 50% -10%, #2A33B0 0%, var(--stage) 45%, var(--stage2) 100%) fixed;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
html, body, button, a, input { touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding: calc(10px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.bar { display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
.logo { font-family: var(--display); font-size: 26px; color: var(--gold); text-decoration: none; line-height: 1; text-shadow: 0 3px 0 rgb(0 0 0 / .25); }
.ghostbtn { border: 1px solid rgb(255 255 255 / .18); background: rgb(255 255 255 / .06); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--dim); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8.5vw, 40px); line-height: 1.15; margin: 0; }
h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 6px 0 0; color: var(--on); }
.sub { color: var(--dim); margin: 0; font-size: 14px; }
.center { text-align: center; }

/* الأزرار */
.btn { border: 0; width: 100%; border-radius: 18px; padding: 15px 16px; font-family: var(--display); font-size: 23px; line-height: 1.1;
  background: var(--gold); color: #2A1E00; box-shadow: 0 5px 0 var(--gold2); transition: transform .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold2); }
.btn.alt { background: rgb(255 255 255 / .09); color: var(--on); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .16); }
.btn[disabled] { opacity: .4; }
.input { width: 100%; border: 1px solid rgb(255 255 255 / .2); background: rgb(255 255 255 / .07); color: var(--on); border-radius: 14px; padding: 13px 14px; font-size: 17px; font-family: var(--font); }
.input::placeholder { color: var(--faint); }
.err { color: #FFB4AE; font-size: 13px; margin: 0; }
.panel { background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .1); border-radius: 22px; padding: 16px; }
.rules { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 7px; font-size: 14px; color: var(--dim); }
.rules b { color: var(--on); font-weight: 600; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; border: 1px solid rgb(255 255 255 / .16); background: transparent; border-radius: 14px; padding: 11px 6px; font-weight: 700; font-size: 15px; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--on); color: var(--ink); border-color: var(--on); }

/* لوحة النتيجة: ضو لكل فريق */
.score { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 8px; }
.pod { position: relative; border-radius: 16px; padding: 8px 10px 9px; background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .08); min-width: 0; transition: background .25s, box-shadow .25s; }
.pod .nm { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pod .nm i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.pod .pts { font-family: var(--display); font-size: 30px; line-height: 1.05; direction: ltr; text-align: right; color: var(--on); }
.pod .life { display: flex; flex-wrap: wrap; gap: 2px 4px; font-size: 11.5px; line-height: 1.3; margin-top: 2px; direction: ltr; justify-content: flex-end; }
.pod .life span.off { opacity: .18; filter: grayscale(1); }
.pod.on { background: color-mix(in srgb, var(--c) 22%, transparent); box-shadow: inset 0 0 0 2px var(--c); }
.pod.on .nm { color: var(--on); }
.pod.t0 { --c: var(--t0); } .pod.t1 { --c: var(--t1); } .pod.t2 { --c: var(--t2); } .pod.t3 { --c: var(--t3); } .pod.t4 { --c: var(--t4); }
.score.n4 { gap: 6px; } .score.n4 .pod { padding: 7px; } .score.n4 .pod .pts { font-size: 24px; } .score.n4 .pod .nm { font-size: 11.5px; gap: 4px; } .score.n4 .pod .life { font-size: 9.5px; gap: 1px 2px; }
.score.n5 { gap: 4px; } .score.n5 .pod { padding: 6px 4px; border-radius: 12px; } .score.n5 .pod .pts { font-size: 20px; text-align: center; } .score.n5 .pod .nm { font-size: 10.5px; justify-content: center; } .score.n5 .pod .nm i { width: 7px; height: 7px; } .score.n5 .pod .life { font-size: 8.5px; justify-content: center; gap: 0 1px; }
.podium.n5 .blk { font-size: 18px; } .podium.n5 b { font-size: 11px; } .podium.n5 .medal { font-size: 22px; }
.turn { text-align: center; font-weight: 700; font-size: 15px; color: var(--c, var(--on)); margin: -2px 0 0; }
.turn.t0 { --c: var(--t0); } .turn.t1 { --c: var(--t1); } .turn.t2 { --c: var(--t2); } .turn.t3 { --c: var(--t3); } .turn.t4 { --c: var(--t4); }

/* اللوحة */
.board { display: grid; grid-template-columns: repeat(var(--c, 4), minmax(0, 1fr)); gap: 6px; }
.board .head { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; padding: 4px 2px 6px; text-align: center; min-width: 0; }
.board .head span { font-size: 24px; line-height: 1.15; }
.board .head b { font-size: 11.5px; font-weight: 600; line-height: 1.25; color: var(--dim); overflow-wrap: anywhere; }
.cell { position: relative; border: 0; border-radius: 12px; height: clamp(44px, 6.6vh, 58px); display: grid; place-items: center;
  background: linear-gradient(180deg, var(--tile) 0%, var(--tile2) 100%); box-shadow: inset 0 1px 0 rgb(255 255 255 / .14), 0 3px 0 #10145A;
  font-family: var(--display); font-size: clamp(19px, 5.4vw, 26px); color: var(--gold); direction: ltr; text-shadow: 0 2px 0 rgb(0 0 0 / .35); transition: transform .08s; }
.cell:active { transform: scale(.95); }
.cell .lv { position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; }
.cell .lv.d1 { background: #34D399; } .cell .lv.d2 { background: #60A5FA; } .cell .lv.d3 { background: #FBBF24; } .cell .lv.d4 { background: #F87171; }
.cell.done { background: transparent; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .08); color: transparent; text-shadow: none; cursor: default; }
.cell.done::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--w, rgb(255 255 255 / .12)); }
.cell.done.miss::after { content: "✕"; width: auto; height: auto; background: none; color: rgb(255 255 255 / .22); font-family: var(--font); font-size: 15px; }
.cell.w0 { --w: var(--t0); } .cell.w1 { --w: var(--t1); } .cell.w2 { --w: var(--t2); } .cell.w3 { --w: var(--t3); } .cell.w4 { --w: var(--t4); }
.board.wait .cell:not(.done) { filter: saturate(.55) brightness(.8); pointer-events: none; }
.board.wide { gap: 4px; } .board.wide .cell { font-size: 16px; border-radius: 9px; } .board.wide .head b { font-size: 9.5px; } .board.wide .head span { font-size: 19px; }
.legend { display: flex; justify-content: center; gap: 12px; font-size: 12px; color: var(--faint); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-inline-end: 5px; background: var(--k); vertical-align: 1px; }

/* السؤال */
.qmeta { display: flex; align-items: center; gap: 8px; }
.qmeta .cat { font-weight: 600; font-size: 14px; color: var(--dim); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { flex: none; border-radius: 999px; padding: 4px 12px; font-family: var(--display); font-size: 18px; line-height: 1.2; background: rgb(255 255 255 / .1); color: var(--gold); direction: ltr; }
.chip.dbl { background: linear-gradient(90deg, #FFB020, #FF4D3D); color: #FFF; }
.clock { position: relative; height: 8px; border-radius: 999px; background: rgb(255 255 255 / .1); overflow: hidden; }
.clock i { position: absolute; inset: 0 0 0 auto; width: 100%; background: var(--gold); border-radius: 999px; transition: width .2s linear; }
.clock.hot i { background: var(--bad); }
.secs { font-family: var(--display); font-size: 20px; direction: ltr; min-width: 34px; text-align: left; color: var(--on); }
.secs.hot { color: #FF8A80; }
.qtext { font-family: var(--display); font-weight: 400; font-size: clamp(25px, 6.8vw, 32px); line-height: 1.35; text-align: center; margin: 4px 0; text-wrap: balance; }
.qimg { display: block; width: 100%; max-height: 230px; object-fit: contain; border-radius: 18px; background: var(--paper); padding: 6px; }
.qimg.flag { padding: 14px; max-height: 170px; }
.qimg.crest { padding: 14px; max-height: 160px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.opt { position: relative; border: 0; background: var(--paper); color: var(--ink); border-radius: 16px; padding: 14px 10px 14px 12px; min-height: 66px;
  font-weight: 700; font-size: 16px; line-height: 1.35; text-align: center; display: grid; grid-template-columns: 24px 1fr; align-items: center; gap: 6px;
  box-shadow: 0 4px 0 #C9CDF0; transition: transform .08s, opacity .2s; overflow-wrap: anywhere; }
.opt:active { transform: translateY(2px); box-shadow: 0 2px 0 #C9CDF0; }
.opt .k { width: 24px; height: 24px; border-radius: 50%; background: #ECEEFB; color: var(--ink2); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.opt[disabled] { cursor: default; }
.opt.gone { opacity: .16; }
.opt.wrong { background: #FFE1DE; color: #8A1E17; box-shadow: 0 4px 0 #F6A39C; }
.opt.right { background: #D3F8E5; color: #0B5C38; box-shadow: 0 4px 0 #74DDA7; animation: pulse .9s ease-in-out 2; }
.opt.right .k, .opt.wrong .k { background: rgb(255 255 255 / .7); }
.opts.locked .opt:not(.right):not(.wrong):not(.gone) { opacity: .55; }
@keyframes pulse { 50% { transform: scale(1.03); } }
@media (max-width: 350px) { .opts { grid-template-columns: 1fr; } }
.helps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.helps button { border: 1px dashed rgb(255 201 60 / .55); background: rgb(255 201 60 / .08); border-radius: 14px; padding: 7px 4px; font-size: 12.5px; font-weight: 600; color: var(--on); display: flex; flex-direction: column; align-items: center; gap: 1px; }
.helps button span { font-size: 19px; line-height: 1.2; }
.helps button[disabled] { opacity: .28; }
.note { color: var(--dim); font-size: 13.5px; text-align: center; margin: 0; }

/* السرقة: الأسرع بياخذها */
.steal { border-radius: 20px; padding: 14px; background: linear-gradient(135deg, rgb(255 201 60 / .22), rgb(255 77 61 / .18)); border: 1px solid rgb(255 201 60 / .4); text-align: center; display: flex; flex-direction: column; gap: 10px; }
.steal b { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.2; }
.steal small { color: var(--dim); }
.buzz { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.buzz button { border: 0; border-radius: 18px; padding: 18px 10px; font-family: var(--display); font-size: 24px; color: #1A1300; background: var(--c); box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 60%, #000); animation: buzz 1s ease-in-out infinite; }
.buzz button small.cnt { display: block; font-family: var(--font); font-size: 12.5px; font-weight: 700; color: #241900; opacity: .8; margin-top: 2px; }
.steal small b { font-family: var(--font); font-weight: 800; font-size: 15px; color: var(--gold); }
.buzz button[disabled] { animation: none; opacity: .6; }
.buzz button.t0 { --c: var(--t0); } .buzz button.t1 { --c: var(--t1); } .buzz button.t2 { --c: var(--t2); } .buzz button.t3 { --c: var(--t3); } .buzz button.t4 { --c: var(--t4); }
@keyframes buzz { 50% { transform: scale(1.04); } }

/* النتيجة فوق السؤال */
.verdict { position: relative; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; overflow: hidden; }
.verdict.good { background: color-mix(in srgb, var(--c, var(--good)) 28%, #0B0F45); box-shadow: inset 0 0 0 2px var(--c, var(--good)); }
.verdict.none { background: rgb(242 84 75 / .16); box-shadow: inset 0 0 0 2px rgb(242 84 75 / .5); }
.verdict.t0 { --c: var(--t0); } .verdict.t1 { --c: var(--t1); } .verdict.t2 { --c: var(--t2); } .verdict.t3 { --c: var(--t3); } .verdict.t4 { --c: var(--t4); }
.verdict b { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.2; }
.verdict small { display: block; color: var(--dim); font-size: 13px; }
.verdict .plus { font-family: var(--display); font-size: 40px; line-height: 1; color: var(--gold); direction: ltr; animation: rise .6s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes rise { from { transform: translateY(14px) scale(.6); opacity: 0; } }
.autonext { position: relative; width: 100%; border: 0; border-radius: 16px; padding: 13px; background: rgb(255 255 255 / .08); color: var(--dim); font-weight: 600; overflow: hidden; }
.autonext i { position: absolute; inset: 0 0 0 auto; background: rgb(255 201 60 / .16); width: 0; }
.autonext span { position: relative; }

/* زووم، مموّهة، فيديو */
.fxwrap { border-radius: 18px; overflow: hidden; background: var(--paper); }
.fxwrap .qimg { border-radius: 0; animation-timing-function: linear; animation-fill-mode: both; }
.qimg.fx-zoom { animation-name: zoomout; transform-origin: 50% 40%; }
.qimg.fx-blur { animation-name: unblur; }
@keyframes zoomout { from { transform: scale(5); } 85% { transform: scale(1.4); } to { transform: scale(1); } }
@keyframes unblur { from { filter: blur(26px); } 85% { filter: blur(5px); } to { filter: blur(0); } }
.vidbox { position: relative; border-radius: 18px; overflow: hidden; background: #000; }
.vidbox::after { content: ""; position: absolute; inset: 0; }   /* طبقة فوق الفيديو: الكبس ما بيفتح شاشة كاملة */
.qvid { display: block; width: 100%; max-height: 260px; background: #000; pointer-events: none; object-fit: contain; }

/* الأسئلة الصوتية */
.sound { width: 100%; border: 0; border-radius: 22px; padding: 22px 16px; background: linear-gradient(135deg, #FFC93C, #FF9F1C); color: #2A1E00;
  font-family: var(--display); font-size: 26px; display: flex; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 5px 0 #C27A00; }
.sound .wave { display: flex; gap: 4px; align-items: center; height: 30px; }
.sound .wave i { width: 5px; height: 10px; border-radius: 3px; background: #2A1E00; }
.sound.on .wave i { animation: eq .7s ease-in-out infinite; }
.sound.on .wave i:nth-child(2) { animation-delay: .1s; } .sound.on .wave i:nth-child(3) { animation-delay: .2s; } .sound.on .wave i:nth-child(4) { animation-delay: .3s; } .sound.on .wave i:nth-child(5) { animation-delay: .4s; }
@keyframes eq { 50% { height: 30px; } }

/* اختيار الأقسام: كروت مستطيلة كبيرة، مرتبة بمجموعات ملوّنة */
.pickhead h1 { margin-bottom: 2px; }
.filters { display: flex; gap: 7px; overflow-x: auto; padding: 2px 2px 6px; margin: 0 -2px; scrollbar-width: none; position: sticky; top: 0; z-index: 5;
  background: linear-gradient(var(--stage2) 70%, transparent); }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; border: 1px solid rgb(255 255 255 / .16); background: rgb(255 255 255 / .05); color: var(--dim); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.filters button[aria-pressed="true"] { background: var(--on); color: var(--ink); border-color: var(--on); }
.search { font-size: 15px; padding: 11px 14px; }
.cgroup h3 { display: flex; align-items: center; gap: 8px; margin: 10px 2px 8px; font-size: 16px; font-weight: 700; color: var(--on); }
.cgroup h3 span { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--g) 22%, transparent); font-size: 16px; }
.cgroup h3 small { margin-inline-start: auto; color: var(--faint); font-weight: 600; font-size: 12px; }
.ccards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.ccard { position: relative; display: grid; grid-template-columns: 50px minmax(0, 1fr); align-items: center; gap: 10px; min-height: 78px; padding: 12px 12px; text-align: right;
  border: 1px solid color-mix(in srgb, var(--g) 30%, transparent); border-radius: 18px; color: var(--on);
  background: linear-gradient(135deg, color-mix(in srgb, var(--g) 18%, #141A66) 0%, rgb(255 255 255 / .03) 100%); transition: transform .1s, box-shadow .15s; }
.ccard:active { transform: scale(.97); }
.ccard .cic { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; font-size: 28px; background: color-mix(in srgb, var(--g) 26%, transparent); }
.ccard .cbody { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ccard b { font-size: 14.5px; line-height: 1.3; font-weight: 700; overflow-wrap: anywhere; }
.ccard small { color: var(--dim); font-size: 11.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ccard small i { font-style: normal; background: rgb(255 255 255 / .09); border-radius: 999px; padding: 1px 7px; color: var(--on); }
.ccard[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold), 0 0 18px rgb(255 201 60 / .18); }
.ccard .ord { position: absolute; top: -7px; left: -7px; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: #2A1E00; font-size: 13px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 2px 0 var(--gold2); }
@media (max-width: 340px) { .ccards { grid-template-columns: 1fr; } }
.dock { grid-template-columns: 1fr auto auto !important; }
.dock .chosen { display: flex; gap: 5px; min-width: 0; overflow-x: auto; }
.dock .chosen span { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 1.5px dashed rgb(255 255 255 / .2); display: grid; place-items: center; font-size: 20px; }
.dock .chosen span.on { border: 0; background: rgb(255 201 60 / .18); cursor: pointer; }
.dock .btn { padding: 12px 16px; width: auto; font-size: 20px; }
.dock .rnd { width: 48px; height: 48px; }

/* اختيار الأقسام (قديم) */
.grp { margin: 6px 2px -4px; font-weight: 700; font-size: 14px; color: var(--dim); }
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cats button { position: relative; border: 1px solid rgb(255 255 255 / .12); background: rgb(255 255 255 / .05); border-radius: 16px; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; line-height: 1.3; color: var(--on); min-width: 0; }
.cats button span { font-size: 28px; line-height: 1.1; }
.cats button small { color: var(--faint); font-size: 11px; font-weight: 500; }
.cats button[aria-pressed="true"] { background: rgb(255 201 60 / .14); border-color: var(--gold); }
.cats button .ord { position: absolute; top: 6px; left: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #2A1E00; font-size: 12px; font-weight: 800; display: grid; place-items: center; }

<body>
<div class="wrap">
  <div class="bar"><a class="logo" href="./">جمع نقاط</a><button class="ghostbtn" id="quit" type="button">الألعاب</button></div>
  <main id="app" aria-live="polite"><div class="loading">بحمّل الأسئلة...</div></main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k, d) { try { const v = localStorage.getItem("points-" + k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem("points-" + k, JSON.stringify(v)); } catch {} } };
function render(html) { $("app").innerHTML = `<div class="wrap" style="padding:0">${html}</div>`; }
function bind(map) { for (const [id, fn] of Object.entries(map)) { const el = $(id); if (el) el.onclick = fn; } }

// ---------- القواعد ----------
const LEVELS = [null, { name: "سهل", pts: 100 }, { name: "متوسط", pts: 200 }, { name: "صعب", pts: 300 }, { name: "صعب جداً", pts: 500 }];
const LAYOUT = [1, 1, 2, 2, 3, 3, 4, 4];          // 8 أسئلة بكل قسم
const MAX_TEAMS = 5;
const catChoices = (n) => (n === 5 ? [5] : n === 3 ? [3, 6] : [2, 4, 6]);   // عشان كل فريق ياخذ نفس عدد الأسئلة
const Q_MS = (d) => (d >= 4 ? 40000 : 30000);
const STEAL_MS = 15000, OFFER_MS = 7000, NEXT_MS = 4200;
const HELPS = [
  { k: "cut", icon: "✂️", name: "حذف ثنتين" },
  { k: "two", icon: "✌️", name: "محاولتين" },
  { k: "swap", icon: "🔄", name: "سؤال ثاني" },
];
const newHelp = () => ({ cut: true, two: true, swap: true });
let DATA, CAT;

let AC = null;
function audio() {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch { AC = null; }
  return AC;
}
document.addEventListener("pointerdown", () => audio(), { once: true });
function tone(freq, start, dur, type = "sine", vol = 0.18) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime + start);
  g.gain.setValueAtTime(0.0001, ac.currentTime + start);
  g.gain.exponentialRampToValueAtTime(vol, ac.currentTime + start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + start + dur);
  o.connect(g).connect(ac.destination); o.start(ac.currentTime + start); o.stop(ac.currentTime + start + dur + 0.05);
}
function haptic(kind) {
  try { window.webkit?.messageHandlers?.haptic?.postMessage(kind); } catch {}
  try { navigator.vibrate && navigator.vibrate(kind === "error" ? [80, 60, 120] : [40]); } catch {}
}
function confettiBurst(big = false) {
  const cv = document.createElement("canvas");
  cv.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999";
  document.body.appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const c = cv.getContext("2d"); c.scale(dpr, dpr);
  const colors = ["#6C47FF", "#FDB022", "#12B76A", "#F04438", "#0BA5EC", "#EE46BC", "#FFFFFF"];
  const N = big ? 260 : 160, parts = [];
  for (let i = 0; i < N; i++) {
    const fromLeft = i % 2 === 0;
    parts.push({
      x: fromLeft ? -10 : innerWidth + 10, y: innerHeight * (0.55 + Math.random() * 0.3),
      vx: (fromLeft ? 1 : -1) * (6 + Math.random() * 9), vy: -(10 + Math.random() * 12),
      w: 6 + Math.random() * 7, h: 8 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      col: colors[i % colors.length], shape: Math.random() < 0.3 ? "c" : "r",
    });
  }
  const t0 = performance.now();
  (function frame(t) {
    const el = (t - t0) / 1000;
    c.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.globalAlpha = Math.max(0, 1 - Math.max(0, el - 1.8) / 0.8);
      c.fillStyle = p.col;
      if (p.shape === "c") { c.beginPath(); c.arc(0, 0, p.w / 2, 0, 7); c.fill(); }
      else c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 2);
      c.restore();
    }
    if (el < 2.6) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}
function redFlash() {
  const o = document.createElement("div");
  o.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:9998;background:radial-gradient(circle at 50% 45%,rgba(240,68,56,.25),rgba(217,45,32,.75));opacity:0;transition:opacity .12s";
  document.body.appendChild(o);
  requestAnimationFrame(() => { o.style.opacity = "1"; });
  setTimeout(() => { o.style.transition = "opacity .6s"; o.style.opacity = "0"; }, 380);
  setTimeout(() => o.remove(), 1100);
  const app = document.querySelector(".wrap") || document.body;
  app.animate([{ transform: "translateX(0)" }, { transform: "translateX(-14px)" }, { transform: "translateX(12px)" },
    { transform: "translateX(-9px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 480, easing: "ease-out" });
}
function fx(kind) {
  if (kind === "good" || kind === "win") {
    confettiBurst(kind === "win");
    [523, 659, 784, 1047].forEach((f, k) => tone(f, k * 0.09, 0.28, "triangle", 0.16));
    haptic("success");
  } else if (kind === "bad") {
    redFlash();
    tone(196, 0, 0.22, "sawtooth", 0.12); tone(147, 0.18, 0.35, "sawtooth", 0.12);
    haptic("error");
  }
}




// ---------- المحرك (عند صاحب الغرفة، أو على التلفون الواحد) ----------
let S = null, SECRET = null, mode = null, timer = null, nextTimer = null;
const nT = () => S.teams.length;
const catsN = () => (S && S.catsN) || (S && nT() === 5 ? 5 : nT() === 3 ? 3 : 4);
function usedSet() { return new Set(store.get("used", [])); }
function markUsed(key) { const u = store.get("used", []); u.push(key); store.set("used", u.slice(-4000)); }
const qkey = (q) => q[1] + "|" + (q[3] || "");

function drawQuestion(cid, d, avoid) {
  const used = usedSet();
  const all = CAT.get(cid).qs.filter((q) => q[0] === d && !avoid.has(qkey(q)));
  let pool = all.filter((q) => !used.has(qkey(q)));
  if (!pool.length) pool = all;
  if (!pool.length) pool = CAT.get(cid).qs.filter((q) => q[0] === d);
  return pool[Math.floor(Math.random() * pool.length)];
}
function newGame(cats) {
  SECRET = { taken: new Set(), pre: {} };
  S.cats = cats; S.board = {};
  for (const cid of cats) {
    SECRET.pre[cid] = LAYOUT.map((d) => { const q = drawQuestion(cid, d, SECRET.taken); SECRET.taken.add(qkey(q)); return q; });
    S.board[cid] = LAYOUT.map((d) => ({ d, w: null }));
  }
  const flat = cats.flatMap((cid) => S.board[cid].map((_, i) => `${cid}:${i}`));
  SECRET.dbl = flat[Math.floor(Math.random() * flat.length)];
  S.teams.forEach((t) => { t.score = 0; t.help = newHelp(); t.cards = CARDS; });
  S.turn = Math.floor(Math.random() * nT());
  S.phase = "board"; S.cur = null; S.res = null;
  for (const cid of cats) for (const q of SECRET.pre[cid]) if (q[3]) { const im = new Image(); im.referrerPolicy = "no-referrer"; im.src = imgUrl(q[3]); }
}
function openCell(team, cid, i) {
  const cell = S.board[cid] && S.board[cid][i];
  if (!cell || cell.w !== null || S.phase !== "board" || team !== S.turn) return false;
  S.cur = { dbl: SECRET.dbl === `${cid}:${i}` };
  setQuestion(SECRET.pre[cid][i], cid, i, team);
  if (S.cur.dbl) S.fxId = { id: Date.now(), kind: "dbl", team };
  return true;
}
function setQuestion(q, cid, i, team) {
  const order = shuffle([0, 1, 2, 3]);
  SECRET.right = order.indexOf(0); SECRET.q = q;
  Object.assign(S.cur, { cid, i, d: q[0], text: q[1], img: q[3] || null, opts: order.map((k) => q[2][k]),
    team, picker: team, gone: [], wrong: [], tries: 1, steal: null, buzzers: null,
    deadline: Date.now() + Q_MS(q[0]) + (S.cur.dbl ? 2500 : 0) });
  S.phase = "q";
  markUsed(qkey(q));
  arm();
}
function arm() {
  clearTimeout(timer);
  const id = S.cur && S.cur.deadline;
  timer = setTimeout(() => { if (S && S.phase === "q" && S.cur.deadline === id) { timeUp(); commit(); } }, Math.max(0, S.cur.deadline - Date.now()) + 250);
}
const leftOpts = (c) => [0, 1, 2, 3].filter((k) => !c.gone.includes(k) && !c.wrong.includes(k)).length;
// غلط أو خلص الوقت: الفرق الثانية بتقدر تسرق. مع فريقين بيجاوب الثاني على طول، ومع 3 فرق الأسرع بالكبسة بياخذها
// كرت السرقة: كل فريق معه 3 كروت باللعبة. بعد الغلط، بيطلع للفرق الثانية سؤال سريع: بدكم تسرقوا؟
// الأسرع اللي بيكبس بياخذها. إذا جاوب صح بياخذ كامل النقاط، وإذا غلط بينخصم منه نصّها.
const CARDS = 3;
function openSteal() {
  const c = S.cur;
  c.lastWrong = c.picker;
  const able = S.teams.map((_, k) => k).filter((k) => k !== c.picker && (S.teams[k].cards ?? CARDS) > 0);
  if (leftOpts(c) < 2 || !able.length) return finish(null, null);
  c.steal = "offer"; c.offer = able; c.declined = []; c.team = null; c.deadline = Date.now() + OFFER_MS;
  S.fxId = { id: Date.now(), kind: "steal" };
  arm();
}
function timeUp() {
  const c = S.cur;
  if (!c.steal) openSteal();
  else if (c.steal === "offer") finish(null, null);
  else finish(null, null, c.team);    // السارق خلص وقته: بينخصم منه
}
function useCard(team) {
  const c = S.cur;
  if (S.phase !== "q" || c.steal !== "offer" || !c.offer.includes(team) || c.declined.includes(team)) return false;
  const t = S.teams[team];
  if ((t.cards ?? CARDS) <= 0) return false;
  t.cards = (t.cards ?? CARDS) - 1;
  c.steal = "answer"; c.team = team; c.deadline = Date.now() + STEAL_MS;
  S.fxId = { id: Date.now(), kind: "buzz", team };
  arm();
  return true;
}
function decline(team) {
  const c = S.cur;
  if (S.phase !== "q" || c.steal !== "offer") return false;
  if (team === "all") return finish(null, null), true;
  if (!c.offer.includes(team) || c.declined.includes(team)) return false;
  c.declined.push(team);
  if (c.offer.every((k) => c.declined.includes(k))) finish(null, null);
  return true;
}
const cellPoints = (c) => LEVELS[c.d].pts * (c.dbl ? 2 : 1);
function finish(winner, pick, thief = null) {
  clearTimeout(timer);
  const c = S.cur;
  let pts = 0, minus = 0;
  if (winner !== null) { pts = cellPoints(c); S.teams[winner].score += pts; }
  else if (thief !== null) { minus = Math.round(cellPoints(c) / 2); S.teams[thief].score -= minus; }
  S.board[c.cid][c.i].w = winner === null ? -1 : winner;
  S.res = { winner, pts, minus, thief, right: SECRET.right, pick, steal: c.steal === "answer", dbl: c.dbl, until: Date.now() + NEXT_MS };
  c.right = SECRET.right; c.team = winner;
  S.phase = "res";
  S.fxId = { id: Date.now(), kind: winner === null ? "none" : "good", team: winner };
  S.turn = (S.turn + 1) % nT();
  armNext();
}
// بعد الجواب بنرجع للوحة لحالنا
function armNext() {
  clearTimeout(nextTimer);
  const id = S.res && S.res.until;
  nextTimer = setTimeout(() => { if (S && S.phase === "res" && S.res.until === id) { backToBoard(); commit(); } }, Math.max(0, S.res.until - Date.now()));
}
function answer(team, k) {
  const c = S.cur;
  if (S.phase !== "q" || c.steal === "offer" || team !== c.team || c.gone.includes(k) || c.wrong.includes(k)) return;
  if (k === SECRET.right) return finish(team, k);
  S.fxId = { id: Date.now(), kind: "bad", team };
  c.wrong.push(k);
  if (!c.steal && c.tries > 1) { c.tries--; return; }
  if (!c.steal) openSteal(); else finish(null, k, team);
}
function useHelp(team, h) {
  const c = S.cur, t = S.teams[team];
  if (S.phase !== "q" || team !== c.team || c.steal || !t.help[h]) return;
  if (h === "cut") {
    const wrongs = [0, 1, 2, 3].filter((k) => k !== SECRET.right && !c.gone.includes(k) && !c.wrong.includes(k));
    if (wrongs.length < 2) return;
    c.gone.push(...shuffle(wrongs).slice(0, 2));
  } else if (h === "two") {
    c.tries = 2;
  } else if (h === "swap") {
    const q = drawQuestion(c.cid, c.d, new Set([...SECRET.taken, qkey(SECRET.q)]));
    if (!q) return;
    SECRET.taken.add(qkey(q));
    t.help[h] = false;
    setQuestion(q, c.cid, c.i, team);
    return;
  }
  t.help[h] = false;
}
function backToBoard() {
  if (S.phase !== "res") return;
  clearTimeout(nextTimer);
  const left = S.cats.some((cid) => S.board[cid].some((c) => c.w === null));
  S.phase = left ? "board" : "over"; S.cur = null;
  if (!left) S.fxId = { id: Date.now(), kind: "win" };
}

function act(a) {
  const team = mode === "local" ? a.team : teamOf(a.pid);
  switch (a.t) {
    case "join": return join(a);
    case "begin":
      if (mode !== "host" || a.pid !== S.host || S.phase !== "lobby" || nT() < 2) return;
      S.phase = "cats"; S.catsN = nT() === 5 ? 5 : nT() === 3 ? 3 : 4; break;
    case "catsn":
      if (S.phase !== "cats" || (mode !== "local" && a.pid !== S.host) || !catChoices(nT()).includes(a.n)) return;
      S.catsN = a.n; break;
    case "cats":
      if (S.phase !== "cats" || (mode !== "local" && a.pid !== S.host)) return;
      if (!Array.isArray(a.cats) || !catChoices(nT()).includes(a.cats.length) || a.cats.some((c) => !CAT.has(c))) return;
      S.catsN = a.cats.length; newGame(a.cats); break;
    case "open": if (!openCell(team, a.cid, a.i)) return; break;
    case "ans": answer(team, a.k); break;
    case "card": if (!useCard(team)) return; break;
    case "decline": if (!decline(a.all ? "all" : team)) return; break;
    case "help": useHelp(team, a.h); break;
    case "next": backToBoard(); break;
    case "again":
      if (S.phase !== "over" || (mode !== "local" && a.pid !== S.host)) return;
      S.phase = "cats"; S.cats = []; S.board = {}; break;
    default: return;
  }

}
function teamOf(pid) { return S.teams.findIndex((t) => t.pid === pid); }
function join(a) {
  if (mode !== "host") return;
  const i = teamOf(a.pid);
  if (i >= 0) { if (a.name) S.teams[i].name = String(a.name).slice(0, 16); return commit(); }
  if (S.phase !== "lobby" || nT() >= MAX_TEAMS) return commit();
  S.teams.push({ pid: a.pid, name: String(a.name || `الفريق ${nT() + 1}`).slice(0, 16), score: 0, help: newHelp() });
  commit();
}

// ---------- الاتصال (MQTT) ----------
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt", "wss://test.mosquitto.org:8081/mqtt"];
const qs = new URLSearchParams(location.search);
const ROOT = "abuodeh-points-v2";
let client = null, room = null, offset = 0, lastFx = null, ticker = null;
const me = { id: store.get("pid", null), name: store.get("team", "") };
if (!me.id) { me.id = Math.random().toString(36).slice(2, 10); store.set("pid", me.id); }
const topic = (k) => `${ROOT}/${room}/${k}`;
const now = () => Date.now() + offset;
const snap = () => ({ S, SECRET: Object.assign({}, SECRET, { taken: [...(SECRET ? SECRET.taken : [])] }) });
const unsnap = (saved) => { S = saved.S; SECRET = Object.assign(saved.SECRET || {}, { taken: new Set((saved.SECRET && saved.SECRET.taken) || []) }); if (S.phase === "q") arm(); if (S.phase === "res") armNext(); };

function commit() {
  S.v = (S.v || 0) + 1; S.now = Date.now();
  if (mode === "host") {
    store.set("host-" + room, snap());
    store.set("online", { room, host: true, at: Date.now() });
    try { client.publish(topic("s"), JSON.stringify(S), { qos: 1, retain: true }); } catch {}
  } else if (mode === "local") store.set("local", snap());

function send(a) {
  a.pid = me.id;
  if (mode === "host" || mode === "local") return act(a);
  if (client) client.publish(topic("a"), JSON.stringify(a), { qos: 1 });
}
function connect(onReady, k = 0) {
  if (typeof mqtt === "undefined") return fail("ما قدرت أحمّل الاتصال. تأكد من الإنترنت وارجع جرّب.");
  const url = qs.get("broker") || BROKERS[k % BROKERS.length];
  let ready = false;
  const c = mqtt.connect(url, { clientId: "ap_" + me.id + "_" + Math.random().toString(36).slice(2, 6), reconnectPeriod: 2000, connectTimeout: 8000, clean: true });
  const giveUp = setTimeout(() => { if (!ready) { c.end(true); if (k + 1 < BROKERS.length && !qs.get("broker")) connect(onReady, k + 1); else fail("ما قدرت أتصل. جرّب كمان شوي."); } }, 9000);
  c.on("connect", () => {
    if (!ready) { ready = true; clearTimeout(giveUp); client = c; onReady(); return; }
    if (!room) return;
    c.subscribe(topic("s"), { qos: 1 });
    if (mode === "host") { c.subscribe(topic("a"), { qos: 1 }); commit(); } else send({ t: "join", name: me.name });
  });
  c.on("message", (t, buf) => {
    let m; try { m = JSON.parse(buf.toString()); } catch { return; }
    if (t === topic("s") && mode === "guest") onState(m);
    else if (t === topic("a") && mode === "host") act(m);
  });
}
function fail(msg) { render(`<h1>مشكلة بالاتصال</h1><p class="sub">${esc(msg)}</p><button class="btn" id="back" type="button">رجوع</button>`); bind({ back: leave }); }
function leave() {
  try { if (client && mode === "host" && room) client.publish(topic("s"), "", { qos: 1, retain: true }); } catch {}
  const c = client; setTimeout(() => { try { c && c.end(true); } catch {} }, 300);
  client = null; room = null; S = null; SECRET = null; mode = null; clearTimeout(timer); clearTimeout(nextTimer); clearInterval(ticker);
  store.set("online", null);
  history.replaceState(null, "", location.pathname);
  intro();
}
function hostRoom(code, saved) {
  mode = "host";
  room = code || String(Math.floor(10000 + Math.random() * 90000));
  render(`<div class="loading">عم بفتح الغرفة...</div>`);
  connect(() => {
    client.subscribe([topic("s"), topic("a")], { qos: 1 });
    if (saved && saved.S) unsnap(saved);
    else S = { room, host: me.id, phase: "lobby", teams: [{ pid: me.id, name: me.name || "الفريق الأول", score: 0, help: newHelp() }], cats: [], board: {}, turn: 0 };
    commit();
  });
}
function joinRoom(code) {
  mode = "guest"; room = code;
  store.set("online", { room, host: false, at: Date.now() });
  render(`<div class="loading">عم بدخل الغرفة...</div>`);
  connect(() => {
    client.subscribe(topic("s"), { qos: 1 });
    send({ t: "join", name: me.name });
    setTimeout(() => {
      if (S) return;
      render(`<h1>ما في رد من الغرفة ${esc(room)}</h1><p class="sub">تأكد من الكود، وإنه تلفون صاحب الغرفة مفتوح على اللعبة.</p><button class="btn" id="again" type="button">جرّب كمان مرة</button><button class="btn alt" id="back" type="button">رجوع</button>`);
      bind({ again: () => send({ t: "join", name: me.name }), back: leave });
    }, 6000);
  });
}
function localGame(saved) {
  mode = "local"; room = null;
  if (saved && saved.S) { unsnap(saved); return commit(); }
  localNames(store.get("nteams", 2));
}

    <button class="btn" id="go" type="button">اختاروا الأقسام</button>

  const keep = () => { const cur = store.get("names", ["الفريق الأول", "الفريق الثاني", "الفريق الثالث", "الفريق الرابع", "الفريق الخامس"]); for (let i = 0; i < n; i++) cur[i] = $("n" + i).value.trim() || cur[i]; store.set("names", cur); };

const myTeam = () => (mode === "local" ? -2 : teamOf(me.id));
const canAct = (team) => mode === "local" || myTeam() === team;

function onState(st) {
  if (!st) return;
  if (mode === "guest") {
    if (st.room !== room) return;
    if (S && st.v <= S.v && st.host === S.host) return;
    if (st.teams && !st.teams.some((t) => t.pid === me.id) && (st.phase !== "lobby" || st.teams.length >= MAX_TEAMS)) { S = st; return full(); }
  }
  S = st;
  offset = (st.now || Date.now()) - Date.now();
  if (mode === "host" || mode === "guest") store.set("online", { room, host: mode === "host", at: Date.now() });
  const f = S.fxId;
  if (f && f.id !== lastFx) { lastFx = f.id; if (Date.now() - (f.id - offset) < 20000) effects(f); }
  draw();
}
function full() { render(`<h1>الغرفة مليانة</h1><p class="sub">في ${MAX_TEAMS} فرق جوّا، أو اللعبة بلّشت.</p><button class="btn alt" id="back" type="button">رجوع</button>`); bind({ back: leave }); }

function effects(f) {
  const mine = mode === "local" || f.team === myTeam();
  if (f.kind === "dbl") dblOverlay(f.team);
  else if (f.kind === "good") setTimeout(() => (mine ? fx("good") : tone(330, 0, .2, "triangle", .1)), 60);
  else if (f.kind === "bad" && mine) setTimeout(() => fx("bad"), 60);
  else if (f.kind === "none") tone(196, 0, .3, "sawtooth", .08);
  else if (f.kind === "steal") { tone(880, 0, .1, "square", .1); tone(1175, .12, .16, "square", .1); haptic("success"); }
  else if (f.kind === "buzz") { tone(1320, 0, .12, "square", .12); haptic("success"); }
  else if (f.kind === "win") setTimeout(() => fx("win"), 200);
}
function dblOverlay(team) {
  const t = S.teams[team];
  const mine = mode === "local" || myTeam() === team;
  const o = document.createElement("div");
  o.className = "dblover";
  o.innerHTML = `<div><b>دبل 🔥</b><small>${mode === "local" ? `«${esc(t.name)}» فتحوا السؤال الدبل! نقاطه ضعف` : mine ? "فتحتوا السؤال الدبل! نقاطه ضعف" : `«${esc(t.name)}» فتحوا السؤال الدبل!`}</small></div>`;
  document.body.appendChild(o);
  [523, 659, 784, 1047, 1319].forEach((fq, k) => tone(fq, k * 0.08, 0.3, "triangle", 0.16));
  haptic("success");
  setTimeout(() => { o.style.transition = "opacity .4s"; o.style.opacity = "0"; }, 2100);
  setTimeout(() => o.remove(), 2600);
}

function draw() {

  window.scrollTo(0, 0);
  if (S.phase === "lobby") return drawLobby();
  if (S.phase === "cats") return drawCats();
  if (S.phase === "board") return drawBoard();
  if (S.phase === "q") return drawQ();
  if (S.phase === "res") return drawRes();

}

];
let catFilter = "all", catSearch = "";
const kindOf = (c) => c.qs.some((q) => q[3] && q[3].startsWith("video:")) ? ["🎥", "فيديو"] : c.qs.some((q) => q[3] && q[3].startsWith("audio:")) ? ["🔊", "صوت"]
  : c.qs.some((q) => q[3] && /^(zoom|blur):/.test(q[3])) ? ["✨", "تأثير"] : c.qs.some((q) => q[3]) ? ["📷", "صور"] : ["✍️", "أسئلة"];
function catGroups() {
  const seen = new Set(), out = [];
  for (const [ic, g, col, ids] of GROUPS) { const list = ids.filter((id) => !seen.has(id)).map((id) => CAT.get(id)).filter(Boolean); list.forEach((c) => seen.add(c.id)); if (list.length) out.push([ic, g, col, list]); }
  const rest = DATA.cats.filter((c) => !seen.has(c.id));
  if (rest.length) out.push(["➕", "غيرها", "#AAB1EA", rest]);
  return out;
}
function drawCats() {
  if (!(mode === "local" || S.host === me.id)) {
    render(`${scoreBar()}<h1 class="center" style="margin-top:20px">صاحب الغرفة عم يختار الأقسام</h1><p class="note">ثواني وبتبلّش اللعبة.</p><div class="loading">⏳</div><button class="linkish" id="out" type="button">اطلع</button>`);

  }

  const groups = catGroups();
  const q = catSearch.trim();
  const shown = groups.filter(([, g]) => catFilter === "all" || catFilter === g)
    .map(([ic, g, col, list]) => [ic, g, col, list.filter((c) => !q || c.name.includes(q))]).filter(([, , , l]) => l.length);
  render(`<div class="pickhead"><h1>اختاروا ${N} أقسام</h1><p class="sub">${DATA.cats.length} قسم · ${N * 8} سؤال، يعني ${(N * 8) / nT()} لكل فريق</p></div>
    ${catChoices(nT()).length > 1 ? `<div class="seg">${catChoices(nT()).map((k) => `<button type="button" data-cn="${k}" aria-pressed="${N === k}">${k} أقسام</button>`).join("")}</div>` : ""}
    <div class="filters" role="tablist"><button type="button" data-f="all" aria-pressed="${catFilter === "all"}">الكل</button>${groups.map(([ic, g]) => `<button type="button" data-f="${esc(g)}" aria-pressed="${catFilter === g}">${ic} ${esc(g)}</button>`).join("")}</div>
    <input class="input search" id="csearch" type="search" placeholder="🔎 دوّر على قسم..." value="${esc(catSearch)}" autocomplete="off">

        return `<button type="button" class="ccard" data-c="${c.id}" aria-pressed="${k >= 0}">
          <span class="cic">${c.icon}</span><span class="cbody"><b>${esc(c.name)}</b><small><i>${ki} ${kn}</i> ${c.qs.length} سؤال</small></span>

    <div class="dock"><div class="chosen">${Array.from({ length: N }, (_, i) => picked[i] ? `<span class="on" data-un="${picked[i]}" title="${esc(CAT.get(picked[i]).name)}">${CAT.get(picked[i]).icon}</span>` : `<span></span>`).join("")}</div>
      <button class="rnd" id="rnd" type="button" aria-label="اختيار عشوائي">🎲</button>

function imgUrl(u) {
  const m = String(u || "").match(/\/wikipedia\/([a-z]+)\/thumb\/[^/]+\/[^/]+\/([^/?]+)\//);
  return m ? `https://${m[1] === "commons" ? "commons.wikimedia.org" : m[1] + ".wikipedia.org"}/wiki/Special:FilePath/${m[2]}?width=640` : u;
}
// الأسئلة الصوتية: زر كبير بيشغّل الصوت (وبنحاول نشغّله لحاله أول ما يطلع السؤال)
// الآيفون ما بيشغّل صوت إلا من عنصر صوت "انفتح" بكبسة. فبنعمل عنصر واحد مع أول كبسة ونضل نستعمله لكل الأصوات
let SND = null, sndKey = "", sndUrl = "", sndAlt = false;
function sndEl() {
  if (!SND) {
    SND = new Audio(); SND.preload = "auto"; SND.setAttribute("playsinline", "");
    SND.onerror = () => {
      const alt = altAudio(sndUrl);
      if (alt && !sndAlt && SND.src) { sndAlt = true; SND.src = alt; SND.play().catch(() => {}); return; }
      const note = document.getElementById("sndnote"); if (note && SND.src) note.textContent = "ما قدرت أشغّل الصوت. تأكد إنك متصل بالنت وجرّب كمان مرة.";
    };
    SND.onended = () => { const b = document.getElementById("sndbtn"); if (b) b.classList.remove("on"); };
  }
  return SND;
}
function unlockAudio() { try { const a = sndEl(); if (!a.src) { a.muted = true; a.play().catch(() => {}); a.muted = false; } } catch {} }
document.addEventListener("pointerdown", unlockAudio, { once: true });
const altAudio = (u) => { const m = String(u).match(/\/transcoded\/([^/]+\/[^/]+)\/([^/]+)\/[^/]+$/); return m ? u.replace(m[0], `/${m[1]}/${m[2]}`) : null; };
function playSound(url) {
  const a = sndEl(), b = document.getElementById("sndbtn"), note = document.getElementById("sndnote");
  try {
    if (sndUrl !== url) { sndUrl = url; sndAlt = false; a.src = url; }
    a.muted = false; a.currentTime = 0;
    const p = a.play();
    if (b) b.classList.add("on");
    if (p && p.catch) p.catch(() => { if (b) b.classList.remove("on"); if (note) note.textContent = "اكبس على الزر عشان تسمع الصوت 👆"; });
  } catch {}
}
function qImage(c) {
  if (!c.img) return "";
  if (c.img.startsWith("video:")) {
    const url = c.img.slice(6);
    // داخل الصفحة وبدون شاشة كاملة: playsinline + muted، وبدون أزرار تحكم، والكبس عليه ما بيعمل إشي
    setTimeout(() => {
      const v = document.getElementById("qvid"); if (!v || v.dataset.ready) return;
      v.dataset.ready = "1"; v.muted = true; v.defaultMuted = true; v.playsInline = true; v.controls = false;
      v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
      v.onerror = () => { const n = document.getElementById("vidnote"); if (n) n.textContent = "ما قدرت أشغّل الفيديو على هالجهاز."; v.style.display = "none"; };
      const p = v.play(); if (p && p.catch) p.catch(() => {});
    }, 0);
    return `<div class="vidbox"><video class="qvid" id="qvid" src="${esc(url)}" playsinline webkit-playsinline muted autoplay loop preload="auto" disablepictureinpicture disableremoteplayback></video></div>
      <p class="note" id="vidnote">🎥 الفيديو بيعيد لحاله، بدون صوت</p>`;
  }
  if (c.img.startsWith("zoom:") || c.img.startsWith("blur:")) {
    const fx = c.img.slice(0, 4), url = imgUrl(c.img.slice(5));
    // التأثير بيخف مع الوقت: كل ما تستنى أكثر بتوضح الصورة أكثر
    const live = S.phase === "q" && !c.steal;
    const total = Q_MS(c.d) / 1000, left = Math.max(0, (c.deadline - now()) / 1000);
    const style = live ? `animation-duration:${total}s;animation-delay:-${Math.max(0, total - left).toFixed(1)}s` : "animation:none";
    return `<div class="fxwrap"><img class="qimg fx-${fx}" style="${style}" src="${esc(url)}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'"></div>
      ${live ? `<p class="note">${fx === "zoom" ? "🔍 الصورة بتبعد شوي شوي" : "🌫️ الصورة بتوضح شوي شوي"}، جاوب بأسرع وقت</p>` : ""}`;
  }
  if (c.img.startsWith("audio:")) {
    const url = c.img.slice(6), k = c.cid + ":" + c.i + ":" + url;
    if (k !== sndKey) { sndKey = k; setTimeout(() => playSound(url), 300); }
    setTimeout(() => { const b = document.getElementById("sndbtn"); if (b) b.onclick = () => playSound(url); }, 0);
    return `<button class="sound" id="sndbtn" type="button" aria-label="شغّل الصوت"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span>اسمع الصوت 🔊</button>
      <p class="note" id="sndnote">إذا ما سمعت إشي: اكبس الزر، وتأكد إن صوت التلفون مفتوح ومش على الصامت 🔕</p>`;
  }
  const cls = c.img.includes("flagcdn") ? "flag" : c.img.includes("teamlogos") || /\.svg/i.test(c.img) ? "crest" : "";
  return `<img class="qimg ${cls}" src="${esc(imgUrl(c.img))}" data-alt="${esc(c.img)}" alt="" referrerpolicy="no-referrer" onerror="if(this.dataset.alt&&this.src!==this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt='';}else{this.style.display='none'}">`;
}
function qHead(c, withClock) {
  const cat = CAT.get(c.cid);
  return `<div class="qmeta"><span class="cat">${cat.icon} ${esc(cat.name)} · ${LEVELS[c.d].name}</span>
    ${c.dbl ? `<span class="chip dbl">×2 🔥</span>` : ""}<span class="chip">${cellPoints(c)}</span>${withClock ? `<span class="secs" id="secs"></span>` : ""}</div>
    ${withClock ? `<div class="clock" id="clock"><i id="bar"></i></div>` : ""}`;
}
function optsHtml(c, enabled, reveal) {
  return `<div class="opts ${reveal ? "locked" : ""}">${c.opts.map((o, k) => {
    const cls = reveal ? (k === c.right ? "right" : c.wrong.includes(k) ? "wrong" : c.gone.includes(k) ? "gone" : "")
      : c.gone.includes(k) ? "gone" : c.wrong.includes(k) ? "wrong" : "";
    const off = !enabled || c.gone.includes(k) || c.wrong.includes(k);
    return `<button class="opt ${cls}" type="button" data-k="${k}" ${off ? "disabled" : ""}><span class="k">${"أبجد"[k]}</span><span>${esc(o)}</span></button>`; }).join("")}</div>`;
}

let lastQKey = "";
function drawQ() {
  const c = S.cur;
  const qk = c.cid + ":" + c.i + ":" + c.text + ":" + (c.img || "");
  const enter = qk !== lastQKey; lastQKey = qk;
  const buzzing = c.steal === "offer";
  const t = c.team !== null && c.team !== undefined ? S.teams[c.team] : null;
  const mine = !buzzing && canAct(c.team);
  const myT = myTeam();
  const iCanBuzz = buzzing && (mode === "local" || (c.offer.includes(myT) && !c.declined.includes(myT)));
  const full = cellPoints(c), half = Math.round(full / 2);
  let top = "";
  if (buzzing) {
    const who = mode === "local" ? c.offer : iCanBuzz ? [myT] : [];
    top = `<div class="steal"><b>🦊 بدكم تستخدموا كرت سرقة؟</b>
      <small>«${esc(S.teams[c.lastWrong].name)}» ما جابوها. الصح بياخذ <b>+${full}</b>، والغلط بينخصم <b>−${half}</b>. ${mode === "local" ? "أول فريق بيكبس بيسرق" : iCanBuzz ? "الأسرع بياخذها!" : "الفرق الثانية عم تقرر..."}</small>
      ${who.length ? `<div class="buzz">${who.map((k) => `<button class="t${k}" type="button" data-card="${k}">${mode === "local" ? `${esc(S.teams[k].name)}<small class="cnt">🦊 ${S.teams[k].cards ?? CARDS}</small>` : `اسرق!<small class="cnt">باقي معكم ${S.teams[k].cards ?? CARDS} كروت</small>`}</button>`).join("")}</div>
        <button class="linkish" id="nosteal" type="button" style="color:var(--dim)">${mode === "local" ? "ما حدا بدّه يسرق" : "لا، مش هالمرة"}</button>` : ""}</div>`;
  } else if (c.steal === "answer") {
    top = `<div class="steal"><b>🦊 «${esc(t.name)}» استخدموا كرت سرقة</b><small>صح = <b>+${full}</b> · غلط = <b>−${half}</b></small></div>`;
  }
  render(`${scoreBar(buzzing ? -1 : c.team)}
    ${qHead(c, true)}
    ${top}
    ${qImage(c)}
    <div class="qtext ${enter ? "enter" : ""}">${esc(c.text)}</div>
    <div class="${enter ? "enteropts" : ""}">${optsHtml(c, mine, false)}</div>
    ${c.tries > 1 && !c.steal ? `<p class="note">✌️ معكم محاولتين بهالسؤال</p>` : ""}
    ${!c.steal ? `<div class="helps">${HELPS.map((h) => `<button type="button" data-h="${h.k}" ${mine && t.help[h.k] ? "" : "disabled"}><span>${h.icon}</span>${h.name}</button>`).join("")}</div>` : ""}
    ${!mine && !buzzing ? `<p class="note">«${esc(t.name)}» عم يجاوبوا...</p>` : mode === "local" && !buzzing ? `<p class="turn t${c.team}">دور «${esc(t.name)}» يجاوب</p>` : ""}`);
  if (mine) {
    document.querySelectorAll(".opt:not([disabled])").forEach((b) => b.onclick = () => { document.querySelectorAll(".opt").forEach((x) => x.disabled = true); send({ t: "ans", k: +b.dataset.k, team: c.team }); });
    document.querySelectorAll("[data-h]:not([disabled])").forEach((b) => b.onclick = () => {
      if (b.dataset.h === "swap" && !confirm("بدكم سؤال ثاني بداله؟ (مرة وحدة باللعبة)")) return;
      send({ t: "help", h: b.dataset.h, team: c.team });
    });
  }
  document.querySelectorAll("[data-card]").forEach((b) => b.onclick = () => { document.querySelectorAll("[data-card]").forEach((x) => x.disabled = true); send({ t: "card", team: +b.dataset.card }); });
  bind({ nosteal: () => send(mode === "local" ? { t: "decline", all: true } : { t: "decline", team: myT }) });
  const total = buzzing ? OFFER_MS : c.steal ? STEAL_MS : Q_MS(c.d);
  let lastBeep = -1;
  const tick = () => {
    const ms = Math.max(0, c.deadline - now()), s = Math.ceil(ms / 1000);
    const bar = $("bar"), sec = $("secs");
    if (!bar) return clearInterval(ticker);
    bar.style.width = Math.min(100, (ms / total) * 100) + "%";
    sec.textContent = s;
    const hot = s <= 5; $("clock").classList.toggle("hot", hot); sec.classList.toggle("hot", hot);
    if (hot && s > 0 && s !== lastBeep && (mine || iCanBuzz)) { lastBeep = s; tone(660, 0, 0.07, "square", 0.05); }
  };
  tick(); ticker = setInterval(tick, 200);
}

function drawRes() {
  if (SND && S.cur && !(S.cur.img || "").startsWith("audio:")) { try { SND.pause(); } catch {} }
  const r = S.res, c = S.cur;
  const w = r.winner !== null ? S.teams[r.winner] : null;
  const mineWin = w && (mode === "local" || r.winner === myTeam());
  const head = w
    ? `<div class="verdict good t${r.winner}"><div><b>${mode === "local" ? `«${esc(w.name)}» جابوها` : mineWin ? "صح عليكم!" : `«${esc(w.name)}» جابوها`}</b><small>${r.steal ? "سرقة ناجحة بالكرت 🦊" : r.dbl ? "سؤال دبل 🔥" : "جواب صح"}</small></div><span class="plus">+${r.pts}</span></div>`
    : r.thief !== null && r.thief !== undefined
    ? `<div class="verdict none t${r.thief}"><div><b>«${esc(S.teams[r.thief].name)}» سرقوا وغلطوا</b><small>راح عليهم نص نقاط السؤال 🦊</small></div><span class="plus" style="color:#FF8A80">−${r.minus}</span></div>`
    : `<div class="verdict none"><div><b>ولا فريق جابها</b><small>${r.dbl ? "راح السؤال الدبل بلاش 🔥" : "الجواب الصح باللون الأخضر"}</small></div></div>`;
  render(`${scoreBar(r.winner === null ? -1 : r.winner)}
    ${qHead(c, false)}
    ${head}
    ${qImage(c)}
    <div class="qtext">${esc(c.text)}</div>
    ${optsHtml(c, false, true)}
    <button class="autonext" id="next" type="button"><i id="nbar"></i><span>${S.cats.some((cid) => S.board[cid].some((x) => x.w === null)) ? "راجعين للوحة..." : "النتيجة النهائية..."} (اكبس للتسريع)</span></button>`);
  bind({ next: () => send({ t: "next" }) });
  const tick = () => {
    const el = $("nbar"); if (!el) return clearInterval(ticker);
    el.style.width = Math.min(100, (1 - Math.max(0, r.until - now()) / NEXT_MS) * 100) + "%";
  };
  tick(); ticker = setInterval(tick, 100);
}

function drawOver() {
  const order = S.teams.map((_, i) => i).sort((x, y) => S.teams[y].score - S.teams[x].score);
  const top = S.teams[order[0]].score;
  const winners = order.filter((i) => S.teams[i].score === top);
  const tie = winners.length > 1;
  const max = Math.max(1, top);
  // المنصة: الأول بالنص، الثاني يمين، الثالث شمال
  const podOrder = order.length >= 3 ? [order[1], order[0], ...order.slice(2)] : [order[1], order[0]];
  const rank = (i) => order.indexOf(i);
  render(`<h1 class="center">${tie ? "تعادل! 🤝" : `فاز «${esc(S.teams[order[0]].name)}» 🏆`}</h1>
    <p class="sub center">${tie ? `${winners.map((i) => `«${esc(S.teams[i].name)}»`).join(" و")} بنفس النقاط` : `بفرق ${top - S.teams[order[1]].score} نقطة عن اللي بعده`}</p>
    <div class="podium ${nT() >= 5 ? "n4 n5" : nT() >= 4 ? "n4" : ""}">${podOrder.map((i) => { const t = S.teams[i], k = rank(i);
      return `<div class="col t${i}"><span class="medal">${["🥇", "🥈", "🥉"][k] || `<span style="font-family:var(--display);font-size:22px;color:var(--dim)">${k + 1}</span>`}</span><b>${esc(t.name)}</b><div class="blk" style="height:${70 + Math.round((Math.max(0, t.score) / max) * 110)}px">${t.score}</div></div>`; }).join("")}</div>
    ${mode === "local" || S.host === me.id ? `<button class="btn" id="again" type="button">لعبة جديدة بأقسام جديدة</button>` : `<p class="note">صاحب الغرفة بيقدر يبدأ لعبة جديدة.</p>`}
    <button class="btn alt" id="out" type="button">خروج</button>`);
  bind({ again: () => { picked = []; send({ t: "again", team: 0 }); }, out: () => { store.set("local", null); leave(); } });
}

// ---------- البداية ----------
function intro() {
  const local = store.get("local", null);
  render(`<h1>مين بيجمع نقاط أكثر؟</h1>
    <p class="sub">من فريقين لـ5 فرق، لوحة أسئلة من السهل للصعب جداً، وسؤال دبل مخفي.</p>
    <div class="panel"><ul class="rules">
      <li>بالدور، كل فريق بيختار سؤال من اللوحة: <b>100</b> سهل، <b>200</b> متوسط، <b>300</b> صعب، <b>500</b> صعب جداً.</li>
      <li>4 خيارات و<b>30 ثانية</b> لكل سؤال (الصعب جداً 40).</li>
      <li>كل فريق معه <b>3 كروت سرقة</b> 🦊 إذا فريق غلط، الباقي بيقدروا يستخدموا كرت والأسرع بياخذها: الصح <b>بكامل النقاط</b>، والغلط <b>بينخصم نصّها</b>.</li>
      <li>واحد من الأسئلة <b>دبل</b> 🔥 نقاطه ضعف.</li>
      <li>كل فريق معه مرة وحدة: ✂️ حذف ثنتين، ✌️ محاولتين، 🔄 سؤال ثاني.</li>
    </ul></div>
    <input class="input" id="tname" type="text" maxlength="16" placeholder="اسم فريقك" value="${esc(me.name)}" autocomplete="off">
    <button class="btn" id="create" type="button">اعملوا غرفة</button>
    <div class="seg" style="gap:8px"><input class="input" id="code" type="text" inputmode="numeric" maxlength="5" placeholder="كود الغرفة" value="${esc(qs.get("room") || "")}" autocomplete="off" style="flex:1.4;letter-spacing:4px;text-align:center;font-size:20px">
      <button type="button" id="join" style="flex:1;background:var(--on);color:var(--ink);border-color:var(--on)">ادخلوا</button></div>
    <p class="err" id="err" hidden></p>
    ${local && local.S && local.S.phase !== "over" && local.S.phase !== "cats" ? `<button class="btn alt" id="resume" type="button">كمّلوا اللعبة اللي على هالتلفون</button>` : ""}
    <button class="btn alt" id="one" type="button">كل الفرق على تلفون واحد</button>`);
  const getName = () => {
    const n = $("tname").value.trim();
    if (!n) { $("err").hidden = false; $("err").textContent = "اكتبوا اسم فريقكم أول."; $("tname").focus(); return null; }
    me.name = n; store.set("team", n); return n;
  };
  bind({
    create: () => { if (getName()) hostRoom(); },
    join: () => {
      if (!getName()) return;
      const code = $("code").value.replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "");
      if (code.length !== 5) { $("err").hidden = false; $("err").textContent = "الكود 5 أرقام."; return; }
      joinRoom(code);
    },
    one: () => { store.set("local", null); localGame(); },
    resume: () => localGame(store.get("local", null)),
  });
}
function boot() {
  const saved = store.get("online", null);
  if (qs.get("room")) return false;
  if (saved && saved.room && Date.now() - (saved.at || 0) < 6 * 3600e3) {
    render(`<h1>في لعبة مفتوحة</h1><p class="sub">الغرفة ${esc(saved.room)}${saved.host ? " (إنتو صاحبينها)" : ""}.</p>
      <button class="btn" id="re" type="button">ارجعوا للعبة</button><button class="btn alt" id="no" type="button">لا، طلّعني</button>`);
    bind({ re: () => (saved.host ? hostRoom(saved.room, store.get("host-" + saved.room, null)) : joinRoom(saved.room)), no: () => { store.set("online", null); intro(); } });
    return true;
  }
  return false;
}

$("quit").onclick = () => { location.href = "./"; };
fetch("points_q.json?t=" + Math.floor(Date.now() / 3.6e6)).then((r) => r.json()).then((d) => {
  DATA = d; CAT = new Map(d.cats.map((c) => [c.id, c]));
  if (!d.cats.length) { $("app").innerHTML = `<div class="loading">الأسئلة لسا بتتجهز. جرّبوا كمان شوي.</div>`; return; }
  if (boot()) return;
  intro();
}).catch(() => { $("app").innerHTML = `<div class="loading">ما قدرت أحمّل الأسئلة. تأكدوا من الإنترنت.</div>`; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});
</script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
</body>
</html>
