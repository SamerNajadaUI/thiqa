<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>أين الكرة</title>
<meta name="theme-color" content="#FFF6E3">
<script src="../theme.js"></script>
<script src="../app/firebase-config.js"></script>
<script src="../app/core.js"></script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shell.css">
<link rel="stylesheet" href="mini.css">
<link rel="stylesheet" href="kora.css">
</head>
<body>
<div class="wrap">
  <header class="gbar" data-game="ball"></header>
  <main id="app"></main>
</div>
<script src="../shell.js"></script>
<script src="mini.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="kora.js"></script>
<script>
"use strict";
// الكرة اختفت بعد المررة. خط التمريرة بيبين اتجاهها، وإنت بتختار أي نقطة (1-4) هي مكانها.
const W = 300, H = 380;
const rr = (a, b) => a + Math.random() * (b - a);
function puzzle(lvl) { // lvl من 0 (سهل) لـ 1 (صعب)
  const len = rr(100, 150) - lvl * 30, dist = 64 - lvl * 32;
  let P, E, t = 0;
  do { P = { x: rr(40, W - 40), y: rr(60, H - 60) }; const a = rr(0, Math.PI * 2); E = { x: P.x + Math.cos(a) * len, y: P.y + Math.sin(a) * len }; }
  while ((E.x < 30 || E.x > W - 30 || E.y < 35 || E.y > H - 35) && ++t < 300);
  const spots = [E]; t = 0;
  while (spots.length < 4 && t++ < 600) {
    const a = rr(0, Math.PI * 2), d = rr(dist * 0.8, dist * 1.5), c = { x: E.x + Math.cos(a) * d, y: E.y + Math.sin(a) * d };
    if (c.x < 25 || c.x > W - 25 || c.y < 25 || c.y > H - 25) continue;
    if (spots.every((s) => Math.hypot(s.x - c.x, s.y - c.y) > 34)) spots.push(c);
  }
  while (spots.length < 4) spots.push({ x: rr(30, W - 30), y: rr(30, H - 30) });
  const lab = shuffle([1, 2, 3, 4]); // lab[i] رقم النقطة spots[i]
  const dots = Array.from({ length: 6 + Math.round(lvl * 4) }, (_, i) => `<circle cx="${rr(20, W - 20).toFixed(0)}" cy="${rr(20, H - 20).toFixed(0)}" r="9" fill="${i % 2 ? "#2E6BFF" : "#FF5638"}" stroke="#16113A" stroke-width="2.5"/>`).join("");
  const shown = lvl > 0.5 ? 0.6 : 0.8, lx = P.x + (E.x - P.x) * shown, ly = P.y + (E.y - P.y) * shown;
  const field = `<rect width="${W}" height="${H}" fill="#1E8F5A"/>${[0, 1, 2, 3, 4].map((i) => `<rect y="${i * 76}" width="${W}" height="38" fill="#23A068" opacity=".55"/>`).join("")}
    <g fill="none" stroke="#FFF6E3" stroke-width="2" opacity=".85"><rect x="8" y="8" width="${W - 16}" height="${H - 16}" rx="3"/><line x1="8" y1="${H / 2}" x2="${W - 8}" y2="${H / 2}"/><circle cx="${W / 2}" cy="${H / 2}" r="34"/></g>${dots}
    <circle cx="${P.x}" cy="${P.y}" r="11" fill="#FFC533" stroke="#16113A" stroke-width="3"/>`;
  const spotsSVG = (rev) => spots.map((s, i) => `<g transform="translate(${s.x.toFixed(1)},${s.y.toFixed(1)})"><circle r="15" fill="${rev && i === 0 ? "#1FCF9A" : "#FFF6E3"}" stroke="#16113A" stroke-width="3"/><text text-anchor="middle" dominant-baseline="central" font-family="Readex Pro" font-weight="700" font-size="15" fill="#16113A">${lab[i]}</text></g>`).join("");
  const line = (x2, y2) => `<line x1="${P.x}" y1="${P.y}" x2="${x2}" y2="${y2}" stroke="#FFF6E3" stroke-width="3.5" stroke-dasharray="3 8" stroke-linecap="round"/>`;
  const svg = (inner) => `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ملعب فيه مررة والكرة مخفية">${inner}</svg>`;
  return {
    d: 1 + Math.round(lvl * 3), q: "وين الكرة؟", opts: ["1", "2", "3", "4"], fixed: true, c: lab[0] - 1,
    vis: svg(field + line(lx, ly) + spotsSVG(false)),
    rev: svg(field + line(E.x, E.y) + spotsSVG(true) + `<circle cx="${E.x}" cy="${E.y}" r="8" fill="#FFF6E3" stroke="#16113A" stroke-width="3"/>`),
  };
}
KORA({ id: "ball", title: "أين الكرة", desc: "المررة طارت والكرة اختفت! اتبع خط التمريرة واختار رقم النقطة اللي فيها الكرة. كل سؤال أصعب من اللي قبله.", secs: 12,
  load: async () => Array.from({ length: 40 }, (_, i) => puzzle((i % 20) / 19)) });
</script>
</body>
</html>
