<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>تسريحة لاعب</title>
<meta name="theme-color" content="#FFF6E3">
<script src="../theme.js"></script>
<script src="../app/firebase-config.js"></script>
<script src="../app/core.js"></script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shell.css">
<link rel="stylesheet" href="mini.css">
<link rel="stylesheet" href="kora.css">
</head>
<body>
<div class="wrap">
  <header class="gbar" data-game="khair"></header>
  <main id="app"></main>
</div>
<script src="../shell.js"></script>
<script src="mini.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="kora.js"></script>
<script>
"use strict";
// القصّة محسوبة مسبقاً (engine/hair_build.py بكشف الوجه): من فوق الراس لحد فوق الحواجب، فبيبين الشعر بس.
function hairBox(src, [x, y, w, h, ar]) {
  return `<div class="hair" style="aspect-ratio:${(w * ar / h).toFixed(3)}"><img src="${esc(src)}" alt="" style="width:${(100 / w).toFixed(2)}%;left:${(-x / w * 100).toFixed(2)}%;top:${(-y / h * 100).toFixed(2)}%" onerror="this.closest('.kvis').classList.add('nopic')"></div>`;
}
KORA({ id: "khair", title: "تسريحة لاعب", desc: "بتشوف شعر اللاعب بس، بدون وجهه. اعرف مين هو قبل ما تخلص الثواني.",
  load: async () => {
    const [all, hr] = await Promise.all([koraPlayers(), fetch("hair.json?t=" + Math.floor(Date.now() / 3.6e6)).then((r) => { if (!r.ok) throw 0; return r.json(); })]);
    const ok = all.filter((p) => p.lv <= 2 && p.img && hr.c[p.id]);
    const pool = all.filter((x) => x.lv <= 2);
    return shuffle(ok).slice(0, 160).map((p) => ({ d: p.lv * 2 - 1, q: "مين صاحب هالتسريحة؟", opts: [p.a, ...koraDecoys(p, pool)],
      vis: hairBox(p.img, hr.c[p.id]),
      rev: `<div class="full"><img src="${esc(p.img)}" alt=""></div>` })).filter((q) => q.opts.length === 4);
  } });
</script>
</body>
</html>
