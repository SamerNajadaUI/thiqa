<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>تسريحة لاعب</title>
<meta name="theme-color" content="#FFF6E3">
<script src="../theme.js"></script>
<script src="../app/firebase-config.js"></script>
<script src="../app/core.js"></script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shell.css">
<link rel="stylesheet" href="mini.css">
<link rel="stylesheet" href="kora.css">
</head>
<body>
<div class="wrap">
  <header class="gbar" data-game="khair"></header>
  <main id="app"></main>
</div>
<script src="../shell.js"></script>
<script src="mini.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="kora.js"></script>
<script>
"use strict";
KORA({ id: "khair", title: "تسريحة لاعب", desc: "بتشوف بس فوق راس اللاعب: التسريحة. اعرف مين هو قبل ما تخلص الثواني.",
  load: async () => {
    const all = await koraPlayers();
    const ok = all.filter((p) => p.lv <= 2 && p.img);
    return shuffle(ok).slice(0, 160).map((p) => ({ d: p.lv * 2 - 1, q: "مين صاحب هالتسريحة؟", opts: [p.a, ...koraDecoys(p, all.filter((x) => x.lv <= 2))],
      vis: `<div class="crop"><img src="${esc(p.img)}" alt="" onerror="this.closest('.kvis').classList.add('nopic')"></div>`,
      rev: `<div class="full"><img src="${esc(p.img)}" alt=""></div>` })).filter((q) => q.opts.length === 4);
  } });
</script>
</body>
</html>
