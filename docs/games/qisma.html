<!doctype html>
<html lang="ar" dir="rtl">
<head>

<style>
/* قسمة ونصيب: ألوان التطبيق (فاتح/غامق من shell.css) + لون لكل حصة. */
:root {
  --font: "Readex Pro", "Segoe UI", Tahoma, sans-serif; --display: "Lalezar", "Readex Pro", sans-serif;
  --b0: #6E4BFF; --b1: #FF7A1A; --b2: #12B76A; --b3: #0BA5EC; --b4: #EE46BC;
  --num: #1D2939; --bomb: #F04438; --dbl: #7A5AF8; --gem: #06AED4; --fox: #F38744;
}
:root[data-theme="dark"] { --num: #E6E8EE; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
html, body, button, input { touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
#app { display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8.5vw, 40px); line-height: 1.15; margin: 0; }
h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 2px 0 0; line-height: 1.2; }
.sub { color: var(--muted); margin: 0; font-size: 14px; }
.center { text-align: center; }
.note { color: var(--muted); font-size: 13px; margin: 0; text-align: center; }
.err { color: var(--bomb); font-size: 13px; margin: 0; text-align: center; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); }
.btn { border: 0; width: 100%; border-radius: 18px; padding: 15px; font-family: var(--display); font-size: 22px; line-height: 1.1; background: var(--brand); color: #FFF; box-shadow: 0 8px 20px -8px var(--brand); transition: transform .12s; }
.btn:active { transform: scale(.97); }
.btn.alt { background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.btn.gold { background: linear-gradient(135deg, #FFC23D, #F08A0C); box-shadow: 0 8px 20px -8px #F08A0C; }
.btn[disabled] { opacity: .45; transform: none; }
.linkish { border: 0; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; align-self: center; padding: 6px; }
.row { display: flex; gap: 8px; align-items: center; }
.input { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 16px; font-family: var(--font); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 16px; background: var(--soft); border: 1px solid var(--line); }
.seg button { border: 0; background: none; border-radius: 12px; padding: 9px 4px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }
.label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 -6px; }

/* شريط اللعبة */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; }
.top .logo { font-family: var(--display); font-size: 25px; color: var(--ink); text-decoration: none; line-height: 1; }
.top .logo span { color: var(--b1); }
.top .end { display: flex; gap: 8px; align-items: center; }
.ghost { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--muted); }

/* النقاط */
.scores { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.scores::-webkit-scrollbar { display: none; }
.pod { flex: 1 0 auto; min-width: 84px; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); position: relative; }
.pod.turn { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
.pod .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #FFF; font-weight: 700; font-size: 13px; flex: none; background: hsl(var(--h) 60% 50%); }
.pod b { display: block; font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1; direction: ltr; text-align: right; }
.pod small { display: block; font-size: 11px; color: var(--muted); max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pod .crown { position: absolute; top: -9px; left: 6px; font-size: 15px; }
.pod .delta { position: absolute; top: -10px; right: 8px; font-size: 12px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: var(--b2); color: #FFF; animation: up 1.6s ease-out both; }
.pod .delta.neg { background: var(--bomb); }
@keyframes up { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
.roundbar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 600; }
.roundbar .hot { color: #F08A0C; }

/* الورق */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.card { --bc: var(--line); position: relative; aspect-ratio: 1 / 1.05; border-radius: 16px; border: 2px solid var(--bc); background: var(--card); box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px; transition: transform .15s, border-color .15s; user-select: none; -webkit-user-select: none; }
.card .v { font-family: var(--display); font-size: clamp(28px, 8.5vw, 40px); line-height: 1; direction: ltr; }
.card .t { font-size: 11px; color: var(--muted); font-weight: 600; text-align: center; line-height: 1.3; }
.card.k-n .v { color: var(--num); } .card.k-b .v { color: var(--bomb); } .card.k-x .v { color: var(--dbl); } .card.k-g .v { color: var(--gem); } .card.k-f .v { color: var(--fox); }
.card.back { background: repeating-linear-gradient(45deg, var(--soft) 0 8px, var(--soft2) 8px 16px); }
.card.back .v { color: var(--faint); }
.card .tag { position: absolute; top: 6px; right: 6px; min-width: 22px; height: 22px; border-radius: 8px; display: grid; place-items: center; color: #FFF; font-weight: 800; font-size: 12px; background: var(--bc); }
.card .eye { position: absolute; bottom: 5px; left: 5px; width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); display: grid; place-items: center; font-size: 15px; padding: 0; filter: grayscale(1); opacity: .65; }
.card .eye[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); filter: none; opacity: 1; }
.card.shown::after { content: "👁"; position: absolute; top: 6px; left: 7px; font-size: 12px; }
.card.peek { box-shadow: 0 0 0 3px var(--gem); }
.card.mini { aspect-ratio: 3 / 4; border-radius: 12px; padding: 3px; }
.card.mini .v { font-size: clamp(20px, 6vw, 28px); }
.card.mini .t { font-size: 9.5px; }
.b0 { --bc: var(--b0); } .b1 { --bc: var(--b1); } .b2 { --bc: var(--b2); } .b3 { --bc: var(--b3); } .b4 { --bc: var(--b4); }
@media (prefers-reduced-motion: no-preference) { .card.flip { animation: flip .45s cubic-bezier(.2,.9,.3,1.2) both; } @keyframes flip { from { transform: rotateY(90deg); } } }

/* الحصص */
.bundles { display: flex; flex-direction: column; gap: 10px; }
.bundle { --bc: var(--b0); text-align: right; width: 100%; border: 2px solid color-mix(in srgb, var(--bc) 35%, var(--line)); background: var(--card); border-radius: 20px; padding: 10px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 8px; }
.bundle.sel { border-color: var(--bc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bc) 30%, transparent), var(--shadow); }
.bundle[disabled] { opacity: .55; }
.bundle .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bundle .name { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.bundle .name i { font-style: normal; width: 24px; height: 24px; border-radius: 8px; background: var(--bc); color: #FFF; display: grid; place-items: center; font-size: 13px; }
.bundle .info { font-size: 12px; color: var(--muted); font-weight: 600; }
.bundle .row-cards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.bundle .owner { font-size: 13px; font-weight: 700; color: var(--bc); }
.bundle .total { font-family: var(--display); font-size: 26px; line-height: 1; direction: ltr; color: var(--bc); }
.sumchips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.sumchips span { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: #FFF; background: var(--bc); }
.sumchips span.empty { background: var(--soft); color: var(--muted); }

.banner { border-radius: 22px; padding: 14px 16px; text-align: center; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
.banner b { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.2; }
.banner.gold { background: linear-gradient(135deg, color-mix(in srgb, #FFC23D 22%, var(--card)), var(--card)); border-color: color-mix(in srgb, #F08A0C 40%, var(--line)); }
.pass { text-align: center; border-radius: 26px; padding: 30px 18px; background: var(--card); border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.pass b { font-family: var(--display); font-weight: 400; font-size: 40px; color: var(--brand); line-height: 1.15; }
.thinking { display: flex; gap: 6px; justify-content: center; padding: 6px; }
.thinking i { width: 9px; height: 9px; border-radius: 50%; background: var(--brand); animation: dot 1s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-6px); opacity: .5; } }
.legend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.legend .card { aspect-ratio: auto; padding: 8px 4px; }
.legend .card .v { font-size: 24px; }
.rules { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 7px; font-size: 14px; color: var(--muted); }
.rules b { color: var(--ink); }
.plist { display: flex; flex-direction: column; gap: 8px; }
.plist .item { display: flex; gap: 8px; align-items: center; }
.plist .item .input { flex: 1; }
.plist .bot { flex: none; width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 20px; }
.plist .bot[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); }
.final { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.final li { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.final li:first-child { border-color: #F5B13D; background: linear-gradient(135deg, color-mix(in srgb, #FFC23D 20%, var(--card)), var(--card)); }
.final li b { font-family: var(--display); font-weight: 400; font-size: 24px; margin-inline-start: auto; direction: ltr; }
.final .medal { font-size: 22px; width: 28px; text-align: center; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stats div { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; text-align: center; }
.stats small { display: block; color: var(--muted); font-size: 11.5px; }
.stats b { display: block; font-weight: 700; font-size: 14px; }
.code { font-family: var(--display); font-size: 52px; letter-spacing: 8px; direction: ltr; text-align: center; color: var(--brand); line-height: 1.1; }
.loading { text-align: center; color: var(--muted); padding: 48px 0; }
@media (max-width: 360px) { .cards { gap: 7px; } .legend { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<body>
<div class="wrap">
  <header class="gbar" data-game="qisma"></header>
  <main id="app"><div class="loading">...</div></main>
</div>
<script src="../shell.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k, d) { try { const v = localStorage.getItem("qisma-" + k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem("qisma-" + k, JSON.stringify(v)); } catch {} } };
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function render(html) { $("app").innerHTML = html; }
function bind(map) { for (const [id, fn] of Object.entries(map)) { const el = $(id); if (el) el.onclick = fn; } }

// ================= القوانين =================
// الورق: أرقام 1–8، قنبلة −4، دبل (بيضاعف حصته)، جوهرة +10، ثعلب (بيسرق 5 من المتصدّر).
const KIND = {
  n: { t: "رقم" },
  b: { t: "قنبلة", show: "💣", sub: "−4" },
  x: { t: "دبل الحصة", show: "×2" },
  g: { t: "جوهرة", show: "💎", sub: "+10" },
  f: { t: "ثعلب", show: "🦊", sub: "بيسرق 5" },
};
const RULES = { bomb: -4, gem: 10, fox: 5, foxSelf: 2, peeks: 2, finalMult: 2 };
const BUNDLE = ["أ", "ب", "ج", "د", "هـ"];
function makeDeck(copies) {
  const one = [];
  for (let v = 1; v <= 8; v++) one.push({ k: "n", v }, { k: "n", v });
  for (let i = 0; i < 4; i++) one.push({ k: "b", v: RULES.bomb });
  one.push({ k: "x", v: 0 }, { k: "x", v: 0 }, { k: "g", v: RULES.gem }, { k: "f", v: 0 }, { k: "f", v: 0 });
  const out = [];
  for (let c = 0; c < copies; c++) out.push(...one.map((x) => ({ ...x })));
  return out;
}
const roundsFor = (n) => ({ 2: 8, 3: 9, 4: 8, 5: 10 }[n]);
const cardsFor = (n) => n * 3;
// قيمة الحصة: مجموع الأرقام والقنابل والجواهر، مضروب ×2 لكل ورقة دبل (أقصى إشي ×4)، والثعالب لحال
function bundleValue(cards) {
  const base = cards.reduce((s, c) => s + (c.k === "n" || c.k === "b" || c.k === "g" ? c.v : 0), 0);
  const dbl = cards.filter((c) => c.k === "x").length;
  return { base: base * Math.min(4, 2 ** dbl), fox: cards.filter((c) => c.k === "f").length, dbl };
}

// ================= المحرك =================
// G فيها كل إشي (عند صاحب الغرفة أو التلفون)، وكل لاعب بيشوف «view» فيها بس اللي مسموحله يشوفه.
let G = null;
function newGame(players, cfg = {}) {
  const n = players.length;
  G = {
    v: 0, phase: "split", round: 0, rounds: roundsFor(n), n,
    players: players.map((p) => ({ id: p.id, name: p.name, bot: p.bot || null, score: 0, peeks: RULES.peeks, stats: { gain: 0, best: 0, fooled: 0 } })),
    first: Math.floor(Math.random() * n), cfg, log: [],
  };
  startRound();
  return G;
}
const P = (id) => G.players.find((p) => p.id === id);
const idx = (id) => G.players.findIndex((p) => p.id === id);
const isFinal = () => G.round === G.rounds - 1;
function leaderExcept(id) {
  const others = G.players.filter((p) => p.id !== id);
  const top = Math.max(...others.map((p) => p.score));
  return others.filter((p) => p.score === top);
}
function startRound() {
  const n = G.n;
  // الجولة الأخيرة: المتأخر (أقل نقاط) هو اللي بيقسم، والنقاط دبل
  let d = (G.first + G.round) % n;
  if (isFinal()) { const low = Math.min(...G.players.map((p) => p.score)); const lows = G.players.map((p, i) => [p, i]).filter(([p]) => p.score === low); d = lows[Math.floor(Math.random() * lows.length)][1]; }
  const deck = shuffle(makeDeck(n >= 4 ? 2 : 1));
  G.cards = deck.slice(0, cardsFor(n)).map((c, i) => ({ ...c, id: i }));
  G.divider = G.players[d].id;
  G.order = Array.from({ length: n - 1 }, (_, k) => G.players[(d + 1 + k) % n].id);
  G.assign = null; G.shown = []; G.turn = 0; G.owner = {}; G.peeked = {}; G.res = null;
  G.mult = isFinal() ? RULES.finalMult : 1;
  G.phase = "split";
}
function validSplit(assign, shown) {
  const n = G.n;
  if (!Array.isArray(assign) || assign.length !== G.cards.length || !assign.every((b) => Number.isInteger(b) && b >= 0 && b < n)) return "في ورقة بدون حصة";
  for (let b = 0; b < n; b++) if (!assign.includes(b)) return `حصة ${BUNDLE[b]} فاضية`;
  if (!Array.isArray(shown) || new Set(shown).size !== n || !shown.every((i) => i >= 0 && i < G.cards.length)) return `لازم تكشف ${n} ورقات بالضبط`;
  return null;
}
function doSplit(pid, assign, shown) {
  if (G.phase !== "split" || pid !== G.divider || validSplit(assign, shown)) return false;
  G.assign = assign.slice(); G.shown = shown.slice(); G.phase = "choose";
  return true;
}
const chooser = () => G.order[G.turn];
function doPeek(pid, card) {
  const p = P(pid);
  if (G.phase !== "choose" || pid !== chooser() || !p || p.peeks <= 0) return false;
  if (G.shown.includes(card) || !(card >= 0 && card < G.cards.length) || (G.peeked[pid] || []).includes(card)) return false;
  const b = G.assign[card]; if (G.owner[b] !== undefined) return false;
  p.peeks--; (G.peeked[pid] ||= []).push(card);
  return true;
}
function doPick(pid, b) {
  if (G.phase !== "choose" || pid !== chooser() || !(b >= 0 && b < G.n) || G.owner[b] !== undefined) return false;
  G.owner[b] = pid; G.turn++;
  if (G.turn >= G.order.length) { const rest = [...Array(G.n).keys()].find((k) => G.owner[k] === undefined); G.owner[rest] = G.divider; resolve(); }
  return true;
}
function resolve() {
  const before = Object.fromEntries(G.players.map((p) => [p.id, p.score]));
  const bundles = [];
  for (let b = 0; b < G.n; b++) {
    const cards = G.cards.filter((c) => G.assign[c.id] === b);
    const val = bundleValue(cards), pid = G.owner[b];
    P(pid).score += val.base * G.mult;
    bundles.push({ b, pid, val: val.base * G.mult, fox: val.fox, dbl: val.dbl });
  }
  const fx = [];
  for (const x of bundles) for (let k = 0; k < x.fox; k++) {
    const lead = leaderExcept(x.pid);
    const me = P(x.pid);
    if (lead[0].score > me.score) { const t = lead[Math.floor(Math.random() * lead.length)]; t.score -= RULES.fox; me.score += RULES.fox; fx.push([x.pid, t.id]); }
    else { me.score += RULES.foxSelf; fx.push([x.pid, null]); }
  }
  // إحصائيات للنهاية: كم ربح القاسم أكثر من غيره، وأحسن حصة
  const dv = bundles.find((x) => x.pid === G.divider).val;
  const others = bundles.filter((x) => x.pid !== G.divider).map((x) => x.val);
  const edge = dv - Math.max(...others);
  const D = P(G.divider).stats; D.gain += Math.max(0, edge); if (edge > D.fooled) D.fooled = edge;
  for (const x of bundles) { const s = P(x.pid).stats; if (x.val > s.best) s.best = x.val; }
  const delta = Object.fromEntries(G.players.map((p) => [p.id, p.score - before[p.id]]));
  G.res = { bundles, fx, delta, edge };
  G.log.push({ round: G.round + 1, divider: G.divider, delta });
  G.phase = "reveal";
}
function doNext() {
  if (G.phase !== "reveal") return false;
  G.round++;

    for (let b = 0; b < n; b++) if (!assign.includes(b)) assign[Math.floor(Math.random() * m)] = b;

}

// ================= الاتصال (كل واحد من تلفونه) =================
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt", "wss://test.mosquitto.org:8081/mqtt"];
const qs = new URLSearchParams(location.search), ROOT = "abuodeh-qisma-v1";
let client = null, room = null, LOBBY = null;
const topic = (k) => `${ROOT}/${room}/${k}`;
function send(a) {
  a.pid = mode === "local" ? viewerId() : mode === "solo" ? G.players.find((p) => !p.bot).id : me.id;
  if (mode === "guest") { client?.publish(topic("a"), JSON.stringify(a), { qos: 1 }); return; }
  act(a);
}
function publishAll() {
  if (!client) return;
  if (!G) { client.publish(topic("lobby"), JSON.stringify(LOBBY), { qos: 1, retain: true }); return; }
  client.publish(topic("lobby"), JSON.stringify({ ...LOBBY, started: true }), { qos: 1, retain: true });
  for (const p of G.players) if (p.id !== me.id) client.publish(topic("v/" + p.id), JSON.stringify(viewFor(p.id)), { qos: 1, retain: true });
}
function connect(onReady, k = 0) {
  if (typeof mqtt === "undefined") return fail("ما قدرت أحمّل الاتصال. تأكد من النت.");
  const url = qs.get("broker") || BROKERS[k % BROKERS.length];
  let ready = false;
  const c = mqtt.connect(url, { clientId: "qs_" + me.id + "_" + Math.random().toString(36).slice(2, 6), reconnectPeriod: 2000, connectTimeout: 8000, clean: true });
  const giveUp = setTimeout(() => { if (ready) return; c.end(true); if (k + 1 < BROKERS.length && !qs.get("broker")) connect(onReady, k + 1); else fail("ما قدرت أتصل. جرّب كمان شوي."); }, 9000);
  c.on("connect", () => { if (!ready) { ready = true; clearTimeout(giveUp); client = c; onReady(); } else if (mode === "host") publishAll(); else if (mode === "guest") c.publish(topic("a"), JSON.stringify({ t: "join", pid: me.id, name: me.name }), { qos: 1 }); });
  c.on("message", (t, buf) => {
    let m; try { m = JSON.parse(buf.toString()); } catch { return; }
    if (mode === "host" && t === topic("a")) {
      if (m.t === "join") return hostJoin(m);
      return act(m);
    }
    if (mode === "guest" && t === topic("lobby")) { LOBBY = m; if (!m.started) drawLobby(); }
    if (mode === "guest" && t === topic("v/" + me.id)) { if (m.v <= lastV && VIEW && m.round === VIEW.round) return; lastV = m.v; VIEW = m; G = m; show(); }
  });
}
function hostJoin(m) {
  if (G) { if (G.players.some((p) => p.id === m.pid)) publishAll(); return; }
  if (!LOBBY.players.some((p) => p.id === m.pid) && LOBBY.players.length < 5) LOBBY.players.push({ id: m.pid, name: String(m.name || "لاعب").slice(0, 14) });
  publishAll(); drawLobby();
}
function hostRoom() {
  mode = "host"; room = String(Math.floor(10000 + Math.random() * 90000));
  LOBBY = { room, host: me.id, players: [{ id: me.id, name: me.name }] };
  render(`<div class="loading">عم بفتح الغرفة...</div>`);
  connect(() => { client.subscribe([topic("a")], { qos: 1 }); publishAll(); drawLobby(); });
}
function joinRoom(code) {
  mode = "guest"; room = code;
  render(`<div class="loading">عم بدخل الغرفة...</div>`);
  connect(() => {
    client.subscribe([topic("lobby"), topic("v/" + me.id)], { qos: 1 });
    client.publish(topic("a"), JSON.stringify({ t: "join", pid: me.id, name: me.name }), { qos: 1 });
    setTimeout(() => { if (!LOBBY) { render(`<h1>ما في رد من الغرفة ${esc(room)}</h1><p class="sub">تأكد من الكود، وإن تلفون صاحب الغرفة مفتوح.</p><button class="btn alt" id="back" type="button">رجوع</button>`); bind({ back: leave }); } }, 7000);
  });
}
function drawLobby() {
  if (G && mode === "host") return;
  const isHost = mode === "host", L = LOBBY, link = location.origin + location.pathname + "?room=" + room;
  render(`<p class="sub center">كود الغرفة</p><div class="code">${esc(room)}</div>
    ${isHost ? `<button class="btn alt" id="share" type="button">ابعت الرابط لأصحابك</button>` : ""}
    <h2>اللاعبين (${L.players.length} من 5)</h2>
    <ol class="final">${L.players.map((p) => `<li>${avatar({ name: p.name })}<span>${esc(p.name)}${p.id === L.host ? " 👑" : ""}</span></li>`).join("")}</ol>
    ${isHost ? `<button class="btn" id="start" type="button" ${L.players.length < 2 ? "disabled" : ""}>${L.players.length < 2 ? "استنى لاعب ثاني على الأقل" : "يلا نبلّش ✂️"}</button>` : `<p class="note">صاحب الغرفة بيبلّش لما الكل يدخل</p>`}
    <button class="linkish" id="out" type="button">${isHost ? "سكّر الغرفة" : "اطلع"}</button>`);
  bind({ out: leave, start: () => { newGame(L.players); commit(); },
    share: async () => { const text = `تعالوا نلعب «قسمة ونصيب»! كود الغرفة ${room}`;
      try { if (navigator.share) return await navigator.share({ title: "قسمة ونصيب", text, url: link }); } catch { return; }
      try { await navigator.clipboard.writeText(text + "\n" + link); $("share").textContent = "انسخ الرابط ✓"; } catch {} } });
}
function fail(msg) { render(`<h1>مشكلة بالاتصال</h1><p class="sub">${esc(msg)}</p><button class="btn" id="back" type="button">رجوع</button>`); bind({ back: leave }); }
function leave() {
  try { if (client && mode === "host" && room) { client.publish(topic("lobby"), "", { qos: 1, retain: true }); G?.players.forEach((p) => client.publish(topic("v/" + p.id), "", { qos: 1, retain: true })); } } catch {}
  const c = client; setTimeout(() => { try { c?.end(true); } catch {} }, 400);
  if (mode === "solo" || mode === "local") store.set("save", null);
  client = null; room = null; G = null; VIEW = null; LOBBY = null; mode = null; clearTimeout(botTimer); lastV = -1;
  history.replaceState(null, "", location.pathname);
  intro();
}

// ================= البداية =================
function intro() {
  const saved = store.get("save", null);
  const lvl = store.get("level", "medium"), bots = store.get("bots", 1);
  render(`<div><h1>إنت بتقسم... وهم بيختاروا</h1><p class="sub">بس إنت الوحيد اللي شايف الورق! اكشف شوي، خبّي شوي، واضحك عليهم 😏</p></div>
    
    <div class="legend">${[{ k: "n", v: 7 }, { k: "b", v: -4 }, { k: "x", v: 0 }, { k: "g", v: 10 }, { k: "f", v: 0 }].map((c) => cardHtml(c)).join("")}</div>
    ${saved && saved.G && saved.G.phase !== "over" ? `<button class="btn gold" id="resume" type="button">كمّل اللعبة اللي وقفت</button>` : ""}
    <h2>🤖 ضد الكمبيوتر</h2>
    <p class="label">المستوى</p>
    <div class="seg" id="lvl">${[["easy", "سهل"], ["medium", "متوسط"], ["hard", "صعب"]].map(([k, t]) => `<button type="button" data-lvl="${k}" aria-pressed="${lvl === k}">${t}</button>`).join("")}</div>
    <p class="label">عدد الخصوم</p>
    <div class="seg" id="bots">${[1, 2, 3, 4].map((k) => `<button type="button" data-bots="${k}" aria-pressed="${bots === k}">${k}</button>`).join("")}</div>
    <button class="btn" id="solo" type="button">العب ضد الكمبيوتر</button>
    <h2>👥 مع صحابك</h2>
    <input class="input" id="name" type="text" maxlength="14" placeholder="اسمك" value="${esc(me.name)}" autocomplete="off">
    <button class="btn alt" id="local" type="button">على تلفون واحد (بنمرّره)</button>
    <button class="btn alt" id="create" type="button">اعمل غرفة (كل واحد من تلفونه)</button>
    <div class="row"><input class="input" id="code" type="text" inputmode="numeric" maxlength="5" placeholder="كود الغرفة" value="${esc(qs.get("room") || "")}" style="flex:1.4;letter-spacing:4px;text-align:center">
      <button class="btn alt" id="join" type="button" style="flex:1">ادخل</button></div>
    <p class="err" id="err" hidden></p>
    ${howto("qisma", `<ul class="rules">
      <li><b>✂️ القاسم</b> بيشوف كل الورق، وبيقسمه حصص (حصة لكل لاعب)، وبيكشف بس ورقتين (أو قد عدد اللاعبين).</li>
      <li><b>👀 الباقين</b> بيختاروا حصة واحد ورا الثاني، والقاسم بياخذ اللي بتضل.</li>
      <li><b>🔍 بصّة</b>: معك بصّتين باللعبة، بتشوف فيهن ورقة مخفية قبل ما تختار.</li>
      <li><b>🔥 الجولة الأخيرة</b> نقاطها ×2، واللي متأخر هو اللي بيقسم. فرصة ترجع!</li>
    </ul>`)}`);
  document.querySelectorAll("[data-lvl]").forEach((b) => b.onclick = () => { store.set("level", b.dataset.lvl); intro(); });
  document.querySelectorAll("[data-bots]").forEach((b) => b.onclick = () => { store.set("bots", +b.dataset.bots); intro(); });
  const getName = () => { const n = $("name").value.trim(); if (!n) { $("err").hidden = false; $("err").textContent = "اكتب اسمك أول."; $("name").focus(); return null; } me.name = n; store.set("name", n); return n; };
  const BOT_NAMES = ["أبو عودة", "الثعلب", "أم سعيد", "الحاج"];
  bind({
    resume: () => { mode = saved.mode; G = saved.G; LOCAL.gate = null; driveBots(); show(); },
    solo: () => {
      mode = "solo"; const n = $("name").value.trim() || "إنت"; const level = store.get("level", "medium");
      newGame([{ id: "me", name: n }, ...Array.from({ length: store.get("bots", 1) }, (_, i) => ({ id: "bot" + i, name: BOT_NAMES[i], bot: level }))]);
      commit();
    },
    local: () => { getName() && localSetup(); },
    create: () => { getName() && hostRoom(); },
    join: () => { if (!getName()) return; const code = $("code").value.replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "");
      if (code.length !== 5) { $("err").hidden = false; $("err").textContent = "الكود 5 أرقام."; return; } joinRoom(code); },
  });
}
function localSetup() {
  let list = store.get("names", [{ name: me.name, bot: null }, { name: "", bot: null }]);
  const draw = () => {
    render(`<h1>على تلفون واحد</h1><p class="sub">من 2 لـ5 لاعبين. فيكم تضيفوا كمبيوتر 🤖 معكم.</p>
      <div class="plist">${list.map((p, i) => `<div class="item"><input class="input" data-i="${i}" type="text" maxlength="14" placeholder="${p.bot ? "كمبيوتر" : "لاعب " + (i + 1)}" value="${esc(p.name)}"><button class="bot" type="button" data-bot="${i}" aria-pressed="${!!p.bot}" aria-label="كمبيوتر">🤖</button></div>`).join("")}</div>
      <div class="row"><button class="btn alt" id="add" type="button" style="flex:1" ${list.length >= 5 ? "disabled" : ""}>+ لاعب</button><button class="btn alt" id="rem" type="button" style="flex:1" ${list.length <= 2 ? "disabled" : ""}>− لاعب</button></div>
      <p class="err" id="err" hidden></p>
      <button class="btn" id="go" type="button">يلا نبلّش ✂️</button><button class="linkish" id="back" type="button">رجوع</button>`);
    const read = () => document.querySelectorAll("[data-i]").forEach((el) => { list[+el.dataset.i].name = el.value.trim(); });
    document.querySelectorAll("[data-bot]").forEach((b) => b.onclick = () => { read(); const p = list[+b.dataset.bot]; p.bot = p.bot ? null : store.get("level", "medium"); draw(); });
    bind({
      add: () => { read(); list.push({ name: "", bot: null }); draw(); }, rem: () => { read(); list.pop(); draw(); }, back: () => { read(); store.set("names", list); intro(); },
      go: () => {
        read();
        const ps = list.map((p, i) => ({ id: "p" + i, name: p.name || (p.bot ? "كمبيوتر " + (i + 1) : "لاعب " + (i + 1)), bot: p.bot }));
        if (new Set(ps.map((p) => p.name)).size !== ps.length) { $("err").hidden = false; $("err").textContent = "في اسمين متشابهين."; return; }
        if (!ps.some((p) => !p.bot)) { $("err").hidden = false; $("err").textContent = "لازم لاعب واحد على الأقل مش كمبيوتر."; return; }
        store.set("names", list); mode = "local"; LOCAL.gate = null; newGame(ps); commit();
      },
    });
  };
  draw();
}
intro();
if (qs.get("room")) $("code")?.focus();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});
</script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
</body>
