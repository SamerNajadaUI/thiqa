<!doctype html>
<html lang="ar" dir="rtl" class="stage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ملك السهرة</title>
<meta name="theme-color" content="#0E0B24">
<script src="../theme.js"></script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shell.css">
<link rel="stylesheet" href="mini.css">
<style>
/* ملك السهرة: مسرح غامق دايماً، ذهبي للتتويج، ولون لكل مرحلة (--sc). */
:root.stage { --bg: #0E0B24; --ink: #F4F3FF; --brand: #8B74FF; --brand-dark: #5B3DF5; --gold: #FFC53D; --sc: #8B74FF; }
body { background: radial-gradient(90% 55% at 50% -10%, color-mix(in srgb, var(--sc) 38%, transparent), transparent 70%), radial-gradient(70% 40% at 100% 100%, rgb(255 197 61 / .08), transparent 70%), var(--bg); background-attachment: fixed; transition: background .5s; }
.btn.gold { background: linear-gradient(135deg, #FFD466, #F5A524); color: #2A1B00; box-shadow: 0 8px 22px -10px #F5A524; }
.err { color: #FF8A80; font-size: 13px; text-align: center; }
.loading { text-align: center; padding: 60px 0; color: var(--muted); }

/* البداية */
.hero { text-align: center; padding: 10px 0 2px; }
.hero .crown { font-size: 64px; line-height: 1; display: inline-block; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 8px 18px rgb(255 197 61 / .45)); }
.hero h1 { font-size: clamp(40px, 12vw, 54px); background: linear-gradient(180deg, #FFE9A8, #F5A524); -webkit-background-clip: text; background-clip: text; color: transparent; }
@keyframes float { 50% { transform: translateY(-7px) rotate(-4deg); } }
.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.strip::-webkit-scrollbar { display: none; }
.strip span { flex: none; font-size: 12.5px; font-weight: 600; padding: 6px 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); white-space: nowrap; }
.codein { letter-spacing: 4px; text-align: center; font-size: 20px; }

/* الغرفة */
.roomcode { text-align: center; }
.roomcode b { display: block; font-family: var(--display); font-weight: 400; font-size: 58px; letter-spacing: 8px; line-height: 1.1; color: var(--gold); direction: ltr; }
.plist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.plist .pl { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); min-width: 0; animation: pop .25s ease-out both; }
.plist .pl span.n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.plist .pl button { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 2px 6px; }

/* شريط اللعبة والنقاط */
.hud { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.hud .hs { color: var(--ink); background: color-mix(in srgb, var(--sc) 30%, transparent); border: 1px solid color-mix(in srgb, var(--sc) 55%, transparent); border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
.hud .code { margin-inline-start: auto; direction: ltr; opacity: .8; }
.sb { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.sb::-webkit-scrollbar { display: none; }
.sb .s { flex: 1 0 auto; display: flex; align-items: center; gap: 6px; padding: 5px 9px 5px 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 12px; }
.sb .s .av { width: 22px; height: 22px; font-size: 11px; }
.sb .s b { font-family: var(--display); font-weight: 400; font-size: 16px; direction: ltr; color: var(--gold); }
.sb .s.lead { border-color: color-mix(in srgb, var(--gold) 60%, transparent); }
.sb .s.meS { background: color-mix(in srgb, var(--sc) 22%, transparent); }

/* بطاقة المرحلة */
.stagecard { text-align: center; padding: 26px 16px; border-radius: 28px; border: 1px solid color-mix(in srgb, var(--sc) 55%, transparent); background: linear-gradient(170deg, color-mix(in srgb, var(--sc) 34%, transparent), rgb(255 255 255 / .04)); display: flex; flex-direction: column; gap: 8px; align-items: center; animation: rise .5s cubic-bezier(.2,.9,.3,1.2) both; }
.stagecard .ico { font-size: 76px; line-height: 1; animation: bounce .9s cubic-bezier(.3,1.6,.5,1) both; }
.stagecard .k { font-size: 13px; font-weight: 700; letter-spacing: .5px; color: var(--gold); }
.stagecard h1 { font-size: clamp(38px, 11vw, 50px); }
.stagecard .from { font-size: 12px; padding: 3px 12px; border-radius: 999px; background: rgb(255 255 255 / .1); }
.stagecard p { font-size: 14.5px; line-height: 1.7; max-width: 34ch; }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.96); } }
@keyframes bounce { from { transform: scale(.2) rotate(-25deg); opacity: 0; } }
.jokers { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.jk { border: 1px dashed var(--line); background: var(--card); border-radius: 14px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
.jk[aria-pressed="true"] { border: 1px solid var(--gold); background: rgb(255 197 61 / .16); color: var(--gold); }
.jk[disabled] { opacity: .35; }

/* السؤال والخيارات */
.q { padding: 16px 14px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; animation: rise .35s ease-out both; }
.q .cat { font-size: 12px; font-weight: 700; color: var(--gold); }
.q b { font-size: 19px; font-weight: 600; line-height: 1.6; }
.q img { max-width: 100%; max-height: 190px; border-radius: 14px; background: #FFF; object-fit: contain; }
.opts { display: grid; gap: 8px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { position: relative; border: 0; border-radius: 16px; padding: 14px 12px; min-height: 58px; font-weight: 600; font-size: 15.5px; line-height: 1.4; color: #FFF; background: var(--oc, #3B3F58); box-shadow: inset 0 -4px 0 rgb(0 0 0 / .22); text-align: center; overflow-wrap: anywhere; transition: transform .1s; }
.opt:active:not([disabled]) { transform: scale(.97); }
.opt[disabled] { opacity: .45; }
.opt.o0 { --oc: #E5484D; } .opt.o1 { --oc: #2E7BF5; } .opt.o2 { --oc: #E09B10; } .opt.o3 { --oc: #1FA863; }
.opt.plain { --oc: rgb(255 255 255 / .1); border: 1px solid var(--line); box-shadow: none; }
.opt.right { --oc: #1FA863; outline: 3px solid #9BF0C4; }
.opt.wrong { --oc: rgb(255 255 255 / .06); color: var(--muted); box-shadow: none; }
.opt .tag { display: block; font-size: 11.5px; font-weight: 600; opacity: .85; margin-top: 3px; }
.opt .voters { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 6px; }
.opt .voters .av { width: 22px; height: 22px; font-size: 11px; box-shadow: 0 0 0 2px rgb(0 0 0 / .25); }
.who { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.who button { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 12px 10px; font-weight: 600; min-width: 0; }
.who button span.n { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who button:active { transform: scale(.97); background: color-mix(in srgb, var(--sc) 30%, transparent); }
.textrow { display: flex; gap: 8px; }
.textrow .input { background: rgb(255 255 255 / .08); }
.prog { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chips .c { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 4px 10px 4px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); opacity: .55; }
.chips .c.done { opacity: 1; border-color: #1FA863; }
.chips .c .av { width: 20px; height: 20px; font-size: 10px; }
.wait { text-align: center; color: var(--muted); font-size: 14px; }
.wait .dots i { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--sc); animation: dot 1s infinite ease-in-out; }
.wait .dots i:nth-child(2) { animation-delay: .15s; } .wait .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-6px); opacity: .4; } }

/* نفس الموجة */
.wave { direction: ltr; padding: 34px 6px 8px; }
.wave .ends { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; margin-bottom: 8px; gap: 10px; }
.wave .ends span { max-width: 46%; }
.wave .bar { position: relative; height: 26px; border-radius: 999px; background: linear-gradient(90deg, #2E7BF5, #8B74FF 50%, #E5484D); }
.wave .zone { position: absolute; top: -5px; bottom: -5px; width: 12%; margin-left: -6%; border-radius: 10px; background: rgb(255 197 61 / .55); border: 2px solid var(--gold); }
.wave .zone::after { content: "🎯"; position: absolute; left: 50%; top: -30px; transform: translateX(-50%); font-size: 20px; }
.wave .pin { position: absolute; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; }
.wave .pin .av { width: 26px; height: 26px; font-size: 12px; box-shadow: 0 0 0 2px #FFF; }
.wave input[type=range] { width: 100%; margin: 14px 0 0; accent-color: var(--gold); height: 34px; }
.clue { font-family: var(--display); font-size: 34px; line-height: 1.2; color: var(--gold); }

/* تمثيل وقنبلة */
.clock { font-family: var(--display); font-size: 44px; line-height: 1; direction: ltr; text-align: center; }
.clock.low { color: #FF6B6B; animation: pulse .5s infinite alternate; }
@keyframes pulse { to { transform: scale(1.12); } }
.bigword { text-align: center; padding: 26px 12px; border-radius: 26px; background: linear-gradient(160deg, color-mix(in srgb, var(--sc) 45%, transparent), rgb(255 255 255 / .05)); border: 1px solid color-mix(in srgb, var(--sc) 60%, transparent); }
.bigword small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
.bigword b { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 13vw, 60px); line-height: 1.2; }
.bomb { font-size: 120px; line-height: 1; text-align: center; animation: shakeb .35s infinite; filter: drop-shadow(0 10px 26px rgb(229 72 77 / .55)); }
.bomb.calm { animation: none; opacity: .5; font-size: 84px; }
@keyframes shakeb { 25% { transform: rotate(-7deg) scale(1.03); } 75% { transform: rotate(7deg) scale(.98); } }
.boom { font-size: 110px; text-align: center; animation: boom .6s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes boom { from { transform: scale(.1); opacity: 0; } }
.handoff { background: linear-gradient(160deg, color-mix(in srgb, var(--sc) 35%, transparent), rgb(255 255 255 / .05)); border-color: color-mix(in srgb, var(--sc) 50%, transparent); }

/* النتايج */
.deltas { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.deltas span { font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: rgb(31 168 99 / .18); color: #7BE8B0; animation: pop .3s ease-out both; }
.deltas span.neg { background: rgb(229 72 77 / .18); color: #FF9A9A; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.rowi { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); animation: rise .35s ease-out both; }
.rowi .n { font-weight: 600; min-width: 0; flex: 1; }
.rowi .n small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.rowi b { font-family: var(--display); font-weight: 400; font-size: 24px; direction: ltr; color: var(--gold); }
.rowi .g { font-size: 12.5px; font-weight: 700; color: #7BE8B0; direction: ltr; }
.rowi .g.neg { color: #FF9A9A; }
.rowi .rk { width: 26px; text-align: center; font-size: 19px; }
.rowi.first { border-color: var(--gold); background: linear-gradient(135deg, rgb(255 197 61 / .2), rgb(255 255 255 / .05)); }
.meter { height: 8px; border-radius: 8px; background: rgb(255 255 255 / .1); overflow: hidden; margin-top: 5px; }
.meter i { display: block; height: 100%; border-radius: 8px; background: var(--sc); }
.king { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 12px; }
.king .crown { font-size: 76px; line-height: 1; animation: bounce 1s cubic-bezier(.3,1.6,.5,1) both; filter: drop-shadow(0 8px 20px rgb(255 197 61 / .5)); }
.king b { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 12vw, 56px); line-height: 1.15; background: linear-gradient(180deg, #FFE9A8, #F5A524); -webkit-background-clip: text; background-clip: text; color: transparent; }
.award { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }
.award .e { font-size: 26px; }
.award small { display: block; color: var(--muted); font-size: 12px; }
.dare { text-align: center; padding: 16px; border-radius: 22px; border: 1px dashed #FF8A80; background: rgb(229 72 77 / .12); display: flex; flex-direction: column; gap: 6px; }
.dare b { font-size: 18px; line-height: 1.6; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
ul.rules { margin: 0; padding-inline-start: 18px; font-size: 13.5px; line-height: 1.9; color: var(--muted); }
ul.rules b { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header class="gbar" data-game="sahra" data-theme-fixed></header>
  <main id="app"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="../shell.js"></script>
<script src="mini.js"></script>
<script src="sahra-content.js"></script>
<script src="sahra.js"></script>
</body>
</html>
