<!doctype html>
<html lang="ar" dir="rtl" class="stage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ملك السهرة</title>
<meta name="theme-color" content="#0B1437">
<script src="../theme.js"></script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shell.css">
<link rel="stylesheet" href="mini.css">
<style>
/* ملك السهرة: شكل «ليلة المباراة» زي شاشة النقل التلفزيوني.
   أزرق ليلي، الزر الأساسي كرت أصفر، الخطر كرت أحمر، ولوحة نتيجة زي الملعب. --sc لون المرحلة. */
:root.stage {
  --bg: #0B1437; --panel: #16224F; --raise: #1F2E69; --edge: #070D26; --line: #31428A;
  --ink: #FFFFFF; --muted: #AEB9E3; --yellow: #FFD21F; --red: #E8323C; --green: #19A35B; --sky: #39B8FF; --sc: #FFD21F;
  --card: var(--panel); --soft: var(--raise); --brand: var(--yellow); --brand-dark: #B8930A; --brand-soft: var(--raise); --good: #2FD27F; --bad: var(--red);
}
/* خطوط الملعب: دائرة السنتر فوق، وتقليم العشب، وضو كشّافات بلون المرحلة */
body { background:
    radial-gradient(circle at 50% -40px, transparent 0 128px, rgb(255 255 255 / .08) 129px 131px, transparent 132px),
    radial-gradient(80% 46% at 50% -8%, color-mix(in srgb, var(--sc) 34%, transparent), transparent 72%),
    repeating-linear-gradient(90deg, rgb(255 255 255 / .022) 0 44px, transparent 44px 88px), var(--bg);
  background-attachment: fixed; }
h1, h2 { letter-spacing: 0; }
.sub, .note, .wait { color: var(--muted); }
.err { color: #FF9AA0; font-size: 13px; text-align: center; }
.loading { text-align: center; padding: 60px 0; color: var(--muted); }
.label { color: var(--muted); }
.input { background: var(--edge); border: 2px solid var(--line); border-radius: 14px; color: var(--ink); }
.input::placeholder { color: #7482B8; }
.input:focus { border-color: var(--yellow); outline: none; }

/* الأزرار: كروت سميكة بتنكبس */
.btn { background: var(--yellow); color: #1B1600; border-radius: 14px; box-shadow: 0 5px 0 var(--brand-dark); transition: transform .08s, box-shadow .08s; }
.btn:active:not([disabled]) { transform: translateY(4px); box-shadow: 0 1px 0 var(--brand-dark); }
.btn.alt { background: var(--raise); color: var(--ink); border: 0; box-shadow: 0 5px 0 var(--edge); }
.btn.alt:active:not([disabled]) { box-shadow: 0 1px 0 var(--edge); }
.btn.bad { background: var(--red); color: #FFF; box-shadow: 0 5px 0 #8E1219; }
.btn.blue { background: var(--sky); color: #04233A; box-shadow: 0 5px 0 #17709F; }
.btn.sm { border-radius: 12px; box-shadow: 0 4px 0 var(--brand-dark); }
.btn.sm.alt { box-shadow: 0 4px 0 var(--edge); }
.linkish { color: var(--muted); }
.seg { background: var(--edge); border: 2px solid var(--line); border-radius: 14px; }
.seg button { border-radius: 9px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--yellow); color: #1B1600; box-shadow: none; }
.av { border-radius: 8px; background: hsl(var(--h, 200) 72% 52%); }
.mus { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--raise); font-size: 16px; padding: 0; box-shadow: 0 3px 0 var(--edge); }
.mus[aria-pressed="false"] { opacity: .6; }

/* شريط مايل (زي أسماء اللاعبين بالنقل) */
.tagk { display: inline-block; transform: skewX(-12deg); background: color-mix(in srgb, var(--sc) 82%, #FFF); color: #0B1437; padding: 3px 12px; border-radius: 4px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.tagk i { display: inline-block; transform: skewX(12deg); font-style: normal; }

/* البداية */
.hero { text-align: center; padding: 4px 0 2px; position: relative; }
.hero .top, .roomcode .top { position: absolute; top: 0; inset-inline-end: 0; }
.hero .crown { font-size: 60px; line-height: 1; display: block; }
.hero h1 { font-size: clamp(46px, 14vw, 62px); line-height: 1.05; color: var(--yellow); text-shadow: 0 4px 0 #7A5B00; }
.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; }
.strip::-webkit-scrollbar { display: none; }
.strip span { flex: none; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 6px; background: var(--panel); border-bottom: 3px solid var(--sc); white-space: nowrap; }
.codein { letter-spacing: 4px; text-align: center; font-size: 20px; }
details.howto { background: var(--panel); border: 0; border-radius: 14px; }
ul.rules { margin: 0; padding-inline-start: 18px; font-size: 13.5px; line-height: 1.9; color: var(--muted); }
ul.rules b { color: var(--ink); }

/* الغرفة */
.roomcode { position: relative; text-align: center; background: var(--panel); border-top: 5px solid var(--yellow); border-radius: 6px 6px 18px 18px; padding: 14px; }
.roomcode b { display: block; font-family: var(--display); font-weight: 400; font-size: 64px; letter-spacing: 10px; line-height: 1.1; color: var(--yellow); direction: ltr; font-variant-numeric: tabular-nums; }
.plist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.plist .pl { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 12px; background: var(--panel); min-width: 0; }
.plist .pl span.n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.plist .pl button { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 2px 6px; }

/* شريط المباراة ولوحة النتيجة */
.hud { display: flex; align-items: center; gap: 10px; }
.hud .meta { display: flex; flex-direction: column; font-size: 11.5px; line-height: 1.35; color: var(--muted); font-weight: 600; margin-inline-end: auto; }
.hud .code { direction: ltr; font-family: var(--display); font-size: 17px; color: var(--muted); letter-spacing: 1px; }
.tbar { height: 8px; border-radius: 8px; background: var(--edge); overflow: hidden; direction: ltr; }
.tbar i { display: block; height: 100%; width: 100%; background: var(--yellow); border-radius: 8px; transition: width .2s linear; }
.tbar.low i { background: var(--red); }
.bug { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 3px; }
.bug::-webkit-scrollbar { display: none; }
.bug .cell { flex: 1 0 auto; display: flex; align-items: center; gap: 7px; background: var(--panel); border-radius: 8px; padding: 4px 5px 4px 9px; font-size: 12.5px; font-weight: 600; border-bottom: 3px solid transparent; }
.bug .cell em { font-style: normal; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; background: var(--raise); font-size: 11px; color: var(--muted); }
.bug .cell b { font-family: var(--display); font-weight: 400; font-size: 17px; background: var(--edge); color: var(--yellow); border-radius: 5px; padding: 0 8px; min-width: 44px; text-align: center; direction: ltr; font-variant-numeric: tabular-nums; }
.bug .cell.lead { border-bottom-color: var(--yellow); }
.bug .cell.lead em { background: var(--yellow); color: #1B1600; }
.bug .cell.mine { background: var(--raise); }
.golden { transform: skewX(-8deg); text-align: center; font-weight: 700; font-size: 14px; color: #1B1600; background: linear-gradient(90deg, #FFD21F, #FF9D2E); border-radius: 6px; padding: 6px 10px; animation: flash .5s 3 alternate; }
@keyframes flash { to { filter: brightness(1.35); } }

/* بوستر المرحلة */
.poster { position: relative; overflow: hidden; text-align: center; padding: 26px 16px 22px; border-radius: 6px 6px 22px 22px; border-top: 6px solid var(--sc);
  background: linear-gradient(165deg, color-mix(in srgb, var(--sc) 46%, var(--panel)), var(--panel) 70%); display: flex; flex-direction: column; gap: 8px; align-items: center; animation: slam .45s cubic-bezier(.2,.9,.3,1.15) both; }
.poster .num { position: absolute; top: -52px; inset-inline-start: 2px; font-family: var(--display); font-size: 230px; line-height: 1; color: transparent; -webkit-text-stroke: 2px rgb(255 255 255 / .16); pointer-events: none; }
.poster .ico { font-size: 74px; line-height: 1; animation: bounce .8s .15s cubic-bezier(.3,1.6,.5,1) both; }
.poster h1 { font-size: clamp(42px, 13vw, 58px); line-height: 1.1; text-shadow: 0 4px 0 rgb(0 0 0 / .3); }
.poster p { font-size: 14.5px; line-height: 1.75; max-width: 34ch; }
.poster .meta { font-size: 12.5px; font-weight: 600; color: var(--muted); }
@keyframes slam { from { opacity: 0; transform: scale(1.12); } }
@keyframes bounce { from { transform: scale(.2) rotate(-25deg); opacity: 0; } }
.jokers { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.jk { border: 2px dashed var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
.jk[aria-pressed="true"] { border: 2px solid var(--yellow); background: var(--yellow); color: #1B1600; }
.jk[disabled] { opacity: .35; }

/* لوحة السؤال والخيارات */
.q { padding: 16px 14px; border-radius: 6px 6px 18px 18px; background: var(--panel); border-top: 5px solid var(--sc); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.q .cat { font-size: 12px; font-weight: 700; color: color-mix(in srgb, var(--sc) 70%, #FFF); }
.q > b { font-size: 19px; font-weight: 600; line-height: 1.6; }
.q img { max-width: 100%; max-height: 190px; border-radius: 10px; background: #FFF; object-fit: contain; }
.q img.face { width: 110px; height: 110px; object-fit: cover; border-radius: 50%; border: 4px solid var(--yellow); }
.opts { display: grid; gap: 9px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { position: relative; border: 0; border-radius: 12px; padding: 14px 10px; min-height: 60px; font-weight: 600; font-size: 15.5px; line-height: 1.4; color: #FFF; background: var(--oc, var(--raise)); box-shadow: 0 5px 0 color-mix(in srgb, var(--oc, var(--raise)) 60%, #000); text-align: center; overflow-wrap: anywhere; transition: transform .08s, background .25s; }
.opt:active:not([disabled]) { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--oc, var(--raise)) 60%, #000); }
.opt[disabled] { opacity: .45; }
.opt .lt { position: absolute; top: 5px; inset-inline-start: 7px; font-family: var(--display); font-size: 15px; opacity: .7; line-height: 1; }
.opt.o0 { --oc: #E8323C; } .opt.o1 { --oc: #2B7DE9; } .opt.o2 { --oc: #E59A00; } .opt.o3 { --oc: #19A35B; }
.opt.plain { --oc: var(--raise); }
.opt.right { --oc: #19A35B; outline: 3px solid #A6F5CB; animation: pop .3s ease-out; }
.opt.wrong { --oc: #121B40; color: #7482B8; box-shadow: none; }
.opt .tag { display: block; font-size: 11.5px; font-weight: 600; opacity: .9; margin-top: 3px; }
.voters { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 6px; }
.voters .av, .chips .av, .balls .av { width: 22px; height: 22px; font-size: 11px; border-radius: 6px; }
.voters .av { box-shadow: 0 0 0 2px rgb(0 0 0 / .3); }
/* التشويق: قبل الكشف كل الخيارات محايدة، والنتيجة مخفية */
.pre .opt.right, .pre .opt.wrong, .pre .opt.plain { --oc: var(--raise); color: #FFF; outline: 0; box-shadow: 0 5px 0 var(--edge); animation: none; }
.pre .opt .tag, .pre .voters, .pre .late, .pre .glove { visibility: hidden; }
.pre .q > b:not(.late) { animation: throb .35s infinite alternate; }
@keyframes throb { to { opacity: .55; } }
.who { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.who button { display: flex; align-items: center; gap: 8px; border: 0; background: var(--raise); border-radius: 12px; padding: 12px 10px; font-weight: 600; min-width: 0; box-shadow: 0 5px 0 var(--edge); }
.who button span.n { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge); }
.textrow { display: flex; gap: 8px; }
.prog { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chips .c { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 4px 9px 4px 5px; border-radius: 8px; background: var(--panel); opacity: .5; }
.chips .c.done { opacity: 1; box-shadow: inset 0 -3px 0 var(--good); }
.wait { text-align: center; font-size: 14px; }
.wait .dots i { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--yellow); animation: dot 1s infinite ease-in-out; }
.wait .dots i:nth-child(2) { animation-delay: .15s; } .wait .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-6px); opacity: .4; } }
.handoff { border-radius: 6px 6px 22px 22px; border: 0; border-top: 6px solid var(--sc); background: linear-gradient(165deg, color-mix(in srgb, var(--sc) 40%, var(--panel)), var(--panel) 75%); box-shadow: none; }
.handoff .big { font-size: 44px; }
.handoff p { color: #D6DCF5; }

/* ركلات الترجيح: المرمى */
.goal { direction: ltr; display: grid; grid-template-columns: repeat(3, 1fr); height: 170px; border: 7px solid #FFF; border-bottom: 0; border-radius: 8px 8px 0 0;
  background: repeating-linear-gradient(0deg, rgb(255 255 255 / .13) 0 2px, transparent 2px 16px), repeating-linear-gradient(90deg, rgb(255 255 255 / .13) 0 2px, transparent 2px 16px), #0F5F3A; box-shadow: 0 10px 0 #19A35B; margin-bottom: 10px; }
.goal .zone { position: relative; border: 0; background: none; color: #FFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 44px; line-height: 1; padding: 0; }
.goal .zone + .zone { border-inline-start: 2px dashed rgb(255 255 255 / .35); }
.goal button.zone:active { background: rgb(255 255 255 / .2); }
.goal .zone small { font-size: 12px; font-weight: 700; font-family: var(--font); position: absolute; bottom: 6px; opacity: .85; }
.goal .glove { font-size: 54px; animation: dive .35s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes dive { from { transform: translateY(40px) scale(.4); opacity: 0; } }
.goal .balls { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; max-width: 90%; }
.goal .balls .av { box-shadow: 0 0 0 2px #FFF; border-radius: 50%; }

/* مين اللاعب: الأندية بتنكشف وحدة وحدة */
.clubs { width: 100%; display: flex; flex-direction: column; gap: 5px; text-align: start; }
.club { display: flex; align-items: center; gap: 10px; background: var(--raise); border-radius: 10px; padding: 6px 10px; min-height: 46px; }
.club .no { font-family: var(--display); font-size: 16px; color: var(--muted); width: 16px; text-align: center; }
.club img { width: 34px; height: 34px; object-fit: contain; background: none; border-radius: 0; max-height: none; }
.club .n { font-weight: 600; font-size: 14.5px; }
.club .n small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; direction: ltr; text-align: end; }
.club.hid { background: var(--edge); }
.club.hid img, .club.hid .n { display: none; }
.club.hid::after { content: "؟"; font-family: var(--display); font-size: 20px; color: var(--line); }
.club:not(.hid) { animation: pop .3s ease-out; }
.worth { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--yellow); }

/* نفس الموجة */
.wave { direction: ltr; padding: 34px 6px 8px; width: 100%; }
.wave .ends { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; margin-bottom: 8px; gap: 10px; }
.wave .ends span { max-width: 46%; }
.wave .bar { position: relative; height: 26px; border-radius: 8px; background: linear-gradient(90deg, #2B7DE9, #8E7BFF 50%, #E8323C); }
.wave .zone { position: absolute; top: -5px; bottom: -5px; width: 12%; margin-left: -6%; border-radius: 6px; background: rgb(255 210 31 / .55); border: 2px solid var(--yellow); }
.wave .zone::after { content: "🎯"; position: absolute; left: 50%; top: -30px; transform: translateX(-50%); font-size: 20px; }
.wave .pin { position: absolute; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; }
.wave .pin .av { width: 26px; height: 26px; font-size: 12px; box-shadow: 0 0 0 2px #FFF; }
input[type=range] { width: 100%; margin: 14px 0 0; accent-color: var(--yellow); height: 34px; }
.clue { font-family: var(--display); font-size: 36px; line-height: 1.2; color: var(--yellow); }

/* تمثيل وقنبلة */
.clock { font-family: var(--display); font-size: 54px; line-height: 1; direction: ltr; text-align: center; font-variant-numeric: tabular-nums; }
.clock.low { color: var(--red); animation: pulse .5s infinite alternate; }
@keyframes pulse { to { transform: scale(1.12); } }
.bigword { text-align: center; padding: 22px 12px 26px; border-radius: 6px 6px 22px 22px; border-top: 6px solid var(--sc); background: linear-gradient(165deg, color-mix(in srgb, var(--sc) 45%, var(--panel)), var(--panel)); }
.bigword small { display: block; font-size: 12.5px; color: #D6DCF5; font-weight: 600; margin-bottom: 12px; }
.bigword b { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 13vw, 60px); line-height: 1.25; }
.bomb { font-size: 120px; line-height: 1; text-align: center; animation: shakeb .35s infinite; filter: drop-shadow(0 10px 26px rgb(232 50 60 / .6)); }
.bomb.calm { animation: none; opacity: .5; font-size: 84px; }
@keyframes shakeb { 25% { transform: rotate(-7deg) scale(1.03); } 75% { transform: rotate(7deg) scale(.98); } }
.boom { font-size: 110px; text-align: center; animation: boom .6s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes boom { from { transform: scale(.1); opacity: 0; } }

/* النتايج والترتيب */
.deltas { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.deltas span { font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 6px; background: #0F3F2A; color: #7DF0B5; }
.deltas span.neg { background: #4A1218; color: #FF9AA0; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.rowi { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--panel); }
.rows.table .rowi { animation: rise .35s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.rowi .n { font-weight: 600; min-width: 0; flex: 1; }
.rowi .n small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.rowi > b { font-family: var(--display); font-weight: 400; font-size: 24px; direction: ltr; color: var(--yellow); background: var(--edge); border-radius: 6px; padding: 0 10px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.rowi .g { font-size: 12.5px; font-weight: 700; color: #7DF0B5; direction: ltr; }
.rowi .g.neg { color: #FF9AA0; }
.rowi .rk { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--raise); font-family: var(--display); font-size: 16px; flex: none; }
.rowi.first { box-shadow: inset 4px 0 0 var(--yellow), inset -4px 0 0 var(--yellow); background: var(--raise); }
.rowi.first .rk { background: var(--yellow); color: #1B1600; }
.up { color: #7DF0B5; font-size: 11.5px; } .down { color: #FF9AA0; font-size: 11.5px; }
.meter { height: 8px; border-radius: 8px; background: var(--edge); overflow: hidden; margin-top: 5px; }
.meter i { display: block; height: 100%; border-radius: 8px; background: var(--sc); }
.king { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 12px; }
.king .crown { font-size: 84px; line-height: 1; animation: bounce 1s cubic-bezier(.3,1.6,.5,1) both; }
.king b { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 13vw, 60px); line-height: 1.15; color: var(--yellow); text-shadow: 0 4px 0 #7A5B00; }
.award { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--panel); font-size: 14px; }
.award .e { font-size: 26px; }
.award small { display: block; color: var(--muted); font-size: 12px; }
.dare { text-align: center; padding: 16px; border-radius: 6px 6px 18px 18px; border-top: 6px solid var(--red); background: #3A1220; display: flex; flex-direction: column; gap: 6px; }
.dare b { font-size: 18px; line-height: 1.6; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="gbar" data-game="sahra" data-theme-fixed></header>
  <main id="app"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="../shell.js"></script>
