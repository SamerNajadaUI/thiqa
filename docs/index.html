<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFAF4">
<script src="theme.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="تعليلة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="ds/ui.css">
<style>html,body{margin:0;touch-action:manipulation}body{font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}*{box-sizing:border-box}</style>
<title>تعليلة</title>
<style>html.skip body{visibility:hidden}</style>
<script>try{if(sessionStorage.getItem("splash-seen"))document.documentElement.classList.add("skip")}catch(e){}</script>
</head>
<body>
<main class="fullscreen splash grad bg" aria-label="تعليلة">
  <i></i>
  <img class="logo" src="icons/icon.svg" alt="">
  <h1>تعليلة</h1>
  <p>ألعاب كورة مع صحابك</p>
  <div class="bar" aria-hidden="true"><i></i></div>
</main>
<script>window.APP_PUBLIC = true;</script>
<script src="app/firebase-config.js"></script>
<script src="app/core.js"></script>
<script>
(function () {
  var dest = Auth.user() ? "home.html" : "login.html";
  var seen = false; try { seen = !!sessionStorage.getItem("splash-seen"); sessionStorage.setItem("splash-seen", "1"); } catch (e) {}
  // الأيقونة القديمة بتفتح الجذر مع ?source=ios أو ?source=app؛ بنحافظ على الباراميتر
  var q = location.search;
  if (seen) return location.replace(dest + q);
  setTimeout(function () { location.replace(dest + q); }, 1800);
})();
</script>
</body>
</html>
